<body>
  <div class="page-header">
    <div>
      <div class="page-title">资讯管理</div>
      <div class="page-subtitle">管理微信端的农技资讯内容</div>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ 新增资讯</button>
  </div>

  <div class="stats-card" id="statsCard">
  </div>

  <div class="card">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索资讯标题..." oninput="searchNews()">
      <select class="filter-select" id="categoryFilter" onchange="filterNews()">
        <option value="all">全部分类</option>
        <option value="资讯">资讯</option>
        <option value="学习">学习</option>
        <option value="视频">视频</option>
        <option value="法规">法规</option>
      </select>
      <select class="filter-select" id="statusFilter" onchange="filterNews()">
        <option value="all">全部状态</option>
        <option value="草稿">草稿</option>
        <option value="已发布">已发布</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>标题</th>
            <th>分类</th>
            <th>发布时间</th>
            <th>阅读量</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="newsTable">
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination">
    </div>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="add-modal-title">新增资讯</div>
        <button class="btn btn-secondary" onclick="closeModal('add-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="form-item">
          <label class="form-label">标题 *</label>
          <input type="text" class="form-input" id="add-title" placeholder="请输入资讯标题">
        </div>
        <div class="form-item">
          <label class="form-label">分类 *</label>
          <select class="form-select" id="add-category">
            <option value="资讯">资讯</option>
            <option value="学习">学习</option>
            <option value="视频">视频</option>
            <option value="法规">法规</option>
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">资讯图片</label>
          <div class="image-upload-area" onclick="document.getElementById('add-image').click()">
            <img id="image-preview" src="" alt="预览" style="display:none; max-width:100%; max-height:200px; border-radius:6px; margin:0 auto;">
            <div id="image-placeholder" class="image-placeholder">点击上传图片</div>
          </div>
          <input type="file" id="add-image" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button class="btn btn-secondary" type="button" onclick="document.getElementById('add-image').click()">选择图片</button>
            <button class="btn btn-secondary" type="button" onclick="clearImage()">移除图片</button>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">摘要</label>
          <div id="summary-editor"></div>
        </div>
        <div class="form-item">
          <label class="form-label">内容 *</label>
          <div id="content-editor"></div>
        </div>
        <div class="form-item">
          <label class="form-label">状态</label>
          <select class="form-select" id="add-status">
            <option value="草稿">草稿</option>
            <option value="已发布">已发布</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('add-modal')">取消</button>
        <button class="btn btn-primary" onclick="submitAdd()">确认</button>
      </div>
    </div>
  </div>

  <!-- 查看弹窗 -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">资讯详情</div>
        <button class="btn btn-secondary" onclick="closeModal('detail-modal')">关闭</button>
      </div>
      <div class="modal-body" id="detail-content">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('detail-modal')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 发布弹窗 -->
  <div id="publish-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">确认发布</div>
        <button class="btn btn-secondary" onclick="closeModal('publish-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <p>确定要发布资讯 <span id="publish-title" style="font-weight:bold;"></span> 吗？</p>
        <p style="font-size:12px;color:#8898aa;margin-top:8px;">发布后用户将在微信小程序端看到该资讯</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('publish-modal')">取消</button>
        <button class="btn btn-primary" onclick="submitPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <!-- 删除弹窗 -->
  <div id="delete-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">确认删除</div>
        <button class="btn btn-secondary" onclick="closeModal('delete-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <p>确定要删除资讯 <span id="delete-name" style="font-weight:bold;"></span> 吗？</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('delete-modal')">取消</button>
        <button class="btn btn-primary" onclick="submitDelete()">确认删除</button>
      </div>
    </div>
  </div>

      { id: 'nw-018', title: '农产品认证管理办法', category: '法规', summary: '了解农产品认证的相关规定和流程。', content: '了解农产品认证的相关规定和流程，包括绿色食品认证、有机食品认证等。', publishTime: '2026-07-05 15:00', views: '876', status: '草稿' },
      { id: 'nw-019', title: '蜜桔疏果技术要点', category: '学习', summary: '合理疏果可提高果实品质和产量。', content: '合理疏果可提高果实品质和产量，本文介绍了蜜桔疏果的技术要点和时间安排。', publishTime: '2026-07-04 10:30', views: '1789', status: '已发布' },
      { id: 'nw-020', title: '生态种植模式探讨', category: '资讯', summary: '探讨蜜桔生态种植的新模式和方法。', content: '探讨蜜桔生态种植的新模式和方法，包括生物防治、有机种植、循环农业等方面的内容。', publishTime: '2026-07-03 16:15', views: '1456', status: '已发布' }
    ];

    var NEWS_IMG = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Nanfeng%20tangerine%20orchard%20with%20ripe%20orange%20fruits%20on%20trees%2C%20agricultural%20farm%20photograph&image_size=landscape_16_9';
    newsData.forEach(function(n) { n.image = NEWS_IMG; });

    var originalNews = JSON.parse(JSON.stringify(newsData));
    var currentPage = 1;
    var pageSize = 10;
    var deleteTargetId = null;
    var publishTargetId = null;
    var currentImage = '';
    var quillSummary = null;
    var quillContent = null;

    function initEditors() {
      if (quillSummary && quillContent) return;
      quillSummary = new Quill('#summary-editor', {
        theme: 'snow',
        modules: { toolbar: [['bold', 'italic', 'underline'], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['link'], ['clean']] },
        placeholder: '请输入资讯摘要'
      });
      quillContent = new Quill('#content-editor', {
        theme: 'snow',
        modules: { toolbar: [['bold', 'italic', 'underline'], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['link', 'image'], ['clean']] },
        placeholder: '请输入资讯内容'
      });
    }

    function setEditorHTML(selector, html) {
      document.querySelector(selector + ' .ql-editor').innerHTML = html || '';
    }
    function getEditorHTML(selector) {
      return document.querySelector(selector + ' .ql-editor').innerHTML;
    }
    function isEditorEmpty(selector) {
      var text = document.querySelector(selector + ' .ql-editor').innerText.trim();
      return !text;
    }

    function showImagePreview(src) {
      var img = document.getElementById('image-preview');
      var ph = document.getElementById('image-placeholder');
      if (src) {
        img.src = src;
        img.style.display = 'block';
        ph.style.display = 'none';
      } else {
        img.style.display = 'none';
        ph.style.display = 'block';
      }
    }
    function handleImageUpload(input) {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        currentImage = e.target.result;
        showImagePreview(currentImage);
      };
      reader.readAsDataURL(file);
    }
    function clearImage() {
      currentImage = '';
      document.getElementById('add-image').value = '';
      showImagePreview('');
    }

    function renderStats() {
      var newsCount = originalNews.filter(function(n) { return n.category === '资讯'; }).length;
      var learningCount = originalNews.filter(function(n) { return n.category === '学习'; }).length;
      var lawCount = originalNews.filter(function(n) { return n.category === '法规'; }).length;
      var videoCount = originalNews.filter(function(n) { return n.category === '视频'; }).length;
      
      var statsCard = document.getElementById('statsCard');
      statsCard.innerHTML = `
        <div class="stat-item">
          <div class="stat-info">
            <div class="stat-number">${newsCount}</div>
            <div class="stat-label">图文资讯</div>
          </div>
          <div class="stat-icon news">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-info">
            <div class="stat-number">${learningCount}</div>
            <div class="stat-label">知识学习</div>
          </div>
          <div class="stat-icon learning">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-info">
            <div class="stat-number">${lawCount}</div>
            <div class="stat-label">政策法规</div>
          </div>
          <div class="stat-icon law">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-info">
            <div class="stat-number">${videoCount}</div>
            <div class="stat-label">视频教程</div>
          </div>
          <div class="stat-icon video">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
        </div>
      `;
    }

    function getCategoryClass(category) {
      switch(category) {
        case '资讯': return 'category-news';
        case '学习': return 'category-learning';
        case '视频': return 'category-video';
        case '法规': return 'category-law';
        default: return 'category-news';
      }
    }

    function renderTable() {
      var tbody = document.getElementById('newsTable');
      tbody.innerHTML = '';
      
      var start = (currentPage - 1) * pageSize;
      var end = start + pageSize;
      var displayNews = newsData.slice(start, end);
      
      displayNews.forEach(function(n) {
        var categoryClass = getCategoryClass(n.category);
        var statusClass = n.status === '已发布' ? 'status-published' : 'status-draft';
        tbody.innerHTML += `
          <tr>
            <td>${n.title}</td>
            <td><span class="category-tag ${categoryClass}">${n.category}</span></td>
            <td>${n.publishTime}</td>
            <td>${n.views}</td>
            <td><span class="status-badge ${statusClass}">${n.status}</span></td>
            <td>
              <button onclick="openDetailModal('${n.id}')" class="px-3 py-1 text-green hover:bg-green-50 rounded text-xs font-medium transition-colors">查看</button>
              <button onclick="openEditModal('${n.id}')" class="px-3 py-1 text-blue hover:bg-blue-50 rounded text-xs font-medium transition-colors">编辑</button>
              <button onclick="openPublishModal('${n.id}', '${n.title}')" class="px-3 py-1 text-orange hover:bg-orange-50 rounded text-xs font-medium transition-colors">发布</button>
              <button onclick="openDeleteModal('${n.id}', '${n.title}')" class="px-3 py-1 text-red hover:bg-red-50 rounded text-xs font-medium transition-colors">删除</button>
            </td>
          </tr>
        `;
      });
      
      renderPagination();
    }

    function renderPagination() {
      var totalPages = Math.ceil(newsData.length / pageSize);
      var pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      
      if (currentPage > 1) {
        pagination.innerHTML += `<button class="page-btn" onclick="goPage(${currentPage - 1})">上一页</button>`;
      }
      
      for (var i = 1; i <= totalPages; i++) {
        var active = i === currentPage ? 'active' : '';
        pagination.innerHTML += `<button class="page-btn ${active}" onclick="goPage(${i})">${i}</button>`;
      }
      
      if (currentPage < totalPages) {
        pagination.innerHTML += `<button class="page-btn" onclick="goPage(${currentPage + 1})">下一页</button>`;
      }
    }

    function goPage(page) {
      currentPage = page;
      renderTable();
    }

    function searchNews() {
      var keyword = document.getElementById('searchInput').value.toLowerCase();
      newsData = originalNews.filter(function(n) {
        return n.title.toLowerCase().includes(keyword);
      });
      filterNews();
    }

    function filterNews() {
      var category = document.getElementById('categoryFilter').value;
      var status = document.getElementById('statusFilter').value;
      
      newsData = originalNews.filter(function(n) {
        var matchCategory = category === 'all' || n.category === category;
        var matchStatus = status === 'all' || n.status === status;
        var keyword = document.getElementById('searchInput').value.toLowerCase();
        var matchKeyword = !keyword || n.title.toLowerCase().includes(keyword);
        return matchCategory && matchStatus && matchKeyword;
      });
      
      currentPage = 1;
      renderTable();
    }

    function openAddModal() {
      initEditors();
      document.getElementById('add-modal-title').textContent = '新增资讯';
      document.getElementById('edit-id').value = '';
      document.getElementById('add-title').value = '';
      document.getElementById('add-category').value = '资讯';
      currentImage = '';
      document.getElementById('add-image').value = '';
      showImagePreview('');
      setEditorHTML('#summary-editor', '');
      setEditorHTML('#content-editor', '');
      document.getElementById('add-status').value = '草稿';
      document.getElementById('add-modal').classList.add('active');
    }

    function openEditModal(id) {
      var n = newsData.find(function(item) { return item.id === id; });
      if (!n) return;
      initEditors();
      document.getElementById('add-modal-title').textContent = '编辑资讯';
      document.getElementById('edit-id').value = n.id;
      document.getElementById('add-title').value = n.title;
      document.getElementById('add-category').value = n.category;
      currentImage = n.image || '';
      document.getElementById('add-image').value = '';
      showImagePreview(currentImage);
      setEditorHTML('#summary-editor', n.summary);
      setEditorHTML('#content-editor', n.content);
      document.getElementById('add-status').value = n.status;
      document.getElementById('add-modal').classList.add('active');
    }

    function submitAdd() {
      var id = document.getElementById('edit-id').value;
      var title = document.getElementById('add-title').value.trim();
      var category = document.getElementById('add-category').value;
      var summary = getEditorHTML('#summary-editor');
      var content = getEditorHTML('#content-editor');
      var status = document.getElementById('add-status').value;

      if (!title || isEditorEmpty('#content-editor')) {
        alert('请填写必填项');
        return;
      }

      if (id) {
        var index = originalNews.findIndex(function(item) { return item.id === id; });
        if (index > -1) {
          originalNews[index] = { ...originalNews[index], title, category, summary, content, image: currentImage, status };
        }
      } else {
        var newId = 'nw-' + String(originalNews.length + 1).padStart(3, '0');
        var now = new Date();
        var timeStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        originalNews.unshift({ id: newId, title, category, summary, content, image: currentImage, publishTime: timeStr, views: '0', status });
      }

      closeModal('add-modal');
      renderStats();
      filterNews();
      alert(id ? '编辑成功' : '新增成功');
    }

    function openDetailModal(id) {
      var n = newsData.find(function(item) { return item.id === id; });
      if (!n) return;
      var categoryClass = getCategoryClass(n.category);
      var statusClass = n.status === '已发布' ? 'status-published' : 'status-draft';
      document.getElementById('detail-content').innerHTML = `
        <div class="detail-info">
          <div class="detail-item"><div class="detail-label">资讯ID</div><div class="detail-value">${n.id}</div></div>
          <div class="detail-item"><div class="detail-label">标题</div><div class="detail-value">${n.title}</div></div>
          <div class="detail-item"><div class="detail-label">分类</div><div class="detail-value"><span class="category-tag ${categoryClass}">${n.category}</span></div></div>
          <div class="detail-item"><div class="detail-label">发布时间</div><div class="detail-value">${n.publishTime}</div></div>
          <div class="detail-item"><div class="detail-label">阅读量</div><div class="detail-value">${n.views}</div></div>
          <div class="detail-item"><div class="detail-label">状态</div><div class="detail-value"><span class="status-badge ${statusClass}">${n.status}</span></div></div>
        </div>
        <div class="detail-content">
          <div style="font-size:12px;color:#8898aa;margin-bottom:8px;">资讯图片</div>
          ${n.image ? `<img src="${n.image}" alt="资讯图片" style="max-width:100%; max-height:320px; border-radius:6px; display:block;">` : '<div style="font-size:14px;color:#8898aa;">暂无图片</div>'}
        </div>
        <div class="detail-content">
          <div style="font-size:12px;color:#8898aa;margin-bottom:8px;">摘要</div>
          <div style="font-size:14px;color:#1b2a41;line-height:1.6;">${n.summary}</div>
        </div>
        <div class="detail-content">
          <div style="font-size:12px;color:#8898aa;margin-bottom:8px;">内容</div>
          <div style="font-size:14px;color:#1b2a41;line-height:1.6;">${n.content}</div>
        </div>
      `;
      document.getElementById('detail-modal').classList.add('active');
    }

    function openPublishModal(id, title) {
      publishTargetId = id;
      document.getElementById('publish-title').textContent = title;
      document.getElementById('publish-modal').classList.add('active');
    }

    function submitPublish() {
      if (!publishTargetId) return;
      var index = originalNews.findIndex(function(item) { return item.id === publishTargetId; });
      if (index > -1) {
        originalNews[index].status = '已发布';
        var now = new Date();
        originalNews[index].publishTime = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      }
      closeModal('publish-modal');
      filterNews();
      alert('发布成功');
      publishTargetId = null;
    }

    function openDeleteModal(id, name) {
      deleteTargetId = id;
      document.getElementById('delete-name').textContent = name;
      document.getElementById('delete-modal').classList.add('active');
    }

    function submitDelete() {
      if (!deleteTargetId) return;
      originalNews = originalNews.filter(function(item) { return item.id !== deleteTargetId; });
      closeModal('delete-modal');
      renderStats();
      filterNews();
      alert('删除成功');
      deleteTargetId = null;
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    renderStats();
    renderTable();
  </script>
</body>
</html>
