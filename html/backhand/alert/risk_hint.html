﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风险提示 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">风险提示</h1>
                <p class="text-gray-500 mt-1">管理南丰蜜桔种植风险提示信息</p>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">风险总数</p>
                        <p class="text-2xl font-bold text-gray-800 mt-1" id="stat-total">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-50 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">待审核</p>
                        <p class="text-2xl font-bold text-orange-600 mt-1" id="stat-pending">0</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-50 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">已审核</p>
                        <p class="text-2xl font-bold text-green-600 mt-1" id="stat-approved">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-50 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">已驳回</p>
                        <p class="text-2xl font-bold text-red-600 mt-1" id="stat-rejected">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-50 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
            <div class="flex items-center space-x-4 flex-wrap gap-y-3">
                <div class="flex-1 min-w-[200px]">
                    <input type="text" id="search-input" placeholder="搜索风险标题、描述..." class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" oninput="filterRisks()">
                </div>
                <select id="level-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterRisks()">
                    <option value="">全部级别</option>
                    <option value="红色">红色风险</option>
                    <option value="橙色">橙色风险</option>
                    <option value="黄色">黄色风险</option>
                    <option value="蓝色">蓝色风险</option>
                </select>
                <select id="status-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterRisks()">
                    <option value="">全部状态</option>
                    <option value="待审核">待审核</option>
                    <option value="已审核">已审核</option>
                    <option value="已驳回">已驳回</option>
                </select>
                <button onclick="resetFilter()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">重置</button>
                <button onclick="exportRisks()" class="px-4 py-2 bg-gray-600 text-white rounded-lg text-sm hover:bg-gray-700 flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    导出
                </button>
                <button onclick="openAddModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    新增风险提示
                </button>
            </div>
        </div>

        <!-- 风险数据列表 -->
        <div id="risk-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- 分页 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 px-6 py-4 mt-4 flex items-center justify-between flex-wrap gap-y-2">
            <p class="text-sm text-gray-500" id="record-count">共 0 条记录</p>
            <div class="flex items-center space-x-2" id="pagination"></div>
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-500">每页</span>
                <select id="page-size" class="px-2 py-1 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="changePageSize()">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                </select>
                <span class="text-sm text-gray-500">条</span>
            </div>
        </div>
    </div>

    <!-- 新增弹窗 -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">新增风险提示</h3>
                <button onclick="closeModal('add-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险标题</label>
                        <input type="text" id="add-title" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入风险标题">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">风险级别</label>
                            <select id="add-level" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                                <option value="红色">红色风险</option>
                                <option value="橙色">橙色风险</option>
                                <option value="黄色">黄色风险</option>
                                <option value="蓝色">蓝色风险</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">影响范围</label>
                            <input type="text" id="add-area" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入影响范围">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险描述</label>
                        <textarea id="add-desc" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="4" placeholder="请输入风险描述"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">防护建议</label>
                        <textarea id="add-suggestion" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="4" placeholder="请输入防护建议（每行一条）"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('add-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="saveRisk()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存</button>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">编辑风险提示</h3>
                <button onclick="closeModal('edit-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险标题</label>
                        <input type="text" id="edit-title" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">风险级别</label>
                            <select id="edit-level" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                                <option value="红色">红色风险</option>
                                <option value="橙色">橙色风险</option>
                                <option value="黄色">黄色风险</option>
                                <option value="蓝色">蓝色风险</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">影响范围</label>
                            <input type="text" id="edit-area" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险描述</label>
                        <textarea id="edit-desc" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="4"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">防护建议</label>
                        <textarea id="edit-suggestion" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="4"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('edit-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="updateRisk()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存</button>
            </div>
        </div>
    </div>

    <!-- 审核弹窗 -->
    <div id="audit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">审核风险提示</h3>
                <button onclick="closeModal('audit-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <p class="text-sm text-gray-500 mb-1">风险标题</p>
                    <p id="audit-title" class="text-base font-medium text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">风险级别</p>
                        <p id="audit-level" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">影响范围</p>
                        <p id="audit-area" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">发布时间</p>
                        <p id="audit-time" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">当前状态</p>
                        <p id="audit-status" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                </div>
                <div class="mb-4">
                    <p class="text-sm text-gray-500 mb-1">风险描述</p>
                    <p id="audit-desc" class="text-sm text-gray-800 bg-gray-50 px-3 py-3 rounded leading-relaxed"></p>
                </div>
                <div>
                    <p class="text-sm text-gray-500 mb-1">审核意见</p>
                    <textarea id="audit-comment" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入审核意见（可选）"></textarea>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('audit-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="rejectAudit()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">驳回</button>
                <button onclick="approveAudit()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">通过审核</button>
            </div>
        </div>
    </div>

    <!-- 删除弹窗 -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 420px;">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">确认删除</h3>
                <p class="text-sm text-gray-500 mb-6">确定要删除这条风险提示吗？此操作不可撤销。</p>
                <div class="flex justify-center space-x-3">
                    <button onclick="closeModal('delete-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                    <button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">确认删除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRiskId = null;
        let currentPage = 1;
        let pageSize = 10;

        const levelMap = {
            '红色': 'bg-red-100 text-red-700',
            '橙色': 'bg-orange-100 text-orange-700',
            '黄色': 'bg-yellow-100 text-yellow-700',
            '蓝色': 'bg-blue-100 text-blue-700'
        };
        const levelTextMap = { '红色': 'text-red-600', '橙色': 'text-orange-600', '黄色': 'text-yellow-600', '蓝色': 'text-blue-600' };

            { id: 'risk-2', title: '持续干旱风险提示', time: '2026-07-20 14:30', level: '橙色', area: '全县范围', status: '已审核', desc: '我县已连续22天无有效降雨，土壤墒情严重不足，部分果园出现叶片卷曲、果实发育迟缓等干旱症状，需紧急采取灌溉措施。', suggestions: ['紧急进行灌溉补水，优先保障结果树和幼树', '覆盖地膜或秸秆，减少土壤水分蒸发', '喷施抗蒸腾剂，降低叶片水分消耗', '疏除部分果实，减轻树体负担'] },
            { id: 'risk-3', title: '暴雨洪涝风险提示', time: '2026-07-19 08:00', level: '黄色', area: '太和镇、桑田镇', status: '已审核', desc: '根据气象预报，未来2天太和镇、桑田镇将出现大到暴雨，可能造成果园积水，影响蜜桔根系生长，需提前做好排水准备。', suggestions: ['清理果园排水沟渠，确保排水畅通', '低洼地块提前准备抽水设备', '加固树体支撑，防止倒伏', '雨后及时中耕松土，改善土壤透气性'] },

        function nowStr() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function getFilteredRisks() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const levelFilter = document.getElementById('level-filter').value;
            const statusFilter = document.getElementById('status-filter').value;
            return risks.filter(r => {
                const matchesSearch = r.title.toLowerCase().includes(searchTerm) || r.desc.toLowerCase().includes(searchTerm);
                const matchesLevel = !levelFilter || r.level === levelFilter;
                const matchesStatus = !statusFilter || r.status === statusFilter;
                return matchesSearch && matchesLevel && matchesStatus;
            });
        }

            return '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">' +
                '<div class="flex items-start justify-between mb-4">' +

                        '<span class="px-2 py-1 ' + levelClass + ' text-xs rounded-full">' + escapeHtml(risk.level) + '风险</span>' +
                    '</div>' +
                '</div>' +
                '<p class="text-sm text-gray-600 mb-4">' + escapeHtml(risk.desc) + '</p>' +
                '<div class="bg-blue-50 rounded-lg p-4">' +
                    '<h4 class="font-medium text-blue-800 mb-2">防护建议</h4>' +

                '</div>' +

                    '<button onclick="openEditModal(\'' + risk.id + '\')" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50">编辑</button>' +
                    '<button onclick="openAuditModal(\'' + risk.id + '\')" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm text-blue-600 hover:bg-blue-50">审核</button>' +
                    '<button onclick="openDeleteModal(\'' + risk.id + '\')" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm text-red-600 hover:bg-red-50">删除</button>' +
                '</div>' +
            '</div>';
        }

        function renderRisks() {
            const filtered = getFilteredRisks();
            const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * pageSize;
            const pageRisks = filtered.slice(start, start + pageSize);

            const container = document.getElementById('risk-list');
            if (pageRisks.length === 0) {
                container.innerHTML = '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-10 text-center text-gray-400">暂无风险提示数据</div>';
            } else {
                container.innerHTML = pageRisks.map(renderCard).join('');
            }

            document.getElementById('record-count').textContent = '共 ' + filtered.length + ' 条记录';
            renderPagination(totalPages);
            renderStats();
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            let html = '';
            const prevDisabled = currentPage === 1;
            html += '<button onclick="prevPage()" ' + (prevDisabled ? 'disabled' : '') + ' class="px-3 py-1 border border-gray-300 rounded text-sm ' + (prevDisabled ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '">上一页</button>';
            const maxVisible = 7;
            if (totalPages <= maxVisible) {
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        html += '<button class="px-3 py-1 bg-green-600 text-white rounded text-sm">' + i + '</button>';
                    } else {
                        html += '<button onclick="goToPage(' + i + ')" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">' + i + '</button>';
                    }
                }
            } else {
                const start = Math.max(1, currentPage - 2);
                const end = Math.min(totalPages, start + 4);
                if (start > 1) {
                    html += '<button onclick="goToPage(1)" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">1</button>';
                    if (start > 2) html += '<span class="px-2 text-gray-400">...</span>';
                }
                for (let i = start; i <= end; i++) {
                    if (i === currentPage) {
                        html += '<button class="px-3 py-1 bg-green-600 text-white rounded text-sm">' + i + '</button>';
                    } else {
                        html += '<button onclick="goToPage(' + i + ')" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">' + i + '</button>';
                    }
                }
                if (end < totalPages) {
                    if (end < totalPages - 1) html += '<span class="px-2 text-gray-400">...</span>';
                    html += '<button onclick="goToPage(' + totalPages + ')" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">' + totalPages + '</button>';
                }
            }
            const nextDisabled = currentPage === totalPages;
            html += '<button onclick="nextPage()" ' + (nextDisabled ? 'disabled' : '') + ' class="px-3 py-1 border border-gray-300 rounded text-sm ' + (nextDisabled ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '">下一页</button>';
            container.innerHTML = html;
        }

        function renderStats() {
            document.getElementById('stat-total').textContent = risks.length;
            document.getElementById('stat-pending').textContent = risks.filter(r => r.status === '待审核').length;
            document.getElementById('stat-approved').textContent = risks.filter(r => r.status === '已审核').length;
            document.getElementById('stat-rejected').textContent = risks.filter(r => r.status === '已驳回').length;
        }

        function openAddModal() {
            document.getElementById('add-title').value = '';
            document.getElementById('add-level').value = '红色';
            document.getElementById('add-area').value = '';
            document.getElementById('add-desc').value = '';
            document.getElementById('add-suggestion').value = '';
            document.getElementById('add-modal').classList.add('active');
        }

        function openEditModal(id) {
            currentRiskId = id;
            const risk = risks.find(r => r.id === id);
            if (risk) {
                document.getElementById('edit-title').value = risk.title;
                document.getElementById('edit-level').value = risk.level;
                document.getElementById('edit-area').value = risk.area;
                document.getElementById('edit-desc').value = risk.desc;
                document.getElementById('edit-suggestion').value = risk.suggestions.join('\n');
            }
            document.getElementById('edit-modal').classList.add('active');
        }

        function openDeleteModal(id) {
            currentRiskId = id;
            document.getElementById('delete-modal').classList.add('active');
        }

        function openAuditModal(id) {
            currentRiskId = id;
            const risk = risks.find(r => r.id === id);
            if (risk) {
                document.getElementById('audit-title').textContent = risk.title;
                document.getElementById('audit-level').textContent = risk.level + '风险';
                document.getElementById('audit-area').textContent = risk.area;
                document.getElementById('audit-time').textContent = risk.time;
                document.getElementById('audit-status').textContent = risk.status;
                document.getElementById('audit-desc').textContent = risk.desc;
                document.getElementById('audit-comment').value = '';
            }
            document.getElementById('audit-modal').classList.add('active');
        }

        function approveAudit() {
            const risk = risks.find(r => r.id === currentRiskId);
            if (risk) {
                risk.status = '已审核';
                alert('风险提示审核通过！\n标题: ' + risk.title + '\n审核时间: ' + nowStr());
            }
            closeModal('audit-modal');
            renderRisks();
        }

        function rejectAudit() {
            const risk = risks.find(r => r.id === currentRiskId);
            if (risk) {
                risk.status = '已驳回';
                alert('风险提示已驳回！\n标题: ' + risk.title + '\n驳回时间: ' + nowStr());
            }
            closeModal('audit-modal');
            renderRisks();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveRisk() {
            const title = document.getElementById('add-title').value.trim();
            const level = document.getElementById('add-level').value;
            const area = document.getElementById('add-area').value.trim() || '全县范围';
            const desc = document.getElementById('add-desc').value.trim();
            const suggestion = document.getElementById('add-suggestion').value;

            if (!title) {
                alert('请填写风险标题');
                return;
            }

            const newId = 'risk-' + Date.now();
            const suggestions = suggestion ? suggestion.split('\n').map(s => s.trim()).filter(s => s) : [];

            risks.unshift({
                id: newId,
                title: title,
                time: nowStr(),
                level: level,
                area: area,
                status: '待审核',
                desc: desc || '暂无描述',
                suggestions: suggestions
            });

            currentPage = 1;
            closeModal('add-modal');
            renderRisks();
            alert('风险提示创建成功！\n标题: ' + title + '\n级别: ' + level);
        }

        function updateRisk() {
            const risk = risks.find(r => r.id === currentRiskId);
            if (risk) {
                risk.title = document.getElementById('edit-title').value.trim();
                risk.level = document.getElementById('edit-level').value;
                risk.area = document.getElementById('edit-area').value.trim() || '全县范围';
                risk.desc = document.getElementById('edit-desc').value.trim();
                risk.suggestions = document.getElementById('edit-suggestion').value.split('\n').map(s => s.trim()).filter(s => s);
            }
            closeModal('edit-modal');
            renderRisks();
            alert('风险提示更新成功！');
        }

        function confirmDelete() {
            risks = risks.filter(r => r.id !== currentRiskId);
            closeModal('delete-modal');
            renderRisks();
            alert('风险提示删除成功！');
        }

        function exportRisks() {
            const filtered = getFilteredRisks();
            let csv = '\ufeff风险标题,风险级别,影响范围,发布时间,状态,风险描述\n';
            filtered.forEach(r => {
                csv += '"' + r.title + '","' + r.level + '","' + r.area + '","' + r.time + '","' + r.status + '","' + r.desc.replace(/"/g, '""') + '"\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '风险提示_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        function filterRisks() {
            currentPage = 1;
            renderRisks();
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('level-filter').value = '';
            document.getElementById('status-filter').value = '';
            filterRisks();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderRisks();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderRisks();
            }
        }

        function nextPage() {
            const totalPages = Math.max(1, Math.ceil(getFilteredRisks().length / pageSize));
            if (currentPage < totalPages) {
                currentPage++;
                renderRisks();
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderRisks();
        }

        document.addEventListener('click', (e) => {
            const mapping = {
                'add-modal': '[onclick="openAddModal()"]',
                'edit-modal': '[onclick^="openEditModal"]',
                'delete-modal': '[onclick^="openDeleteModal"]',
                'audit-modal': '[onclick^="openAuditModal"]'
            };
            Object.entries(mapping).forEach(([id, selector]) => {
                const modal = document.getElementById(id);
                if (!modal.contains(e.target) && !e.target.closest(selector)) {
                    modal.classList.remove('active');
                }
            });
        });

        renderRisks();
    </script>
</body>
</html>
