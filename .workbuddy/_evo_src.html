    <script>
function getSiteCode() {
    var path = location.pathname;
    var code = '';
    if (path.toLowerCase().indexOf("/home/") != -1 || path.toLowerCase().indexOf("/login/index") != -1 ) {

        var parts = path.split('/');

        if (parts.length == 4 && parts[3])
            code = parts[3];



    }

    return code;

}

function getSiteInfo(callback) {

    $.get($.apiUrl + "/api/AuditEnterprise/getshortInfo", function (res) {
        var data =res.data;
        callback(data);


    });


}



function getSiteName() {

    var suffix = null;

    try {
        suffix = pageName;
    } catch (e) { }

    getSiteInfo(function (data) {

        var shortinfo =data.shortinfo;
        var sublist = data.sublist;
        var title = shortinfo.Name + (suffix ? " - " + suffix : "");
        document.title = title;

        if (shortinfo.Logo) {
            $(".lr-logo-title").find("img").attr("src", $.apiUrl + "/api/file/DownloadFile?path=" + shortinfo.Logo);
        }
        var siteCode = getSiteCode();
        if (siteCode && sublist.length > 0) {
            var subSite = sublist.find(m => m.code.toLowerCase() == siteCode.toLowerCase());
            console.log(subSite)
            top.SubSite = subSite;
            if (subSite) {
                document.title = subSite.name;
                if (subSite.logo) {
                    $(".lr-logo-title").find("img").attr("src", $.apiUrl + "/api/file/Download?fileId=" + subSite.logo);
                }

            }
        }
        $(".lr-logo-title").find(".lg").text(document.title.split('')[0]) || "D";
        var loginSiteCode = request('systemcode');
        if (!loginSiteCode) {
            loginSiteCode = getSiteCode();
        }
  
        if (sublist.length > 0) {
            if (!!loginSiteCode) {
                var loginSubInfo = sublist.find(m => m.code.toLowerCase() == loginSiteCode);
                if (!!loginSubInfo)
                    loginSiteCode = loginSubInfo.code;
            } else {
                loginSiteCode = sublist[0].code;
            }
        }
        
      

        var html_systemlist = "";
        for (i = 0; i < sublist.length; i++) {
            html_systemlist += "<li><a class='subsystemli' sys_defskin='" + sublist[i].defskin + "' sys_code='" + sublist[i].code + "' sys_name='" + sublist[i].name + "' sys_logo='" + sublist[i].logo+ "' sys_isredirect='" + sublist[i].isredirect + "' sys_defindex='" + sublist[i].defindex +"' >" + sublist[i].name+"</a></li>";
        }
        $("#systemlist").html(html_systemlist);

        $(".subsystemli").click(function () {
            var that = $(this);
            $("#lr_defskin").val(that.attr("sys_defskin"));
            $("#lr_defsyscode").val(that.attr("sys_code"));
            $("#lr_defsyscode").attr("isredirect", that.attr("sys_isredirect"));
            $("#lr_defsyscode").attr("defindex", that.attr("sys_defindex"));
            $("#lr_defsysname").html(that.attr("sys_name"));
            $("#h2_systemname").text(that.attr("sys_name"));
            $(".show-system").removeClass('active');

        });

        if (!!loginSiteCode)
            $("a[sys_code=" + loginSiteCode + "]").click();
    });

}

var loginInfoKey = 'loginInfo';

function saveLoginInfo(userName, pwd) {

    var data = { userName: userName, pwd: pwd };
    localStorage.setItem(loginInfoKey, JSON.stringify(data));
}

function delLoginInfo() {


    localStorage.removeItem(loginInfoKey);

}

function setLoginInfo() {


    var info = localStorage.getItem(loginInfoKey);
    var userName = '';
    var pwd = '';
    if (info) {

        $("#lr_remember").attr("checked", true);
        info = JSON.parse(info);
        userName = info.userName;
        pwd = info.pwd;
    } else {
        $("#lr_remember").attr("checked", false);
    }

    $("#lr_username").val(userName);
    $("#lr_password").val(pwd);
    


}


function saveToken (token) {

    sessionStorage.setItem("gtctoken", token);

}





$(function () {
    getSiteName();
    setLoginInfo();

  
});
