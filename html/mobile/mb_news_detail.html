<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 资讯详情</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <link rel="stylesheet" href="css/detail-page.css">
</head>
<body>
  <div class="mb-app">
    <!-- 顶部 Banner -->
    <div class="detail-banner">
      <div class="detail-banner-inner">
        <div class="detail-banner-back" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="detail-banner-content">
          <div class="detail-banner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div class="detail-banner-info">
            <div class="detail-banner-title" id="newsTitle">南丰蜜桔夏季病虫害防治技术要点</div>
            <div class="detail-banner-subtitle" id="newsMeta">2026-07-22 · 3258人已读</div>
            <div class="detail-banner-tags" id="newsTags"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 文章正文 -->
    <div class="article-content" id="articleContent"></div>

    <!-- 相关推荐 -->
    <div class="mb-section-title" style="margin: 12px 16px 8px;">
      <span style="width:3px;height:12px;background:var(--primary);border-radius:2px;display:inline-block;margin-right:6px;"></span>
      相关推荐
    </div>
    <div class="recommend-row" id="recommendRow"></div>

    <div style="height: 80px;"></div>

    <!-- 底部操作栏 -->
    <div class="detail-bottom-bar">
      <button class="detail-bottom-btn" onclick="toggleFavorite()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="favoriteText">收藏</span>
      </button>
      <button class="detail-bottom-btn" onclick="consultExpert()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
        咨询专家
      </button>
      <button class="detail-bottom-btn primary" onclick="shareArticle()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        分享
      </button>
    </div>
  </div>

  <script>
    // 资讯详情数据
    var NEWS_DATA = {
      'summer-pest': {
        title: '南丰蜜桔夏季病虫害防治技术要点',
        date: '2026-07-22',
        reads: 3258,
        author: '县农业农村局 · 王志远',
        tags: ['重要', '技术', '病虫害'],
        content: [
          { type: 'h2', text: '一、夏季主要病虫害发生趋势' },
          { type: 'p', text: '南丰蜜桔进入7-9月高温季节后，红蜘蛛、锈壁虱等螨类害虫进入高发期，蚧壳虫若虫孵化盛期也在此阶段。炭疽病、黑点病等真菌性病害在多雨季节容易爆发流行，需重点防控。' },
          { type: 'h2', text: '二、关键防治技术' },
          { type: 'h3', text: '（一）螨类害虫防治' },
          { type: 'p', text: '红蜘蛛、锈壁虱等螨类在高温干旱条件下繁殖迅速，5-7天即可完成一代。监测建议：' },
          { type: 'li', text: '每3-5天巡查一次果园，重点观察叶背和果实表面' },
          { type: 'li', text: '使用黄色粘虫板监测成虫数量，每板超过10头立即防治' },
          { type: 'li', text: '干旱季节果园喷雾增湿，可有效抑制螨类繁殖' },
          { type: 'p', text: '推荐用药：阿维菌素 1.8% EC 5000-6000 倍液喷雾，重点喷叶片正反面。' },
          { type: 'h3', text: '（二）蚧壳虫综合防控' },
          { type: 'p', text: '若虫孵化盛期是防治关键期，需连续防治2次。' },
          { type: 'h2', text: '三、注意事项' },
          { type: 'quote', text: '化学防治时注意药剂轮换，避免产生抗药性。生物防治与化学防治相结合效果更佳。' },
          { type: 'p', text: '夏季高温时段（11:00-15:00）避免喷药，建议在清晨或傍晚进行，确保作业人员安全的同时提高药效。' }
        ],
        recommend: [
          { title: '高温天气下南丰蜜桔灌溉管理技巧', date: '2026-07-21', reads: 2186 },
          { title: '柑桔木虱识别与黄龙病防控要点', date: '2026-07-19', reads: 1854 },
          { title: '7月果园管理月历：肥水、病虫、修剪', date: '2026-07-15', reads: 3120 }
        ]
      },
      'irrigation': {
        title: '高温天气下南丰蜜桔灌溉管理技巧',
        date: '2026-07-21',
        reads: 2186,
        author: '省农科院 · 李秀梅',
        tags: ['技术', '灌溉'],
        content: [
          { type: 'h2', text: '一、高温对蜜桔的影响' },
          { type: 'p', text: '持续高温（>35°C）会导致蜜桔光合作用下降、蒸腾加剧，叶片萎蔫、果实日灼，严重影响产量和品质。土壤水分不足时尤为严重。' },
          { type: 'h2', text: '二、灌溉关键技术' },
          { type: 'h3', text: '（一）灌溉时间' },
          { type: 'p', text: '避开中午高温时段（11:00-15:00），建议在清晨6:00-9:00或傍晚17:00-19:00进行灌溉，此时水温与地温差异小，根系吸水效率高。' },
          { type: 'h3', text: '（二）灌溉方式' },
          { type: 'p', text: '推荐采用滴灌或微喷，节水高效，可精准控制水量。漫灌易造成土壤板结和根系呼吸不畅。' },
          { type: 'h3', text: '（三）灌溉量' },
          { type: 'p', text: '根据土壤湿度传感器数据判断，每次灌溉使土壤湿度保持在60-70%。' },
          { type: 'h2', text: '三、配套措施' },
          { type: 'p', text: '覆盖地膜或秸秆保墒；搭建遮阳网预防日灼；结合叶面喷水降温。' }
        ],
        recommend: [
          { title: '南丰蜜桔夏季病虫害防治技术要点', date: '2026-07-22', reads: 3258 },
          { title: '蜜桔科学施肥：氮磷钾配比与施用方法', date: '2026-07-18', reads: 1452 },
          { title: '果园排水不良的识别与改进措施', date: '2026-07-12', reads: 968 }
        ]
      }
    };

    function getQueryParam(name) {
      var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    }

    var newsKey = getQueryParam('id') || 'summer-pest';
    var news = NEWS_DATA[newsKey] || NEWS_DATA['summer-pest'];

    // 渲染头部
    function renderHeader() {
      document.getElementById('newsTitle').textContent = news.title;
      document.getElementById('newsMeta').textContent = news.date + ' · ' + news.reads + '人已读 · ' + news.author;
      var tagsHtml = '';
      news.tags.forEach(function(t) {
        var cls = '';
        if (t === '重要') cls = 'danger';
        else if (t === '技术' || t === '培训') cls = 'success';
        else if (t === '病虫害') cls = 'warning';
        tagsHtml += '<span class="detail-banner-tag ' + cls + '">' + t + '</span>';
      });
      document.getElementById('newsTags').innerHTML = tagsHtml;
    }

    // 渲染正文
    function renderContent() {
      var html = '';
      news.content.forEach(function(b) {
        switch (b.type) {
          case 'h2': html += '<h2>' + b.text + '</h2>'; break;
          case 'h3': html += '<h3>' + b.text + '</h3>'; break;
          case 'p': html += '<p>' + b.text + '</p>'; break;
          case 'li': html += '<li>' + b.text + '</li>'; break;
          case 'quote': html += '<blockquote>' + b.text + '</blockquote>'; break;
        }
      });
      document.getElementById('articleContent').innerHTML = html;
    }

    // 渲染相关推荐
    function renderRecommend() {
      var html = '';
      (news.recommend || []).forEach(function(r) {
        html += '<div class="recommend-card" onclick="location.href=\'mb_news_detail.html?id=' + (r.title.includes('夏季') ? 'summer-pest' : 'irrigation') + '\'">' +
          '<div class="recommend-title">' + r.title + '</div>' +
          '<div class="recommend-meta">' + r.date + ' · ' + r.reads + '人已读</div>' +
        '</div>';
      });
      document.getElementById('recommendRow').innerHTML = html;
    }

    var favorited = false;
    function toggleFavorite() {
      favorited = !favorited;
      document.getElementById('favoriteText').textContent = favorited ? '已收藏' : '收藏';
      if (favorited) alert('已收藏到我的收藏');
    }
    function consultExpert() { alert('正在为您接通农技专家...'); }
    function shareArticle() { alert('分享链接已复制'); }
    function goBack() { history.back(); }

    renderHeader();
    renderContent();
    renderRecommend();
  </script>
</body>
</html>
