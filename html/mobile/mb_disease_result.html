<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 识别结果</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <link rel="stylesheet" href="css/detail-page.css">
</head>
<body>
  <div class="mb-app">
    <!-- 顶部 Banner -->
    <div class="detail-banner">
      <div class="detail-banner-inner">
        <div class="detail-banner-back" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="detail-banner-content">
          <div class="detail-banner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div class="detail-banner-info">
            <div class="detail-banner-title">识别结果</div>
            <div class="detail-banner-subtitle">AI 病虫害图像识别 · <span id="recogTime">2026-07-23 10:30</span></div>
            <div class="detail-banner-tags">
              <span class="detail-banner-tag success">识别完成</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 用户上传图 -->
    <div class="result-hero">
      <div class="result-hero-img">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span class="upload-hint" id="uploadHint">用户上传 · 01:23 PM</span>
      </div>

      <div class="result-label">识别结果</div>
      <div class="result-name" id="resultName">红蜘蛛</div>
      <div class="result-confidence">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        置信度 <span id="resultConfidence">87.3%</span>
      </div>
    </div>

    <!-- Top3 候选结果 -->
    <div class="detail-section">
      <div class="detail-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Top 3 候选结果
      </div>
      <div class="candidate-list" id="candidateList"></div>
    </div>

    <!-- 行动按钮 -->
    <div class="action-row">
      <button class="action-btn secondary" onclick="viewDetail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        查看详情
      </button>
      <button class="action-btn primary" onclick="addToPlan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><polyline points="9 5 12 2 15 5"/></svg>
        加入用药计划
      </button>
    </div>

    <!-- 推荐用药速览 -->
    <div class="detail-section">
      <div class="detail-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.5 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7l5 5v5"/><circle cx="14" cy="17" r="2"/></svg>
        防治速览
      </div>
      <div id="drugPreview"></div>
    </div>

    <!-- 识别信息 -->
    <div class="detail-section">
      <div class="detail-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        识别信息
      </div>
      <div style="font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.8;">
        <div style="display:flex;padding:6px 0;"><span style="min-width:90px;color:var(--text-tertiary);">识别模型</span><span>蜜桔病虫害识别 v2.3</span></div>
        <div style="display:flex;padding:6px 0;border-top:1px solid var(--border-light);"><span style="min-width:90px;color:var(--text-tertiary);">模型类型</span><span>深度学习 CNN</span></div>
        <div style="display:flex;padding:6px 0;border-top:1px solid var(--border-light);"><span style="min-width:90px;color:var(--text-tertiary);">识别耗时</span><span>1.2 秒</span></div>
        <div style="display:flex;padding:6px 0;border-top:1px solid var(--border-light);"><span style="min-width:90px;color:var(--text-tertiary);">样本数量</span><span>已学习 12,580 张样本</span></div>
      </div>
    </div>

    <div style="height: 20px;"></div>

    <!-- 底部操作栏 -->
    <div class="detail-bottom-bar">
      <button class="detail-bottom-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        返回识别
      </button>
      <button class="detail-bottom-btn" onclick="reportWrong()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        反馈有误
      </button>
      <button class="detail-bottom-btn primary" onclick="consultExpert()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
        咨询专家
      </button>
    </div>
  </div>

  <script src="js/pest-risk-engine.js"></script>
  <script>
    // 模拟识别结果（实际对接AI时替换）
    var RECOGNITION_RESULT = {
      top: { name: '红蜘蛛', confidence: 87.3 },
      candidates: [
        { name: '红蜘蛛', confidence: 87.3 },
        { name: '锈壁虱', confidence: 10.2 },
        { name: '螨虫', confidence: 2.5 }
      ],
      uploadTime: '01:23 PM'
    };

    function getQueryParam(name) {
      var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    }

    var topPest = getQueryParam('pest') || RECOGNITION_RESULT.top.name;

    // 渲染识别结果
    function renderResult() {
      document.getElementById('resultName').textContent = topPest;
      var pests = RECOGNITION_RESULT.candidates;
      var matched = pests.find(function(p) { return p.name === topPest; });
      document.getElementById('resultConfidence').textContent = (matched ? matched.confidence : 87.3).toFixed(1) + '%';
      document.getElementById('uploadHint').textContent = '用户上传 · ' + RECOGNITION_RESULT.uploadTime;

      // 候选列表
      var html = '';
      pests.forEach(function(c, idx) {
        html += '<div class="candidate-item">' +
          '<div class="candidate-rank ' + (idx === 0 ? 'top' : '') + '">' + (idx + 1) + '</div>' +
          '<div class="candidate-info">' +
            '<div class="candidate-name">' + c.name + '</div>' +
            '<div class="candidate-bar-wrap">' +
              '<div class="candidate-bar"><div class="candidate-bar-fill" style="width:' + c.confidence + '%;"></div></div>' +
              '<div class="candidate-percent">' + c.confidence.toFixed(1) + '%</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('candidateList').innerHTML = html;

      // 推荐用药速览
      var drugs = window.PestRiskEngine.getDrugs(topPest);
      var drugHtml = '';
      drugs.slice(0, 2).forEach(function(d) {
        drugHtml += '<div class="drug-card">' +
          '<div class="drug-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.5 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7l5 5v5"/><circle cx="14" cy="17" r="2"/></svg></div>' +
          '<div class="drug-info">' +
            '<div class="drug-name">' + d.name + '</div>' +
            '<div class="drug-spec">' + d.spec + ' · ' + d.period + '</div>' +
          '</div>' +
        '</div>';
      });
      if (!drugHtml) drugHtml = '<div style="text-align:center;color:var(--text-tertiary);padding:20px;">暂无推荐用药</div>';
      document.getElementById('drugPreview').innerHTML = drugHtml;

      // 修正 conf 为匹配项
      if (!matched) {
        document.getElementById('resultConfidence').textContent = '87.3%';
      }
    }

    function viewDetail() {
      navigateTo('mb_disease_detail.html?pest=' + encodeURIComponent(topPest));
    }
    function addToPlan() {
      navigateTo('mb_data_input.html?type=farming&pest=' + encodeURIComponent(topPest));
    }
    function reportWrong() {
      alert('已记录您的反馈，我们将优化识别模型');
    }
    function consultExpert() { alert('正在为您接通农技专家...'); }
    function goBack() { history.back(); }
    function navigateTo(url) { window.location.href = url; }

    renderResult();
  </script>
</body>
</html>
