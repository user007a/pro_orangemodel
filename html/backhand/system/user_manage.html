﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: {
        green: { DEFAULT: '#16a34a' },
        blue: { DEFAULT: '#2563eb' },
        red: { DEFAULT: '#dc2626' },
        yellow: { DEFAULT: '#ca8a04' },
        purple: { DEFAULT: '#9333ea' }
      }}}}
    </script>

    <style>
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-overlay.active .modal-content { animation: modalSlideIn 0.3s ease; }
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .pagination-btn.active { background-color: #16A34A; color: white; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-gray-800">用户管理</h1>
                <p class="text-gray-500 text-sm mt-1">管理系统用户账号和权限</p>
            </div>
            <div class="flex items-center space-x-3">
                <input type="text" id="search-input" placeholder="搜索用户名/姓名/手机号..." class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 w-64">
                <select id="role-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">全部角色</option>
                    <option value="管理员">管理员</option>
                    <option value="农技员">农技员</option>
                    <option value="数据管理员">数据管理员</option>
                </select>
                <button onclick="searchUsers()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    查询
                </button>

                <button onclick="openAddModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    新增用户
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    用户列表
                </h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full" id="user-table">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">用户名</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">姓名</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">性别</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">年龄</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">文化水平</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">手机号</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">所在乡镇</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">角色</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">创建时间</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">状态</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="user-table-body">
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-gray-100 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center space-x-2">
                    <p class="text-sm text-gray-500">显示 <span id="page-info">1-10</span> 条，共 <span id="total-count">69</span> 条</p>
                    <select id="page-size-select" class="px-2 py-1 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="changePageSize()">
                        <option value="5">5条/页</option>
                        <option value="10" selected>10条/页</option>
                        <option value="15">15条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                </div>
                <div class="flex items-center space-x-1" id="pagination">
                    <button onclick="prevPage()" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200" id="prev-btn">&laquo; 上一页</button>
                    <span id="page-btns"></span>
                    <button onclick="nextPage()" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200" id="next-btn">下一页 &raquo;</button>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    新增用户
                </h3>
                <button onclick="closeModal('add-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="add-username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入用户名">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="add-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入姓名">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">性别</label>
                        <select id="add-gender" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>男</option>
                            <option>女</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">年龄</label>
                        <input type="number" id="add-age" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入年龄">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">文化水平</label>
                    <select id="add-education" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>小学</option>
                        <option>初中</option>
                        <option>高中</option>
                        <option>中专</option>
                        <option>大专</option>
                        <option>本科</option>
                        <option>硕干</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                    <input type="text" id="add-phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入手机号">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">所在乡镇</label>
                    <select id="add-department" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>太和镇</option>
                        <option>白舍镇</option>
                        <option>市山镇</option>
                        <option>紫霄镇</option>
                        <option>洽湾镇</option>
                        <option>傅坊乡</option>
                        <option>莱溪乡</option>
                        <option>三溪乡</option>
                        <option>琴城镇</option>
                        <option>桑田镇</option>
                        <option>东坪乡</option>
                        <option>太源乡</option>
                        <option>长红乡</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                    <select id="add-role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>管理员</option>
                        <option>农技员</option>
                        <option>数据管理员</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="add-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入密码">
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('add-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">取消</button>
                <button onclick="submitAddUser()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">确认添加</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    编辑用户
                </h3>
                <button onclick="closeModal('edit-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="edit-username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="edit-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">性别</label>
                        <select id="edit-gender" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>男</option>
                            <option>女</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">年龄</label>
                        <input type="number" id="edit-age" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">文化水平</label>
                    <select id="edit-education" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>小学</option>
                        <option>初中</option>
                        <option>高中</option>
                        <option>中专</option>
                        <option>大专</option>
                        <option>本科</option>
                        <option>硕干</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                    <input type="text" id="edit-phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">所在乡镇</label>
                    <select id="edit-department" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>太和镇</option>
                        <option>白舍镇</option>
                        <option>市山镇</option>
                        <option>紫霄镇</option>
                        <option>洽湾镇</option>
                        <option>傅坊乡</option>
                        <option>莱溪乡</option>
                        <option>三溪乡</option>
                        <option>琴城镇</option>
                        <option>桑田镇</option>
                        <option>东坪乡</option>
                        <option>太源乡</option>
                        <option>长红乡</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                    <select id="edit-role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>管理员</option>
                        <option>农技员</option>
                        <option>数据管理员</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                    <select id="edit-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option>启用</option>
                        <option>禁用</option>
                    </select>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('edit-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">取消</button>
                <button onclick="submitEditUser()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存修改</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    删除确认
                </h3>
                <button onclick="closeModal('delete-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mr-4">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>
                    </div>
                    <div>
                        <p class="font-medium text-gray-800">确认删除用户？</p>
                        <p class="text-sm text-gray-500 mt-1">删除后无法恢复，请谨慎操作。</p>
                    </div>
                </div>
                <p class="text-sm text-gray-600">要删除的用户：<span id="delete-username" class="font-medium text-gray-800"></span></p>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('delete-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">取消</button>
                <button onclick="submitDeleteUser()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">确认删除</button>
            </div>
        </div>
    </div>

    <div id="reset-password-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    重置密码
                </h3>
                <button onclick="closeModal('reset-password-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center mr-4">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <div>
                        <p class="font-medium text-gray-800">确认重置密码？</p>
                        <p class="text-sm text-gray-500 mt-1">重置后用户将使用新密码登录</p>
                    </div>
                </div>
                <p class="text-sm text-gray-600 mb-4">要重置密码的用户：<span id="reset-username" class="font-medium text-gray-800"></span></p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                        <input type="password" id="reset-new-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入新密码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                        <input type="password" id="reset-confirm-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请再次输入新密码">
                    </div>
                </div>
                <div class="mt-4 p-3 bg-blue-50 rounded-lg">
                    <p class="text-sm text-blue-700 flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        密码要求：至少6位字符，包含字母和数字
                    </p>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('reset-password-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">取消</button>
                <button onclick="submitResetPassword()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">确认重置</button>
            </div>
        </div>

        // ============ 共享：用户数据持久化到 localStorage ============
        function saveUsersToStorage(){
            try{
                localStorage.setItem('systemUsers', JSON.stringify(usersData));
            }catch(e){ console.error('saveUsersToStorage error:', e); }
        }
        function loadUsersFromStorage(){
            try{
                var raw = localStorage.getItem('systemUsers');
                if(!raw) return null;
                var arr = JSON.parse(raw);
                return Array.isArray(arr) ? arr : null;
            }catch(e){ return null; }
        }
        // 页面加载时：优先使用存储中的用户数据，否则初始化并保存
        (function initUsersData(){
            var stored = loadUsersFromStorage();
            if(stored && stored.length){
                usersData.length = 0;
                stored.forEach(function(u){ usersData.push(u); });
            } else {
                saveUsersToStorage();
            }
        })();

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('user-table-body');
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const pageData = filteredData.slice(start, start + pageSize);

            tbody.innerHTML = pageData.map(u => `
                <tr class="hover:bg-gray-50" data-username="${u.username}" data-role="${u.role}">
                    <td class="px-6 py-4 text-sm text-gray-800 whitespace-nowrap">${u.username}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 whitespace-nowrap">${u.name}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center">${u.gender}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center">${u.age}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center">${u.education}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 whitespace-nowrap">${u.phone}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 whitespace-nowrap">${u.department}</td>
                    <td class="px-6 py-4">${getRoleBadge(u.role)}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 whitespace-nowrap">${u.time}</td>
                    <td class="px-6 py-4">${getStatusHtml(u.status)}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-center space-x-2">
                            <button onclick="openEditModal('${u.username}')" class="px-2 py-1 text-blue hover:bg-blue-50 rounded text-xs font-medium transition-colors">编辑</button>
                            <button onclick="openResetPasswordModal('${u.username}', '${u.name}')" class="px-2 py-1 text-purple hover:bg-purple-50 rounded text-xs font-medium transition-colors">重置密码</button>
                            <button onclick="openDeleteModal('${u.username}', '${u.name}')" class="px-2 py-1 text-red hover:bg-red-50 rounded text-xs font-medium transition-colors">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            // 更新分页信息
            const end = Math.min(start + pageSize, filteredData.length);
            document.getElementById('page-info').textContent = filteredData.length > 0 ? `${start + 1}-${end}` : '0-0';
            document.getElementById('total-count').textContent = filteredData.length;

            // 渲染页码按钮
            renderPageButtons(totalPages);
        }

        // 渲染页码按钮
        function renderPageButtons(totalPages) {
            const container = document.getElementById('page-btns');
            let html = '';
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200">1</button>`;
                if (startPage > 2) html += '<span class="px-1 text-gray-400">...</span>';
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="px-3 py-1 text-sm rounded hover:bg-gray-200 ${i === currentPage ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-700'}">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span class="px-1 text-gray-400">...</span>';
                html += `<button onclick="goToPage(${totalPages})" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200">${totalPages}</button>`;
            }

            container.innerHTML = html;

            // 更新上一页/下一页状态
            document.getElementById('prev-btn').style.opacity = currentPage <= 1 ? '0.4' : '1';
            document.getElementById('next-btn').style.opacity = currentPage >= totalPages ? '0.4' : '1';
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size-select').value);
            currentPage = 1;
            renderTable();
        }

        // 查询
        function searchUsers() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const roleFilter = document.getElementById('role-filter').value;

            filteredData = usersData.filter(u => {
                const matchSearch = !searchTerm || u.username.toLowerCase().includes(searchTerm) || u.name.toLowerCase().includes(searchTerm) || u.phone.toLowerCase().includes(searchTerm) || u.department.toLowerCase().includes(searchTerm);
                const matchRole = !roleFilter || u.role === roleFilter;
                return matchSearch && matchRole;
            });

            currentPage = 1;
            renderTable();
        }

        // ===== Modal操作 =====
        function openAddModal() {
            document.getElementById('add-username').value = '';
            document.getElementById('add-name').value = '';
            document.getElementById('add-gender').value = '男';
            document.getElementById('add-age').value = '';
            document.getElementById('add-education').value = '初中';
            document.getElementById('add-phone').value = '';
            document.getElementById('add-department').value = '太和镇';
            document.getElementById('add-role').value = '农技员';
            document.getElementById('add-password').value = '';
            document.getElementById('add-modal').classList.add('active');
        }

        function openResetPasswordModal(username, name) {
            document.getElementById('reset-username').textContent = name + ' (' + username + ')';
            document.getElementById('reset-new-password').value = '';
            document.getElementById('reset-confirm-password').value = '';
            document.getElementById('reset-password-modal').classList.add('active');
        }

        function submitResetPassword() {
            const newPassword = document.getElementById('reset-new-password').value.trim();
            const confirmPassword = document.getElementById('reset-confirm-password').value.trim();

            if (!newPassword) {
                alert('请输入新密码');
                return;
            }
            if (newPassword.length < 6) {
                alert('密码长度至少为6位');
                return;
            }
            if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                alert('密码必须包含字母和数字');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            closeModal('reset-password-modal');
            alert('密码重置成功！');
        }

        function openEditModal(username) {
            const user = usersData.find(u => u.username === username);
            if (!user) return;
            document.getElementById('edit-username').value = user.username;
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-gender').value = user.gender;
            document.getElementById('edit-age').value = user.age;
            document.getElementById('edit-education').value = user.education;
            document.getElementById('edit-phone').value = user.phone;
            document.getElementById('edit-department').value = user.department;
            document.getElementById('edit-role').value = user.role;
            document.getElementById('edit-status').value = user.status;
            document.getElementById('edit-modal').classList.add('active');
        }

        function openDeleteModal(username, name) {
            deleteTarget = username;
            document.getElementById('delete-username').textContent = name + ' (' + username + ')';
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function submitAddUser() {
            const username = document.getElementById('add-username').value.trim();
            const name = document.getElementById('add-name').value.trim();
            const age = document.getElementById('add-age').value.trim();
            if (!username || !name) {
                alert('请填写用户名和姓名');
                return;
            }
            closeModal('add-modal');
            alert('用户添加成功！');
        }

        function submitEditUser() {
            closeModal('edit-modal');
            alert('用户信息修改成功！');
        }

        function submitDeleteUser() {
            closeModal('delete-modal');
            alert('用户删除成功！');
        }

        // 初始渲染
        renderTable();

        // 点击空白关闭弹窗
        document.addEventListener('click', (e) => {
            ['add-modal', 'edit-modal', 'delete-modal', 'reset-password-modal'].forEach(id => {
                const modal = document.getElementById(id);
                if (modal && modal.classList.contains('active') && !modal.contains(e.target) && !e.target.closest('[onclick*="open"]')) {
                    modal.classList.remove('active');
                }
            });
        });

        // 回车键触发查询
        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchUsers();
        });
        document.getElementById('role-filter').addEventListener('change', function() {
            searchUsers();
        });
    </script>
</body>
</html>
