﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统日志 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">系统日志</h1>
                <p class="text-gray-500 mt-1">查看系统运行日志和操作记录</p>
            </div>
            <div class="flex items-center space-x-3">
                <select id="level-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterLogs()">
                    <option value="">全部类型</option>
                    <option value="INFO">INFO</option>
                    <option value="WARN">WARN</option>
                    <option value="ERROR">ERROR</option>
                </select>
                <input type="text" id="search-input" placeholder="搜索日志内容..." class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 w-64" oninput="filterLogs()">
                <button onclick="exportLogs()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    导出日志
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">今日日志数</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1">2,856</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <iconify-icon icon="material-symbols:file-text" class="w-6 h-6 text-blue-600"></iconify-icon>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">INFO</p>
                        <h3 class="text-2xl font-bold text-green-600 mt-1">2,432</h3>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">WARN</p>
                        <h3 class="text-2xl font-bold text-yellow-600 mt-1">356</h3>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">ERROR</p>
                        <h3 class="text-2xl font-bold text-red-600 mt-1">68</h3>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <iconify-icon icon="material-symbols:error" class="w-6 h-6 text-red-600"></iconify-icon>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    日志列表
                </h3>
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-gray-500">显示最近</span>
                    <select id="show-count" class="px-3 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:ring-2 focus:ring-green-500" onchange="changePageSize()">
                        <option value="5">5条</option>
                        <option value="10">10条</option>
                        <option value="20">20条</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">时间</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">级别</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">模块</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">内容</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">IP地址</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">用户</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="log-table-body"></tbody>
                </table>
            </div>
            <div class="p-4 border-t border-gray-100 flex items-center justify-between">
                <p id="pagination-info" class="text-sm text-gray-500">显示 0-0 条，共 0 条</p>
                <div id="pagination-buttons" class="flex items-center space-x-1"></div>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    日志详情
                </h3>
                <button onclick="closeModal('detail-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-1">时间</label>
                        <p id="detail-time" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-1">级别</label>
                        <p id="detail-level" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-1">模块</label>
                        <p id="detail-module" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-1">IP地址</label>
                        <p id="detail-ip" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-1">用户</label>
                        <p id="detail-user" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-1">日志内容</label>
                    <p id="detail-content" class="text-sm text-gray-800 bg-gray-50 px-3 py-3 rounded"></p>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <button onclick="closeModal('detail-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const allLogs = [
            { time: '2026-07-22 10:15:32', level: 'ERROR', module: '气象模块', content: '太和镇气象站连接超时，尝试重连', ip: '192.168.1.105', user: 'system' },
            { time: '2026-07-22 10:12:18', level: 'WARN', module: '模型模块', content: '生长模型参数更新延迟，延迟时间：2s', ip: '192.168.1.102', user: 'admin' },
            { time: '2026-07-22 10:10:05', level: 'INFO', module: '预警模块', content: '高温热害预警规则更新成功，规则ID：RULE-001', ip: '192.168.1.101', user: 'admin' },
            { time: '2026-07-22 10:08:42', level: 'INFO', module: '数据模块', content: '膨大期监测数据上传成功，记录数：156', ip: '192.168.1.103', user: 'user001' },
            { time: '2026-07-22 10:05:20', level: 'WARN', module: '系统模块', content: '磁盘使用率超过80%，请及时清理', ip: '127.0.0.1', user: 'system' },
            { time: '2026-07-22 09:58:11', level: 'INFO', module: '用户模块', content: '管理员登录系统', ip: '192.168.1.101', user: 'admin' },
            { time: '2026-07-22 09:45:33', level: 'INFO', module: '数据模块', content: '南丰镇果园膨大期数据采集完成', ip: '192.168.1.103', user: 'user001' },
            { time: '2026-07-22 09:30:12', level: 'ERROR', module: '气象模块', content: '市山镇气象站温度传感器异常', ip: '192.168.1.106', user: 'system' },
            { time: '2026-07-22 09:15:08', level: 'INFO', module: '预警模块', content: '发布高温橙色预警，涉及5个乡镇', ip: '192.168.1.101', user: 'admin' },
            { time: '2026-07-22 09:00:45', level: 'INFO', module: '模型模块', content: '膨大期生长模型预测任务执行完成', ip: '192.168.1.102', user: 'system' },
            { time: '2026-07-22 08:45:22', level: 'WARN', module: '气象模块', content: '白舍镇气象站信号强度低于50%', ip: '192.168.1.107', user: 'system' },
            { time: '2026-07-22 08:30:10', level: 'INFO', module: '数据模块', content: '昨日产量预测模型数据备份完成', ip: '127.0.0.1', user: 'system' },
            { time: '2026-07-22 08:15:55', level: 'INFO', module: '用户模块', content: 'user002登录系统', ip: '192.168.1.108', user: 'user002' },
            { time: '2026-07-22 08:00:30', level: 'ERROR', module: '系统模块', content: '数据库连接池达到上限，连接数：100', ip: '127.0.0.1', user: 'system' },
            { time: '2026-07-22 07:45:18', level: 'INFO', module: '预警模块', content: '土壤湿度低于阈值预警规则触发，涉及2个地块', ip: '192.168.1.101', user: 'admin' }
        ];

        let filteredLogs = allLogs.slice();
        let currentPage = 1;
        let pageSize = 5;

        function getLevelClass(level) {
            switch (level) {
                case 'ERROR': return 'bg-red-100 text-red-700';
                case 'WARN': return 'bg-yellow-100 text-yellow-700';
                case 'INFO': return 'bg-green-100 text-green-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function filterLogs() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const levelFilter = document.getElementById('level-filter').value;

            filteredLogs = allLogs.filter(log => {
                const matchesSearch = log.content.toLowerCase().includes(searchTerm) ||
                                      log.module.toLowerCase().includes(searchTerm) ||
                                      log.user.toLowerCase().includes(searchTerm) ||
                                      log.ip.toLowerCase().includes(searchTerm);
                const matchesLevel = !levelFilter || log.level === levelFilter;
                return matchesSearch && matchesLevel;
            });

            currentPage = 1;
            renderLogs();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('show-count').value);
            currentPage = 1;
            renderLogs();
        }

        function renderLogs() {
            const tbody = document.getElementById('log-table-body');
            const total = filteredLogs.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredLogs.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-400">暂无日志数据</td></tr>';
            } else {
                tbody.innerHTML = pageData.map((log, idx) => {
                    const actualIndex = start + idx;
                    return '<tr class="hover:bg-gray-50" data-level="' + log.level + '">' +
                        '<td class="px-6 py-4 text-sm text-gray-500">' + log.time + '</td>' +
                        '<td class="px-6 py-4"><span class="px-2 py-0.5 ' + getLevelClass(log.level) + ' text-xs rounded-full">' + log.level + '</span></td>' +
                        '<td class="px-6 py-4 text-sm text-gray-600">' + log.module + '</td>' +
                        '<td class="px-6 py-4 text-sm text-gray-800">' + log.content + '</td>' +
                        '<td class="px-6 py-4 text-sm text-gray-500">' + log.ip + '</td>' +
                        '<td class="px-6 py-4 text-sm text-gray-600">' + log.user + '</td>' +
                        '<td class="px-6 py-4 text-center"><button onclick="openDetailModal(' + actualIndex + ')" class="p-1.5 text-gray-500 hover:text-green-600 hover:bg-green-50 rounded" title="查看详情"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></button></td>' +
                        '</tr>';
                }).join('');
            }

            document.getElementById('pagination-info').textContent = '显示 ' + (total > 0 ? start + 1 : 0) + '-' + end + ' 条，共 ' + total + ' 条';

            let html = '<button onclick="prevPage()" class="px-3 py-1 text-sm ' + (currentPage === 1 ? 'bg-gray-50 text-gray-400 cursor-not-allowed' : 'bg-gray-100 text-gray-700 hover:bg-gray-200') + ' rounded">上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button onclick="changePage(' + i + ')" class="px-3 py-1 text-sm ' + (i === currentPage ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200') + ' rounded">' + i + '</button>';
            }
            html += '<button onclick="nextPage()" class="px-3 py-1 text-sm ' + (currentPage === totalPages ? 'bg-gray-50 text-gray-400 cursor-not-allowed' : 'bg-gray-100 text-gray-700 hover:bg-gray-200') + ' rounded">下一页</button>';
            document.getElementById('pagination-buttons').innerHTML = html;
        }

        function prevPage() {
            if (currentPage > 1) { currentPage--; renderLogs(); }
        }

        function nextPage() {
            const totalPages = Math.max(1, Math.ceil(filteredLogs.length / pageSize));
            if (currentPage < totalPages) { currentPage++; renderLogs(); }
        }

        function changePage(page) {
            currentPage = page;
            renderLogs();
        }

        function openDetailModal(index) {
            const log = filteredLogs[index];
            if (!log) return;
            document.getElementById('detail-time').textContent = log.time;
            const levelEl = document.getElementById('detail-level');
            levelEl.innerHTML = '<span class="px-2 py-0.5 ' + getLevelClass(log.level) + ' text-xs rounded-full">' + log.level + '</span>';
            document.getElementById('detail-module').textContent = log.module;
            document.getElementById('detail-content').textContent = log.content;
            document.getElementById('detail-ip').textContent = log.ip;
            document.getElementById('detail-user').textContent = log.user;
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function exportLogs() {
            const content = '日志级别,模块,操作描述,操作者,操作时间,IP地址\nINFO,用户管理,用户登录成功: admin,admin,2026-07-22 10:30:15,192.168.1.100\nINFO,数据管理,数据表同步完成,admin,2026-07-22 10:35:22,192.168.1.100\nINFO,模型管理,生长模型训练开始,admin,2026-07-22 11:00:00,192.168.1.100\nINFO,模型管理,生长模型训练完成,admin,2026-07-22 11:45:30,192.168.1.100\nWARN,数据管理,IoT设备离线告警: DEV-SOIL-002,system,2026-07-22 12:00:00,127.0.0.1\nINFO,预警管理,预警规则触发: 红蜘蛛爆发预警,system,2026-07-22 14:30:00,127.0.0.1\nERROR,模型管理,病虫害模型推理异常,admin,2026-07-22 15:20:18,192.168.1.101\nINFO,系统管理,系统配置更新完成,admin,2026-07-22 16:00:00,192.168.1.100\nWARN,数据管理,数据同步超时警告,system,2026-07-22 16:30:00,127.0.0.1\nINFO,用户管理,用户登出: admin,admin,2026-07-22 18:00:00,192.168.1.100';
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '系统日志_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('detail-modal');
            if (!modal.contains(e.target) && !e.target.closest('[onclick^="openDetailModal"]')) {
                modal.classList.remove('active');
            }
        });

        renderLogs();
    </script>
</body>
</html>
