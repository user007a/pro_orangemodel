            { id: 'R-20260709-005', type: '虫害识别', result: '红蜘蛛', confidence: 90, user: '种植户C', time: '2026-07-09 10:15', status: '成功', duration: '1.1秒', desc: '叶片检测到红蜘蛛活动痕迹，虫口密度偏高。建议喷施阿维菌素防治。' },
            { id: 'R-20260708-002', type: '病害识别', result: '无法识别', confidence: 25, user: '种植户D', time: '2026-07-08 16:30', status: '失败', duration: '2.3秒', desc: '图片拍摄目标不明确，未包含典型病变部位。建议对准病斑拍摄。' },
            { id: 'R-20260708-001', type: '虫害识别', result: '潜叶蛾', confidence: 86, user: '种植户A', time: '2026-07-08 09:45', status: '成功', duration: '1.2秒', desc: '嫩叶检测到潜叶蛾虫道，呈弯曲状。建议在夏梢萌发期重点防治。' },
            { id: 'R-20260707-003', type: '病害识别', result: '溃疡病', confidence: 78, user: '种植户B', time: '2026-07-07 13:00', status: '成功', duration: '1.4秒', desc: '叶片检测到溃疡病病斑，木栓化突起。建议喷施铜制剂并修剪病枝。' },
            { id: 'R-20260707-002', type: '病害识别', result: '无法识别', confidence: 38, user: '种植户C', time: '2026-07-07 10:30', status: '失败', duration: '2.0秒', desc: '图片光线不足，特征提取失败。建议在自然光下重新拍摄。' }
        ];

        let currentPage = 1;
        let pageSize = 5;
        let filteredLogs = logs.slice();

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = logs.length;
            document.getElementById('stat-success').textContent = logs.filter(l => l.status === '成功').length;
            document.getElementById('stat-fail').textContent = logs.filter(l => l.status === '失败').length;
            const successLogs = logs.filter(l => l.status === '成功');
            const avgConf = successLogs.length ? Math.round(successLogs.reduce((s, l) => s + l.confidence, 0) / successLogs.length * 10) / 10 : 0;
            document.getElementById('stat-confidence').textContent = avgConf + '%';
        }

        function renderTable() {
            const tbody = document.getElementById('log-table-body');
            const emptyTip = document.getElementById('empty-tip');
            const total = filteredLogs.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredLogs.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '';
                emptyTip.classList.remove('hidden');
            } else {
                emptyTip.classList.add('hidden');
                tbody.innerHTML = pageData.map(l => {
                    const typeStyle = TYPE_STYLES[l.type] || 'bg-gray-100 text-gray-700';
                    const statusStyle = STATUS_STYLES[l.status] || 'bg-gray-100 text-gray-700';
                    const confColor = l.confidence >= 80 ? 'bg-green-600' : (l.confidence >= 60 ? 'bg-yellow-500' : 'bg-red-500');
                    return `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-500">${escapeHtml(l.id)}</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 ${typeStyle} text-xs rounded-full">${escapeHtml(l.type)}</span></td>
                            <td class="px-6 py-4 text-sm text-gray-900">${escapeHtml(l.result)}</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center">
                                    <div class="w-24 h-2 bg-gray-200 rounded-full overflow-hidden">
                                        <div class="h-full ${confColor} rounded-full" style="width: ${l.confidence}%"></div>
                                    </div>
                                    <span class="ml-2 text-sm text-gray-600">${l.confidence}%</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(l.user)}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${escapeHtml(l.time)}</td>
                            <td class="px-6 py-4 text-center"><span class="px-2 py-1 ${statusStyle} text-xs rounded-full">${escapeHtml(l.status)}</span></td>
                            <td class="px-6 py-4">
                                <div class="flex items-center justify-center space-x-3">
                                    <button onclick="openDetailModal('${l.id}')" class="px-3 py-1 text-green hover:bg-green-50 rounded text-xs font-medium transition-colors">查看</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('page-info').textContent = total === 0 ? '共 0 条记录' : `第 ${start + 1}-${end} 条，共 ${total} 条记录`;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            let html = '';
            html += `<button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">上一页</button>`;
            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            if (start > 1) {
                html += `<button onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">1</button>`;
                if (start > 2) html += `<span class="px-2 text-gray-400">...</span>`;
            }
            for (let i = start; i <= end; i++) {
                html += `<button onclick="changePage(${i})" class="pagination-btn px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            if (end < totalPages) {
                if (end < totalPages - 1) html += `<span class="px-2 text-gray-400">...</span>`;
                html += `<button onclick="changePage(${totalPages})" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">${totalPages}</button>`;
            }
            html += `<button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">下一页</button>`;
            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.max(1, Math.ceil(filteredLogs.length / pageSize));
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }
        function nextPage() {
            const totalPages = Math.max(1, Math.ceil(filteredLogs.length / pageSize));
            if (currentPage < totalPages) { currentPage++; renderTable(); }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderTable();
        }

        function filterLogs() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const type = document.getElementById('type-filter').value;
            const status = document.getElementById('status-filter').value;
            filteredLogs = logs.filter(l => {
                const matchKeyword = !keyword || l.id.toLowerCase().includes(keyword) || l.result.toLowerCase().includes(keyword);
                const matchType = !type || l.type === type;
                const matchStatus = !status || l.status === status;
                return matchKeyword && matchType && matchStatus;
            });
            currentPage = 1;
            renderTable();
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('type-filter').value = '';
            document.getElementById('status-filter').value = '';
            filteredLogs = logs.slice();
            currentPage = 1;
            renderTable();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function openDetailModal(id) {
            const l = logs.find(x => x.id === id);
            if (!l) return;
            document.getElementById('detail-id').textContent = l.id;
            document.getElementById('detail-type').textContent = l.type;
            document.getElementById('detail-result').textContent = l.result;
            document.getElementById('detail-confidence').textContent = l.confidence + '%';
            document.getElementById('detail-user').textContent = l.user;
            document.getElementById('detail-time').textContent = l.time;
            document.getElementById('detail-status').textContent = l.status;
            document.getElementById('detail-duration').textContent = l.duration;
            document.getElementById('detail-desc').textContent = l.desc;
            document.getElementById('detail-modal').classList.add('active');
        }

        function exportLogs() {
            const content = '任务编号,识别类型,识别结果,置信度,上传用户,上传时间,状态\n' +
                logs.map(l => `${l.id},${l.type},${l.result},${l.confidence}%,${l.user},${l.time},${l.status}`).join('\n');
            const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '识别日志_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
            alert('导出成功！共导出 ' + logs.length + ' 条识别日志。');
        }

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('detail-modal');
            if (modal && e.target === modal) modal.classList.remove('active');
        });

        updateStats();
        renderTable();
    </script>
</body>
</html>
