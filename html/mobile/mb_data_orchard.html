<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 我的果园</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .stats-bar {
      display: flex; gap: 8px;
      padding: 0 16px; margin: 12px 0 16px;
      position: relative; z-index: 10;
    }
    
    .stat-card {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .stat-num {
      font-size: var(--font-lg); font-weight: 700;
      color: var(--primary);
      font-family: var(--font-family-number);
    }
    
    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 2px;
      font-weight: var(--font-medium);
    }

    .plot-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin: 0 16px 16px;
      padding: 20px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    
    .plot-card:active { transform: scale(0.99); }
    
    .plot-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .plot-name {
      font-size: var(--font-lg);
      font-weight: var(--font-semibold);
      color: var(--text);
    }
    
    .plot-status {
      font-size: var(--font-xs);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: var(--font-medium);
    }
    
    .plot-status.normal { background: var(--success-light); color: var(--success-dark); }
    .plot-status.warning { background: var(--warning-light); color: var(--warning-dark); }
    
    .plot-info {
      display: flex; gap: 20px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    
    .plot-info-item {
      display: flex; align-items: center; gap: 6px;
    }
    
    .plot-info-item svg { width: 16px; height: 16px; }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <div class="skeleton-state">
      <div class="mb-header-detail">
        <div class="mb-skeleton" style="width:100px;height:24px;margin-bottom:6px;"></div>
        <div class="mb-skeleton" style="width:160px;height:14px;"></div>
      </div>
      <div class="stats-bar">
        <div class="stat-card"><div class="mb-skeleton" style="width:32px;height:24px;margin:0 auto;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:4px auto 0;"></div></div>
        <div class="stat-card"><div class="mb-skeleton" style="width:32px;height:24px;margin:0 auto;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:4px auto 0;"></div></div>
        <div class="stat-card"><div class="mb-skeleton" style="width:32px;height:24px;margin:0 auto;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:4px auto 0;"></div></div>
      </div>
      <div class="plot-card"><div class="mb-skeleton" style="width:100%;height:80px;border-radius:var(--radius-xl);"></div></div>
      <div class="plot-card"><div class="mb-skeleton" style="width:100%;height:80px;border-radius:var(--radius-xl);"></div></div>
      <div class="plot-card"><div class="mb-skeleton" style="width:100%;height:80px;border-radius:var(--radius-xl);"></div></div>
      <div class="plot-card"><div class="mb-skeleton" style="width:100%;height:80px;border-radius:var(--radius-xl);"></div></div>
    </div>

    <div class="real-content">
      <div class="mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="navigateTo('mb_profile.html')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">我的果园</div>
      </div>
      <div class="header-content">
        <div class="header-sub">管理您负责的种植地块</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num">4</div>
        <div class="stat-label">总地块</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">68</div>
        <div class="stat-label">总面积(亩)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">1</div>
        <div class="stat-label">预警地块</div>
      </div>
    </div>

    <div style="padding-bottom: 80px;">
      <div class="plot-card" onclick="showPlotDetail('1号早熟蜜桔区', '15亩', '南丰蜜桔早熟种', '正常')">
        <div class="plot-header">
          <div class="plot-name">1号早熟蜜桔区</div>
          <span class="plot-status normal">正常</span>
        </div>
        <div class="plot-info">
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
            </svg>
            <span>南丰蜜桔早熟种</span>
          </div>
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <span>15亩</span>
          </div>
        </div>
      </div>

      <div class="plot-card" onclick="showPlotDetail('2号中熟蜜桔区', '18亩', '南丰蜜桔中熟种', '预警')">
        <div class="plot-header">
          <div class="plot-name">2号中熟蜜桔区</div>
          <span class="plot-status warning">预警</span>
        </div>
        <div class="plot-info">
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
            </svg>
            <span>南丰蜜桔中熟种</span>
          </div>
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <span>18亩</span>
          </div>
        </div>
      </div>

      <div class="plot-card" onclick="showPlotDetail('3号晚熟蜜桔区', '20亩', '南丰蜜桔晚熟种', '正常')">
        <div class="plot-header">
          <div class="plot-name">3号晚熟蜜桔区</div>
          <span class="plot-status normal">正常</span>
        </div>
        <div class="plot-info">
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
            </svg>
            <span>南丰蜜桔晚熟种</span>
          </div>
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <span>20亩</span>
          </div>
        </div>
      </div>

      <div class="plot-card" onclick="showPlotDetail('4号试验田', '15亩', '新品种试验', '正常')">
        <div class="plot-header">
          <div class="plot-name">4号试验田</div>
          <span class="plot-status normal">正常</span>
        </div>
        <div class="plot-info">
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
            </svg>
            <span>新品种试验</span>
          </div>
          <div class="plot-info-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <span>15亩</span>
          </div>
        </div>
      </div>

      <button class="mb-btn mb-btn-primary" style="display:flex;align-items:center;justify-content:center;margin: 16px auto 0;min-width:180px;" onclick="showAddPlotModal()">+ 添加新地块</button>
    </div>
    </div></div>

    <div class="mb-modal-overlay" id="addPlotModal">
      <div class="mb-modal">
        <div class="mb-modal-header">
          <div class="mb-modal-title">添加新地块</div>
        </div>
        <div class="mb-modal-body">
          <div class="mb-form">
            <div class="mb-form-item">
              <label class="mb-form-label">地块名称</label>
              <input type="text" class="mb-form-input" id="plotName" placeholder="请输入地块名称">
            </div>
            <div class="mb-form-item">
              <label class="mb-form-label">面积(亩)</label>
              <input type="number" class="mb-form-input" id="plotArea" placeholder="请输入面积">
            </div>
            <div class="mb-form-item">
              <label class="mb-form-label">品种</label>
              <div class="mb-form-select" onclick="showVarietyPicker()">
                <span id="plotVariety" style="display:block;">请选择品种</span>
              </div>
            </div>
          </div>
        </div>
        <div class="mb-modal-footer">
          <div class="mb-modal-btn" onclick="closeModal('addPlotModal')">取消</div>
          <div class="mb-modal-btn primary" onclick="addPlot()">确认添加</div>
        </div>
      </div>
    </div>

    <div class="mb-modal-overlay" id="varietyPickerModal">
      <div class="mb-modal">
        <div class="mb-modal-header">
          <div class="mb-modal-title">选择品种</div>
        </div>
        <div class="mb-modal-body" style="max-height: 300px; overflow-y: auto;">
          <div style="padding: 8px 0;">
            <div onclick="selectVariety('南丰蜜桔早熟种')" style="padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px; cursor: pointer;">南丰蜜桔早熟种</div>
            <div onclick="selectVariety('南丰蜜桔中熟种')" style="padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px; cursor: pointer;">南丰蜜桔中熟种</div>
            <div onclick="selectVariety('南丰蜜桔晚熟种')" style="padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px; cursor: pointer;">南丰蜜桔晚熟种</div>
            <div onclick="selectVariety('其他')" style="padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px; cursor: pointer;">其他</div>
          </div>
        </div>
        <div class="mb-modal-footer">
          <div class="mb-modal-btn" onclick="closeModal('varietyPickerModal')">取消</div>
        </div>
      </div>
    </div>

    <div class="mb-modal-overlay" id="successModal">
      <div class="mb-modal" style="max-width: 280px;">
        <div style="text-align: center; padding: 32px 24px;">
          <div style="width: 64px; height: 64px; background: var(--success-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 32px; height: 32px; color: var(--success-dark);"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div style="font-size: var(--font-lg); font-weight: var(--font-bold); color: var(--text); margin-bottom: 8px;">操作成功</div>
          <div style="font-size: var(--font-sm); color: var(--text-secondary);">地块信息已更新</div>
        </div>
        <div class="mb-modal-footer">
          <div class="mb-modal-btn primary" onclick="closeModal('successModal')">确定</div>
        </div>
      </div>
    </div>
    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_data.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>监测</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_disease_knowledge.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>病虫害</span>
      </div>
      <div class="mb-tab-item active">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
<script>
      function navigateTo(page) { window.location.href = page; }
      
      function showPlotDetail(name, area, variety, status) {
        document.getElementById('plotTitle').textContent = name;
        var statusColor = status === '正常' ? 'var(--success-dark)' : 'var(--warning-dark)';
        var statusBg = status === '正常' ? 'var(--success-light)' : 'var(--warning-light)';
        
        document.getElementById('plotDetailContent').innerHTML = `
          <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
            <div>
              <div style="font-size: var(--font-xs); color: var(--text-secondary);">面积</div>
              <div style="font-size: var(--font-xl); font-weight: var(--font-extrabold); font-family: var(--font-family-number);">${area}</div>
            </div>
            <div>
              <div style="font-size: var(--font-xs); color: var(--text-secondary);">品种</div>
              <div style="font-size: var(--font-xl); font-weight: var(--font-extrabold); font-family: var(--font-family-number);">${variety}</div>
            </div>
            <div>
              <div style="font-size: var(--font-xs); color: var(--text-secondary);">状态</div>
              <span style="padding: 4px 10px; border-radius: var(--radius-full); font-size: var(--font-xs); font-weight: var(--font-medium); background: ${statusBg}; color: ${statusColor};">${status}</span>
            </div>
          </div>
          <div style="border-top: 1px solid var(--border); padding-top: 16px;">
            <div style="font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text); margin-bottom: 12px;">地块信息</div>
            <div style="display: flex; justify-content: space-between; font-size: var(--font-sm); margin-bottom: 8px;">
              <span style="color: var(--text-secondary);">土壤类型</span>
              <span>红壤</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: var(--font-sm); margin-bottom: 8px;">
              <span style="color: var(--text-secondary);">PH值</span>
              <span>5.8</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: var(--font-sm); margin-bottom: 8px;">
              <span style="color: var(--text-secondary);">有机质含量</span>
              <span>2.1%</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: var(--font-sm);">
              <span style="color: var(--text-secondary);">树龄</span>
              <span>8年</span>
            </div>
          </div>
        `;
        document.getElementById('detailModal').classList.add('show');
      }
      
      function viewPlotData() {
        closeModal('detailModal');
        navigateTo('mb_data_monitor.html');
      }
      
      function showAddPlotModal() {
        document.getElementById('plotName').value = '';
        document.getElementById('plotArea').value = '';
        document.getElementById('plotVariety').textContent = '请选择品种';
        document.getElementById('addPlotModal').classList.add('show');
      }
      
      function showVarietyPicker() {
        document.getElementById('varietyPickerModal').classList.add('show');
      }
      
      function selectVariety(variety) {
        document.getElementById('plotVariety').textContent = variety;
        closeModal('varietyPickerModal');
      }
      
      function addPlot() {
        var name = document.getElementById('plotName').value;
        var area = document.getElementById('plotArea').value;
        var variety = document.getElementById('plotVariety').textContent;
        
        if (!name || !area || variety === '请选择品种') {
          alert('请填写完整地块信息');
          return;
        }
        
        closeModal('addPlotModal');
        document.getElementById('successModal').classList.add('show');
      }
      
      function closeModal(id) {
        document.getElementById(id).classList.remove('show');
      }
      
      (function() {
        var app = document.querySelector('.mb-app');
        setTimeout(function() {
          app.classList.remove('loading');
        }, 600);
      })();
    </script>
  </body>
</html>
