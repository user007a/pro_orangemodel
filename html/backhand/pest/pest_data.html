<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>监测数据 - 南丰蜜桔模型管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes modalSlideIn { from { opacity: 0; transform: translateY(-20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-overlay.active .modal-content { animation: modalSlideIn 0.3s ease; }
body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
.content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
.modal-overlay { display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center }
.modal-content { background:#fff;border-radius:12px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto }
.tab-active{color:#16a34a;border-bottom:2px solid #16a34a;font-weight:600}
.tab-inactive{color:#6b7280;border-bottom:2px solid transparent}
.tab-inactive:hover{color:#374151}
.text-green{color:#16a34a} .text-blue{color:#2563eb} .text-red{color:#dc2626}
.form-input{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none}
.form-input:focus{border-color:#16a34a;box-shadow:0 0 0 2px rgba(22,163,74,0.1)}
</style>
</head>
<body>
<div class="content-wrapper">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-bold text-gray-800">监测数据</h1>
      <p class="text-gray-500 text-sm mt-1">管理病虫害预测模型的输入数据向量 Xt = [Wt, Pt, Dt, It, Ht]</p>
    </div>
    <button onclick="openAdd()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium flex items-center">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>新增数据
    </button>
  </div>

  <!-- Tab Bar -->

      <div class="tab-item px-4 py-4 cursor-pointer text-sm mr-6 tab-inactive whitespace-nowrap" data-tab="dt" onclick="switchTab('dt')">病情虫情 (Dt)</div>
      <div class="tab-item px-4 py-4 cursor-pointer text-sm mr-6 tab-inactive whitespace-nowrap" data-tab="it" onclick="switchTab('it')">虫源基数 (It)</div>
      <div class="tab-item px-4 py-4 cursor-pointer text-sm mr-6 tab-inactive whitespace-nowrap" data-tab="ht" onclick="switchTab('ht')">历史数据 (Ht)</div>
    </div>
  </div>

  <!-- wt Tab -->
  <div id="tab-wt" class="tab-content">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4 flex flex-wrap items-center gap-3">
      <select id="wt-town-filter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm" onchange="currentPage.wt=1;renderTable('wt')"><option value="">全部乡镇</option></select>
      <input type="date" id="wt-date-from" value="2026-07-20" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
      <span class="text-gray-400 text-sm">至</span>
      <input type="date" id="wt-date-to" value="2026-08-04" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
      <button onclick="currentPage.wt=1;renderTable('wt')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">查询</button>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4 overflow-hidden">
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-gray-50" id="wt-thead"></tr></thead><tbody id="wt-tbody"></tbody></table></div>
      <div class="p-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">

        <div class="flex gap-2"><button onclick="prevPage('wt')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">上一页</button><button onclick="nextPage('wt')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">下一页</button></div>
      </div>
    </div>
  </div>

  <!-- dt Tab -->
  <div id="tab-dt" class="tab-content" style="display:none">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4 flex flex-wrap items-center gap-3">
      <select id="dt-town-filter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm" onchange="currentPage.dt=1;renderTable('dt')"><option value="">全部乡镇</option></select>

      <span class="text-gray-400 text-sm">至</span>

      <button onclick="currentPage.dt=1;renderTable('dt')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">查询</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4 overflow-hidden">

        <span id="dt-page-info"></span>
        <div class="flex gap-2"><button onclick="prevPage('dt')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">上一页</button><button onclick="nextPage('dt')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">下一页</button></div>
      </div>
    </div>

  <!-- it Tab -->

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4 overflow-hidden">

      <div class="p-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
        <span id="it-page-info"></span>
        <div class="flex gap-2"><button onclick="prevPage('it')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">上一页</button><button onclick="nextPage('it')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">下一页</button></div>

<!-- Add/Edit Modal -->
<div id="form-modal" class="modal-overlay">
  <div class="modal-content">
    <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">

      <button onclick="closeModal('form-modal')" style="padding:4px;background:none;border:none;cursor:pointer;font-size:20px">&times;</button>
    </div>
    <div id="form-fields" style="padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px"></div>
    <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px">
      <button onclick="closeModal('form-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
      <button onclick="saveForm()" style="padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">保存</button>
    </div>
  </div>
</div>

<!-- View Modal -->
<div id="view-modal" class="modal-overlay">
  <div class="modal-content">
    <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">

      <button onclick="closeModal('view-modal')" style="padding:4px;background:none;border:none;cursor:pointer;font-size:20px">&times;</button>
    </div>
    <div id="view-fields" style="padding:8px 24px"></div>
    <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end">
      <button onclick="closeModal('view-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">关闭</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div id="delete-modal" class="modal-overlay">
  <div class="modal-content" style="max-width:420px">
    <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
      <h3 style="font-size:18px;font-weight:600;color:#1f2937">确认删除</h3>
      <button onclick="closeModal('delete-modal')" style="padding:4px;background:none;border:none;cursor:pointer;font-size:20px">&times;</button>
    </div>
    <div style="padding:24px"><p style="font-size:14px;color:#374151">确定要删除该条数据吗？此操作不可撤销。</p></div>
    <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px">
      <button onclick="closeModal('delete-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
      <button onclick="confirmDelete()" style="padding:8px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">确认删除</button>
    </div>
  </div>
</div>

  ht: [{k:'town',l:'乡镇'},{k:'year',l:'年份'},{k:'level',l:'同期发生水平'},{k:'trend',l:'历史趋势'},{k:'cycle',l:'流行周期'}]
};

var fieldConfig = {
  wt: [{k:'town',l:'乡镇',t:'select',opts:townships},{k:'date',l:'日期',t:'date'},{k:'temp',l:'温度(°C)',t:'number'},{k:'humidity',l:'湿度(%)',t:'number'},{k:'rain',l:'降雨量(mm)',t:'number'},{k:'light',l:'光照(klx)',t:'number'},{k:'wind',l:'风速(m/s)',t:'number',step:'0.1'}],
  dt: [{k:'town',l:'乡镇',t:'select',opts:townships},{k:'date',l:'日期',t:'date'},{k:'type',l:'病虫害类型',t:'select',opts:['红蜘蛛','黄龙病','炭疽病','潜叶蛾','溃疡病','疮痂病']},{k:'spot',l:'病斑率(%)',t:'number'},{k:'density',l:'虫口密度(头/叶)',t:'number'},{k:'egg',l:'卵量(粒/叶)',t:'number'}],
  it: [{k:'town',l:'乡镇',t:'select',opts:townships},{k:'date',l:'日期',t:'date'},{k:'stype',l:'虫源类型',t:'select',opts:['红蜘蛛越冬','木虱越冬','潜叶蛾越冬','炭疽病菌源','溃疡病菌源']},{k:'winter',l:'越冬虫源(头/m²)',t:'number'},{k:'cfu',l:'病原菌量(CFU/g)',t:'number'},{k:'remark',l:'备注',t:'text'}],
  ht: [{k:'town',l:'乡镇',t:'select',opts:townships},{k:'year',l:'年份',t:'number'},{k:'level',l:'同期发生水平',t:'select',opts:['轻度','中度','偏重','重度']},{k:'trend',l:'历史趋势',t:'text'},{k:'cycle',l:'流行周期',t:'text'}]
};

var allData = {
  wt: [
    {town:'琴城镇',date:'2026-08-04',temp:33,humidity:78,rain:5,light:45,wind:2.3},
    {town:'市山镇',date:'2026-08-04',temp:32,humidity:80,rain:8,light:42,wind:2.1},
    {town:'洽湾镇',date:'2026-08-03',temp:34,humidity:75,rain:0,light:48,wind:3.0},
    {town:'太和镇',date:'2026-08-03',temp:31,humidity:82,rain:12,light:38,wind:1.8},
    {town:'桑田镇',date:'2026-08-02',temp:30,humidity:85,rain:25,light:32,wind:1.5},
    {town:'白舍镇',date:'2026-08-02',temp:33,humidity:72,rain:3,light:46,wind:2.8},
    {town:'紫霄镇',date:'2026-08-01',temp:32,humidity:79,rain:6,light:44,wind:2.0},
    {town:'三溪乡',date:'2026-07-30',temp:29,humidity:84,rain:18,light:35,wind:1.6},
    {town:'傅坊乡',date:'2026-07-28',temp:35,humidity:68,rain:0,light:50,wind:3.5}
  ],
  dt: [
    {town:'琴城镇',date:'2026-08-04',type:'红蜘蛛',spot:12,density:8,egg:5},
    {town:'市山镇',date:'2026-08-04',type:'炭疽病',spot:18,density:0,egg:0},
    {town:'洽湾镇',date:'2026-08-03',type:'潜叶蛾',spot:5,density:12,egg:9},
    {town:'太和镇',date:'2026-08-03',type:'黄龙病',spot:8,density:6,egg:3},
    {town:'桑田镇',date:'2026-08-02',type:'红蜘蛛',spot:22,density:15,egg:11},
    {town:'白舍镇',date:'2026-08-02',type:'溃疡病',spot:14,density:0,egg:0},
    {town:'紫霄镇',date:'2026-08-01',type:'疮痂病',spot:10,density:2,egg:1},
    {town:'三溪乡',date:'2026-07-30',type:'红蜘蛛',spot:7,density:5,egg:4},
    {town:'傅坊乡',date:'2026-07-28',type:'潜叶蛾',spot:9,density:10,egg:7}
  ],
  it: [
    {town:'琴城镇',date:'2026-08-04',stype:'红蜘蛛越冬',winter:12,cfu:0,remark:'越冬基数偏高'},
    {town:'市山镇',date:'2026-08-04',stype:'炭疽病菌源',winter:0,cfu:3500,remark:'菌源量中等'},
    {town:'洽湾镇',date:'2026-08-03',stype:'潜叶蛾越冬',winter:8,cfu:0,remark:'虫源分布广'},
    {town:'太和镇',date:'2026-08-03',stype:'木虱越冬',winter:6,cfu:0,remark:'黄龙病媒介'},
    {town:'桑田镇',date:'2026-08-02',stype:'红蜘蛛越冬',winter:15,cfu:0,remark:'需重点防控'},
    {town:'白舍镇',date:'2026-08-02',stype:'溃疡病菌源',winter:0,cfu:2800,remark:'春季侵染源'},
    {town:'紫霄镇',date:'2026-08-01',stype:'潜叶蛾越冬',winter:5,cfu:0,remark:'基数偏低'},
    {town:'三溪乡',date:'2026-07-30',stype:'红蜘蛛越冬',winter:9,cfu:0,remark:'正常水平'},
    {town:'傅坊乡',date:'2026-07-28',stype:'炭疽病菌源',winter:0,cfu:2200,remark:'老果园菌源'}
  ],
  ht: [
    {town:'琴城镇',year:2024,level:'偏重',trend:'逐年上升',cycle:'3年一流行'},
    {town:'琴城镇',year:2022,level:'中度',trend:'平稳',cycle:'3年一流行'},
    {town:'琴城镇',year:2020,level:'轻度',trend:'低位运行',cycle:'3年一流行'},
    {town:'市山镇',year:2024,level:'中度',trend:'波动',cycle:'4年一流行'},
    {town:'市山镇',year:2021,level:'偏重',trend:'高峰',cycle:'4年一流行'},
    {town:'洽湾镇',year:2023,level:'重度',trend:'高峰年',cycle:'5年一流行'},
    {town:'太和镇',year:2024,level:'轻度',trend:'下降',cycle:'3年一流行'},
    {town:'桑田镇',year:2022,level:'偏重',trend:'上升',cycle:'3年一流行'},
    {town:'白舍镇',year:2024,level:'中度',trend:'平稳',cycle:'4年一流行'}
  ]
};

var currentTab = 'wt';
var currentPage = {wt:1,dt:1,it:1,ht:1};
var pageSize = 5;
var editIdx = null;
var formTab = null;
var delTarget = null;

window.onload = function() {
  populateTownFilters();
  ['wt','dt','it','ht'].forEach(function(t){
    renderThead(t);
    renderTable(t);
  });
};

function populateTownFilters() {
  townships.forEach(function(tw){
    ['wt','dt','it','ht'].forEach(function(t){
      var sel = document.getElementById(t+'-town-filter');
      if(sel){ var o=document.createElement('option'); o.value=tw; o.textContent=tw; sel.appendChild(o); }
    });
  });
}

function renderThead(tab) {
  var html = '';
  colConfig[tab].forEach(function(c){ html += '<th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">'+c.l+'</th>'; });
  html += '<th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>';
  document.getElementById(tab+'-thead').innerHTML = html;
}

function getFiltered(tab) {
  var town = document.getElementById(tab+'-town-filter').value;
  var dFrom = document.getElementById(tab+'-date-from').value;
  var dTo = document.getElementById(tab+'-date-to').value;
  return allData[tab].filter(function(d){
    if(town && d.town !== town) return false;
    if(d.date && dFrom && d.date < dFrom) return false;
    if(d.date && dTo && d.date > dTo) return false;
    return true;
  });
}

function renderTable(tab) {
  var filtered = getFiltered(tab);
  var totalPages = Math.max(1, Math.ceil(filtered.length/pageSize));
  if(currentPage[tab] > totalPages) currentPage[tab] = totalPages;
  var start = (currentPage[tab]-1)*pageSize;
  var pageData = filtered.slice(start, start+pageSize);
  var cols = colConfig[tab];
  var html = '';
  pageData.forEach(function(d){
    var realIdx = allData[tab].indexOf(d);
    html += '<tr class="border-b border-gray-100 hover:bg-gray-50">';
    cols.forEach(function(c){ html += '<td class="px-4 py-3 text-gray-700">'+(d[c.k]!==undefined&&d[c.k]!==''?d[c.k]:'-')+'</td>'; });
    html += '<td class="px-4 py-3"><div class="flex gap-2">'+
      '<button onclick="viewDetail(\''+tab+'\','+realIdx+')" class="px-2 py-1 text-green hover:bg-green-50 rounded text-xs">查看</button>'+
      '<button onclick="openEdit(\''+tab+'\','+realIdx+')" class="px-2 py-1 text-blue hover:bg-blue-50 rounded text-xs">编辑</button>'+
      '<button onclick="openDelete(\''+tab+'\','+realIdx+')" class="px-2 py-1 text-red hover:bg-red-50 rounded text-xs">删除</button>'+
      '</div></td></tr>';
  });
  if(pageData.length===0) html = '<tr><td colspan="'+(cols.length+1)+'" class="text-center py-8 text-gray-400">暂无数据</td></tr>';
  document.getElementById(tab+'-tbody').innerHTML = html;
  document.getElementById(tab+'-page-info').textContent = '第 '+currentPage[tab]+' / '+totalPages+' 页，共 '+filtered.length+' 条';
}

function prevPage(tab){ if(currentPage[tab]>1){currentPage[tab]--;renderTable(tab);} }
function nextPage(tab){ var tp=Math.max(1,Math.ceil(getFiltered(tab).length/pageSize)); if(currentPage[tab]<tp){currentPage[tab]++;renderTable(tab);} }

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(function(el){ el.classList.remove('tab-active'); el.classList.add('tab-inactive'); });
  var at = document.querySelector('[data-tab="'+tab+'"]');
  if(at){ at.classList.remove('tab-inactive'); at.classList.add('tab-active'); }
  document.querySelectorAll('.tab-content').forEach(function(el){ el.style.display = 'none'; });
  var target = document.getElementById('tab-'+tab);
  if(target) target.style.display = '';
}

function showModal(id){ var m=document.getElementById(id); if(m){m.style.display='flex';m.classList.add('active');} }
function hideModal(id){ var m=document.getElementById(id); if(m){m.style.display='none';m.classList.remove('active');} }
function closeModal(id){ hideModal(id); }

function tabName(tab){ return {wt:'气象',dt:'病情虫情',it:'虫源基数',ht:'历史'}[tab]||''; }

function buildFormFields(tab, data) {
  var html = '';
  fieldConfig[tab].forEach(function(f){
    var val = data && data[f.k]!==undefined ? data[f.k] : '';
    html += '<div><label class="block text-xs font-medium text-gray-600 mb-1">'+f.l+'</label>';
    if(f.t==='select'){
      html += '<select class="form-input" name="'+f.k+'"><option value="">请选择</option>';
      f.opts.forEach(function(o){ html += '<option value="'+o+'" '+(val===o?'selected':'')+'>'+o+'</option>'; });
      html += '</select>';
    } else {
      html += '<input type="'+f.t+'" class="form-input" name="'+f.k+'" value="'+val+'"'+(f.step?' step="'+f.step+'"':'')+'>';
    }
    html += '</div>';
  });
  return html;
}

function openAdd(){ formTab=currentTab; editIdx=null; document.getElementById('form-title').textContent='新增'+tabName(currentTab)+'数据'; document.getElementById('form-fields').innerHTML=buildFormFields(currentTab,null); showModal('form-modal'); }
function openEdit(tab,idx){ formTab=tab; editIdx=idx; document.getElementById('form-title').textContent='编辑'+tabName(tab)+'数据'; document.getElementById('form-fields').innerHTML=buildFormFields(tab,allData[tab][idx]); showModal('form-modal'); }

function saveForm(){
  var tab = formTab;
  var fields = fieldConfig[tab];
  var obj = {}; var valid = true;
  fields.forEach(function(f){
    var el = document.querySelector('#form-fields [name="'+f.k+'"]');
    var v = el ? el.value : '';
    if(f.t==='number' && v!=='') v = Number(v);
    obj[f.k] = v;
    if(v==='' || v===null) valid = false;
  });
  if(!valid){ alert('请完整填写所有字段'); return; }
  if(editIdx===null){ allData[tab].push(obj); } else { allData[tab][editIdx] = obj; }
  hideModal('form-modal');
  renderTable(tab);
}

function viewDetail(tab,idx){
  var d = allData[tab][idx];
  var html = '';
  fieldConfig[tab].forEach(function(f){
    html += '<div class="flex justify-between py-2 border-b border-gray-100"><span class="text-gray-500 text-sm">'+f.l+'</span><span class="text-gray-800 text-sm font-medium">'+(d[f.k]!==undefined&&d[f.k]!==''?d[f.k]:'-')+'</span></div>';
  });
  document.getElementById('view-fields').innerHTML = html;
  showModal('view-modal');
}

function openDelete(tab,idx){ delTarget={tab:tab,idx:idx}; showModal('delete-modal'); }
function confirmDelete(){ if(delTarget){ allData[delTarget.tab].splice(delTarget.idx,1); renderTable(delTarget.tab); delTarget=null; } hideModal('delete-modal'); }

document.addEventListener('click', function(e){
  var ids=['form-modal','view-modal','delete-modal'];
  for(var i=0;i<ids.length;i++){
    var m=document.getElementById(ids[i]);
    if(m && m.style.display==='flex'){
      var inner=m.children[0];
      if(inner && !inner.contains(e.target) && e.target===m){ m.style.display='none'; m.classList.remove('active'); }
    }
  }
});
</script>
</body>
</html>
