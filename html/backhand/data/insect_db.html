<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虫害数据库 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: {
        green: { DEFAULT: '#16a34a' },
        blue: { DEFAULT: '#2563eb' },
        red: { DEFAULT: '#dc2626' },
        yellow: { DEFAULT: '#ca8a04' },
        purple: { DEFAULT: '#9333ea' }
      }}}}
    </script>
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-gray-800">虫害数据库</h1>
                <p class="text-gray-500 text-sm mt-1">管理南丰蜜桔虫害知识数据（业务知识库，与病害库共用 schema）</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openFormModal(null, 'add')" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    添加虫害
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                    <div class="flex-1 min-w-[220px] max-w-md">
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="search-input" placeholder="全文检索：名称/形态/危害/防治/物候..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" oninput="filterInsects()">
                        </div>
                    </div>
                    <select id="type-filter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterInsects()">
                        <option value="">全部分类</option>
                        <option value="螨类">螨类</option>
                        <option value="蛾类">蛾类</option>
                        <option value="虱类">虱类</option>
                        <option value="其他">其他</option>
                    </select>
                    <select id="parts-filter" multiple size="1" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 min-w-[110px]" onchange="filterInsects()" title="可多选（按住 Ctrl/Cmd）">
                        <option value="" disabled selected>部位（多选）</option>
                        <option value="叶片">叶片</option>
                        <option value="果实">果实</option>
                        <option value="枝干">枝干</option>
                        <option value="根系">根系</option>
                        <option value="花">花</option>
                    </select>
                    <select id="season-filter" multiple size="1" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 min-w-[120px]" onchange="filterInsects()" title="可多选（按住 Ctrl/Cmd）">
                        <option value="" disabled selected>物候期（多选）</option>
                        <option value="休眠期">休眠期</option>
                        <option value="萌芽期">萌芽期</option>
                        <option value="现蕾期">现蕾期</option>
                        <option value="开花期">开花期</option>
                        <option value="春梢期">春梢期</option>
                        <option value="幼果期">幼果期</option>
                        <option value="夏梢期">夏梢期</option>
                        <option value="生理落果期">生理落果期</option>
                        <option value="膨大期">膨大期</option>
                        <option value="秋梢期">秋梢期</option>
                        <option value="着色期">着色期</option>
                        <option value="成熟期">成熟期</option>
                        <option value="采后期">采后期</option>
                    </select>
                    <select id="harm-filter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterInsects()">
                        <option value="">危害等级</option>
                        <option value="重">重</option>
                        <option value="中">中</option>
                        <option value="轻">轻</option>
                    </select>
                    <select id="status-filter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterInsects()">
                        <option value="">状态</option>
                        <option value="启用">启用</option>
                        <option value="禁用">禁用</option>
                    </select>
                    <button onclick="resetFilter()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">重置</button>
                </div>
                <div id="search-summary" class="mt-3"></div>
            </div>

            <div id="insect-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4"></div>

            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                <p class="text-sm text-gray-500">共 <span id="total-count">15</span> 条记录</p>
                <div class="flex items-center space-x-2">
                    <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">上一页</button>
                    <span class="text-sm text-gray-600"><span id="current-page">1</span> / <span id="total-pages">4</span></span>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">下一页</button>
                    <select id="page-size" class="px-3 py-1 border border-gray-300 rounded text-sm" onchange="changePageSize()">
                        <option value="6">6条/页</option>
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 4-Tab 表单模态（add/edit/detail 共用） -->
    <div id="form-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:12px;width:92%;max-width:760px;max-height:88vh;display:flex;flex-direction:column">
        <div style="padding:14px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
          <h3 style="font-size:17px;font-weight:600;color:#1f2937" id="form-title">添加虫害</h3>
          <button type="button" onclick="closeFormModal()" style="padding:4px;background:none;border:none;cursor:pointer;font-size:22px;color:#6b7280;line-height:1">&times;</button>
        </div>
        <!-- 顶部合规说明 -->
        <div style="background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px 20px;font-size:12px;color:#b45309;display:flex;align-items:flex-start;gap:8px;flex-shrink:0">
          <svg style="width:16px;height:16px;flex-shrink:0;margin-top:1px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>本知识库用于业务查询与农事指导，<b>请勿填写具体药剂剂量</b>（如克、毫升、ppm 等数值），仅记录药剂名称、使用时期与注意事项，避免合规风险。</span>
        </div>
        <div style="padding:0 20px;border-bottom:1px solid #e5e7eb;flex-shrink:0">
          <div id="form-tabs" class="flex gap-1" style="margin-bottom:-1px"></div>
        </div>
        <div id="form-body" style="padding:20px;overflow-y:auto;flex:1"></div>
        <div style="padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px;flex-shrink:0">
          <button type="button" onclick="closeFormModal()" style="padding:8px 18px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">关闭</button>
          <button type="button" id="form-save-btn" onclick="saveForm()" style="padding:8px 18px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">保存</button>
        </div>
      </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:12px;width:90%;max-width:400px">
        <div style="padding:20px;text-align:center">
          <div style="width:64px;height:64px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
            <svg style="width:32px;height:32px;color:#ef4444" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>
          </div>
          <h3 style="font-size:18px;font-weight:600;color:#1f2937;margin-bottom:8px">确认删除</h3>
          <p style="font-size:14px;color:#6b7280;margin-bottom:24px">确定要删除虫害 <strong style="color:#1f2937" id="delete-name"></strong> 吗？此操作不可撤销。</p>
          <div style="display:flex;justify-content:center;gap:12px">
            <button type="button" onclick="closeDeleteModal()" style="padding:8px 18px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
            <button type="button" onclick="confirmDelete()" style="padding:8px 18px;background:#ef4444;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">确认删除</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 图片预览弹窗 -->
    <div id="image-preview-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:99999;align-items:center;justify-content:center">
        <div style="position:relative;width:90%;max-width:900px;max-height:90vh;display:flex;align-items:center;justify-content:center">
            <button onclick="DBCommon.hideModal('image-preview-modal')" style="position:absolute;top:-40px;right:0;padding:4px 8px;background:none;border:none;cursor:pointer;font-size:28px;color:#fff">&times;</button>
            <img id="preview-image" src="" alt="预览图片" style="max-width:100%;max-height:85vh;object-fit:contain;border-radius:8px" onerror="this.style.display='none'" />
        </div>
    </div>

    /* =========================================================
     * 渲染、筛选、分页
     * ========================================================= */
    let currentPage = 1;
    let pageSize = 6;
    let currentEditId = null;
    let currentDeleteId = null;
    let currentFormMode = 'add';
    let currentKeyword = '';
    let currentImages = [];        // 图片 Tab 暂存的图片数组
    let filteredInsects = insects.slice();

    function getMultiValues(id) {
        const el = document.getElementById(id);
        if (!el) return [];
        return Array.from(el.selectedOptions).map(function (o) { return o.value; }).filter(Boolean);
    }

    // 图片 Tab 操作：上传 / 删除 / 预览
    window.__handleFormImages = function (files) {
        if (!files || !files.length) return;
        const MAX = 8;
        Array.from(files).forEach(function (file) {
            if (!file.type.startsWith('image/')) return;
            if (currentImages.length >= MAX) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                currentImages.push(e.target.result);
                rerenderImagesPanel();
            };
            reader.readAsDataURL(file);
        });
    };
    window.__removeFormImage = function (idx) {
        if (typeof idx !== 'number' || idx < 0 || idx >= currentImages.length) return;
        currentImages.splice(idx, 1);
        rerenderImagesPanel();
    };
    window.__previewFormImage = function (url) {
        openImagePreview(url);
    };

    function rerenderImagesPanel() {
        const panel = document.querySelector('#form-body .form-tab-panel[data-panel="images"]');
        if (!panel) return;
        const isReadonly = currentFormMode === 'detail';
        panel.innerHTML = DBCommon.renderImagesSection(currentImages, isReadonly);
    }

    function renderInsects() {
        const container = document.getElementById('insect-list');
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pageData = filteredInsects.slice(start, end);
        if (pageData.length === 0) {
            container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400">没有匹配的虫害记录</div>';
        } else {
            container.innerHTML = pageData.map(function (d) {
                return DBCommon.renderItemCard(d, { kind: 'insect', keyword: currentKeyword });
            }).join('');
        }
        document.getElementById('total-count').textContent = filteredInsects.length;
        document.getElementById('current-page').textContent = currentPage;
        document.getElementById('total-pages').textContent = Math.max(1, Math.ceil(filteredInsects.length / pageSize));
        document.getElementById('search-summary').innerHTML = DBCommon.renderSearchSummary(currentKeyword, filteredInsects.length, insects.length);
    }

    function openImagePreview(url) {
        document.getElementById('preview-image').src = url;
        DBCommon.showModal('image-preview-modal');
    }

    /* =========================================================
     * 4-Tab 表单模态（add/edit/detail 共用）
     * ========================================================= */
    function openFormModal(id, mode) {
        currentFormMode = mode;
        currentEditId = id;
        const data = (mode === 'add') ? {
            status: '启用', harmLevel: '中',
            hostVarieties: [], parts: [], peakSeason: [], images: []
        } : (insects.find(d => d.id === id) || {});
        currentImages = Array.isArray(data.images) ? data.images.slice() : [];

        const titles = { add: '添加虫害', edit: '编辑虫害 · ' + data.id, detail: '查看虫害 · ' + data.id };
        document.getElementById('form-title').textContent = titles[mode];

        // 渲染 Tab 头（填入预留容器 #form-tabs）
        document.getElementById('form-tabs').innerHTML = DBCommon.renderFormTabs();

        // 渲染面板（填入预留容器 #form-body）
        document.getElementById('form-body').innerHTML = DBCommon.renderFormPanels(DBCommon.INSECT_SCHEMA, data, mode);

        DBCommon.bindFormTabs(document.getElementById('form-modal'));

        const saveBtn = document.getElementById('form-save-btn');
        saveBtn.style.display = (mode === 'detail') ? 'none' : 'inline-block';

        DBCommon.showModal('form-modal');
    }

    function closeFormModal() {
        DBCommon.hideModal('form-modal');
        currentEditId = null;
        currentImages = [];
    }

    function saveForm() {
        DBCommon.collectChipData();
        const data = DBCommon.collectFormData();

        ['hostVarieties', 'parts', 'peakSeason'].forEach(function (k) {
            if (typeof data[k] === 'string') {
                data[k] = data[k].split(',').filter(Boolean);
            }
        });
        data.images = currentImages.slice();

        const result = DBCommon.validate(DBCommon.INSECT_SCHEMA, data);
        if (!result.ok) {
            alert('必填字段缺失：' + result.missing.join('、'));
            return;
        }

        const existsIdx = insects.findIndex(d => d.id === data.id);
        if (currentFormMode === 'add') {
            if (existsIdx >= 0) { alert('虫害ID 已存在：' + data.id); return; }
            data.createdAt = new Date().toISOString().slice(0, 10);
            data.updatedAt = data.createdAt;
            insects.push(data);
            alert('虫害添加成功！\nID：' + data.id + '\n名称：' + data.name);
        } else {
            if (existsIdx < 0) { alert('未找到该虫害'); return; }
            data.createdAt = insects[existsIdx].createdAt;
            data.updatedAt = new Date().toISOString().slice(0, 10);
            insects[existsIdx] = data;
            alert('虫害更新成功！\nID：' + data.id);
        }
        filteredInsects = insects.slice();
        renderInsects();
        closeFormModal();
    }

    /* =========================================================
     * 删除
     * ========================================================= */
    function openDeleteModal(id) {
        currentDeleteId = id;
        const d = insects.find(x => x.id === id);
        document.getElementById('delete-name').textContent = d ? d.name : '';
        DBCommon.showModal('delete-modal');
    }
    function closeDeleteModal() { DBCommon.hideModal('delete-modal'); currentDeleteId = null; }
    function confirmDelete() {
        const idx = insects.findIndex(d => d.id === currentDeleteId);
        if (idx >= 0) insects.splice(idx, 1);
        filteredInsects = insects.slice();
        if (currentPage > Math.ceil(filteredInsects.length / pageSize)) currentPage = Math.max(1, Math.ceil(filteredInsects.length / pageSize) || 1);
        renderInsects();
        closeDeleteModal();
        alert('虫害删除成功');
    }

    /* =========================================================
     * 筛选 / 分页
     * ========================================================= */
    function filterInsects() {
        currentKeyword = document.getElementById('search-input').value.trim();
        const filters = {
            type: document.getElementById('type-filter').value,
            parts: getMultiValues('parts-filter'),
            peakSeason: getMultiValues('season-filter'),
            harmLevel: document.getElementById('harm-filter').value,
            status: document.getElementById('status-filter').value
        };
        filteredInsects = DBCommon.searchItems(insects, currentKeyword, filters);
        currentPage = 1;
        renderInsects();
    }

    function resetFilter() {
        document.getElementById('search-input').value = '';
        document.getElementById('type-filter').value = '';
        ['parts-filter', 'season-filter'].forEach(function (id) {
            const el = document.getElementById(id);
            if (el) Array.from(el.options).forEach(function (o) { o.selected = false; });
        });
        document.getElementById('harm-filter').value = '';
        document.getElementById('status-filter').value = '';
        currentKeyword = '';
        filteredInsects = insects.slice();
        currentPage = 1;
        renderInsects();
    }

    function prevPage() {
        if (currentPage > 1) { currentPage--; renderInsects(); }
    }
    function nextPage() {
        const totalPages = Math.ceil(filteredInsects.length / pageSize);
        if (currentPage < totalPages) { currentPage++; renderInsects(); }
    }
    function changePageSize() {
        pageSize = parseInt(document.getElementById('page-size').value);
        currentPage = 1;
        renderInsects();
    }

    renderInsects();
    </script>
