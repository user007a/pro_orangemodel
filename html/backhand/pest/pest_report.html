<style>

    to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-overlay.active .modal-content { animation: modalSlideIn 0.3s ease; }
body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
.content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
.modal-overlay { display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center }
.modal-content { background:#fff;border-radius:12px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto }
.tab-active{color:#16a34a;border-bottom:2px solid #16a34a;font-weight:600}
.tab-inactive{color:#6b7280;border-bottom:2px solid transparent}
.tab-inactive:hover{color:#374151}
.text-green{color:#16a34a} .text-blue{color:#2563eb} .text-red{color:#dc2626} .text-yellow{color:#d97706} .text-orange{color:#ea580c} .text-purple{color:#7c3aed}

<div class="content-wrapper">

      </button>

        <span>去风险诊断</span>
      </button>
      <button onclick="gotoScheme()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

      </button>

<!-- 6. Report Detail Modal -->

</div>

/* ============ 工具函数 ============ */
function lvl(p){return p>=.8?'极高':p>=.6?'高':p>=.4?'中':'低';}
function th(l){return '<th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 whitespace-nowrap">'+l+'</th>';}
function td(c,v){return '<td class="px-4 py-3 '+c+'">'+v+'</td>';}
function badge(t,c){return '<span class="px-2 py-0.5 rounded-full text-xs font-medium '+c+'">'+t+'</span>';}
function infoItem(k,v){return '<div class="bg-gray-50 rounded-lg p-2.5"><p class="text-xs text-gray-400 mb-1">'+k+'</p><p class="text-sm font-medium text-gray-800">'+v+'</p></div>';}
function keyAdv(l){return l==='极高'?'立即统防统治，加密监测频次':'加强巡查监测，尽快安排防治作业';}
function advOf(p,l){return l==='极高'?'立即'+META[p].m+'，加密监测':l==='高'?'尽快'+META[p].m+'，防止扩散':l==='中'?'关注天气，'+META[p].m+'预防':'常规监测，维持果园管理';}
function probCell(p){var l=lvl(p);return '<div class="flex items-center gap-2"><span class="text-sm font-bold text-gray-800 w-10">'+p.toFixed(2)+'</span><div class="flex-1 bg-gray-100 rounded-full h-2"><div class="h-2 rounded-full" style="width:'+Math.round(p*100)+'%;background:'+BAR[l]+'"></div></div></div>';}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2000);}
function showModal(){var m=document.getElementById('report-modal');m.style.display='flex';m.classList.add('active');}
function hideModal(){var m=document.getElementById('report-modal');m.style.display='none';m.classList.remove('active');}

  +'<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-gray-50">'+th('优先级')+th('病虫害')+th('防控区域')+th('防控措施')+th('复查周期')+'</tr></thead><tbody id="stb-'+s+'"></tbody></table></div></div>';
}

/* ============ 渲染：病虫害子页签 ============ */
function renderPestTabs(s){
  var h='';
  PESTS.forEach(function(p){
    h+='<button onclick="setPest(\''+p+'\')" class="px-4 py-1.5 rounded-full text-sm whitespace-nowrap font-medium '+(p===curPest?'bg-green-600 text-white shadow':'bg-gray-100 text-gray-600 hover:bg-gray-200')+'">'+p+'</button>';
  });
  document.getElementById('pstabs-'+s).innerHTML=h;
}

/* ============ 渲染：预测内容（3天/7天共用） ============ */
function renderForecast(s){
  var arr=s==='3'?P3:P7,p=curPest,meta=META[p];
  var rows=TOWNS.map(function(t,i){return {t:t,p:arr[p][i],i:i};}).sort(function(a,b){return b.p-a.p;});
  var h='';
  rows.forEach(function(r){
    var l=lvl(r.p);
    h+='<tr class="border-b border-gray-100 hover:bg-gray-50">'+td('font-medium text-gray-800',r.t)+td('',probCell(r.p))+td('',badge(l,RL[l]))+td('text-gray-600',meta.f[r.i%meta.f.length])+td('text-gray-500 text-xs',advOf(p,l))+'</tr>';
  });
  document.getElementById('ptb-'+s).innerHTML=h;
  renderDough(s,rows);
  var sh='';
  SUG[p].forEach(function(x){
    sh+='<tr class="border-b border-gray-100">'+td('',badge(x[0],PB[x[0]]))+td('font-medium text-gray-800',p)+td('text-gray-700',x[1])+td('text-gray-700',x[2])+td('text-gray-500 text-xs',x[3])+'</tr>';
  });
  document.getElementById('stb-'+s).innerHTML=sh;
}
function renderDough(s,rows){
  var cnt={'低':0,'中':0,'高':0,'极高':0};
  rows.forEach(function(r){cnt[lvl(r.p)]++;});
  if(doughs[s])doughs[s].destroy();
  doughs[s]=new Chart(document.getElementById('dg-'+s),{
    type:'doughnut',
    data:{labels:['低','中','高','极高'],datasets:[{data:['低','中','高','极高'].map(function(k){return cnt[k];}),backgroundColor:['#22c55e','#f59e0b','#f97316','#dc2626'],borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:function(c){return ' '+c.label+'风险：'+c.parsed+' 个乡镇';}}}}}
  });
}

/* ============ 渲染：历史报告 ============ */
function renderHist(){
  var h='';
  HIST.forEach(function(x,i){
    h+='<tr class="border-b border-gray-100 hover:bg-gray-50">'+td('font-medium text-gray-800',x.r)+td('text-gray-600',x.d)+td('text-gray-600',x.p)+td('text-gray-700',x.ex)+td('text-gray-700',x.hi)+td('',badge(x.st,x.st==='已查看'?'bg-green-100 text-green-600':'bg-yellow-100 text-yellow-600'))+td('','<button class="text-green hover:underline" onclick="openReport('+i+')">查看</button>')+'</tr>';
  });
  document.getElementById('htb').innerHTML=h;
}

/* ============ 交互 ============ */
function switchTab(tab){
  document.querySelectorAll('.tab-item').forEach(function(el){
    el.className='tab-item px-4 py-4 cursor-pointer text-sm mr-6 whitespace-nowrap '+(el.getAttribute('data-tab')===tab?'tab-active':'tab-inactive');
  });
  document.getElementById('fc-3').style.display=tab==='3'?'':'none';
  document.getElementById('fc-7').style.display=tab==='7'?'':'none';
  document.getElementById('tab-history').style.display=tab==='history'?'':'none';
  if(tab==='3'||tab==='7')curPer=tab;
  setTimeout(function(){if(doughs[tab])doughs[tab].resize();},60);
}
function setPest(p){curPest=p;renderPestTabs('3');renderPestTabs('7');renderForecast('3');renderForecast('7');}
function openReport(i){
  var x=HIST[i];
  var rows=TOWNS.map(function(t,j){return {t:t,p:x.pr[j]};}).sort(function(a,b){return b.p-a.p;});
  var probsH=rows.map(function(r){return '<div class="flex items-center justify-between py-1.5 border-b border-gray-50 text-sm"><span class="text-gray-700">'+r.t+'</span><span class="text-gray-400 text-xs">'+(r.p*100).toFixed(0)+'%</span>'+badge(lvl(r.p),RL[lvl(r.p)])+'</div>';}).join('');
  var keys=rows.filter(function(r){return r.p>.7;});
  var keysH=keys.length?keys.map(function(r){return '<div class="flex items-center justify-between py-1.5 border-b border-gray-50 text-sm"><span class="font-medium text-gray-800">'+r.t+'</span>'+badge(lvl(r.p),RL[lvl(r.p)])+'<span class="text-gray-400 text-xs">'+keyAdv(lvl(r.p))+'</span></div>';}).join(''):'<p class="text-sm text-gray-400 py-2">无重点风险乡镇</p>';
  var sugH=['一级·紧急','一级·紧急','二级·重要','二级·重要','三级·常规'].map(function(pr,j){return '<div class="flex items-center justify-between py-1.5 border-b border-gray-50 text-sm">'+badge(pr,PB[pr])+'<span class="text-gray-700 flex-1 ml-3">'+GADV[j]+'</span></div>';}).join('');
  document.getElementById('rm-body').innerHTML=
    '<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">'
    +infoItem('报告编号',x.r)+infoItem('生成日期',x.d)+infoItem('预测周期',x.p)
    +infoItem('极高风险乡镇',x.ex+' 个')+infoItem('高风险乡镇',x.hi+' 个')+infoItem('报告状态',badge(x.st,x.st==='已查看'?'bg-green-100 text-green-600':'bg-yellow-100 text-yellow-600'))
    +'</div>'
    +'<p class="text-xs font-semibold text-gray-500 mb-2">各乡镇发生概率列表</p>'+probsH
    +'<p class="text-xs font-semibold text-gray-500 mb-2 mt-4">重点风险乡镇</p>'+keysH
    +'<p class="text-xs font-semibold text-gray-500 mb-2 mt-4">防控建议清单</p>'+sugH;
  showModal();
}

/* ============ 导出报告 ============ */
function exportReport(){
  var p=curPest,per=curPer==='7'?'7天':'3天',arr=P3[p];
  if(curPer==='7')arr=P7[p];
  var rows=TOWNS.map(function(t,i){return {t:t,p:arr[i]};}).sort(function(a,b){return b.p-a.p;});
  var txt='南丰蜜桔病虫害预测报告\n========================================\n';
  txt+='报告日期：2026-08-04\n';
  txt+='预测周期：'+per+'\n';
  txt+='病虫害类型：'+p+'\n';
  txt+='县域综合风险指数：0.72（高）\n';
  txt+='极高风险乡镇：2 个 | 高风险乡镇：4 个 | 今日预警：18 条\n\n';
  txt+='【各乡镇发生概率】\n';
  rows.forEach(function(r,i){txt+=(i+1)+'. '+r.t+'：'+(r.p*100).toFixed(0)+'%（'+lvl(r.p)+'）\n';});
  txt+='\n【重点风险乡镇】\n';
  rows.filter(function(r){return r.p>.7;}).forEach(function(r){txt+='- '+r.t+'：'+(r.p*100).toFixed(0)+'%（'+lvl(r.p)+'）\n';});
  txt+='\n【防控建议清单】\n';
  SUG[p].forEach(function(s,i){txt+=(i+1)+'. ['+s[0]+'] 区域：'+s[1]+' 措施：'+s[2]+' 复查周期：'+s[3]+'\n';});
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='预测报告_'+p+'_2026-08-04.txt';
  link.click();
  showToast('预测报告已导出');
}
document.addEventListener('click',function(e){var m=document.getElementById('report-modal');if(m.style.display==='flex'&&e.target===m)hideModal();});
window.onload=function(){
  document.getElementById('fc-3').innerHTML=fcHTML('3');
  document.getElementById('fc-7').innerHTML=fcHTML('7');
  renderPestTabs('3');renderPestTabs('7');
  renderForecast('3');renderForecast('7');
  renderHist();
  showPhenologyContext();
};

function showPhenologyContext(){
  try {
    var records = JSON.parse(localStorage.getItem('pestData.records') || '[]');
    var stages = {};
    records.filter(function(r){ return r.tab === 'pt' && r.stage; }).forEach(function(r){
      stages[r.town] = r.stage;
    });
    var obj = JSON.parse(localStorage.getItem('currentObject') || 'null');
    var headerBanner = document.getElementById('phenology-summary');
    if(!headerBanner) return;
    var keys = Object.keys(stages);
    if(keys.length > 0){
      var summary = keys.slice(0,4).map(function(k){ return k + '：' + stages[k]; }).join(' · ');
      var more = keys.length > 4 ? ' 等 ' + keys.length + ' 个乡镇' : '';
      headerBanner.innerHTML = '<div class="bg-emerald-50 border-l-4 border-emerald-400 text-emerald-800 px-4 py-2 mb-4 rounded text-sm">' +
        '<span class="font-semibold">🌱 当前物候（Pt）：</span>' + summary + more +
        '</div>';
      headerBanner.style.display = 'block';
    } else {
      headerBanner.style.display = 'none';
    }
  } catch(e){}
}

/* ============ 一键发布预警 ============ */
function publishAsAlerts(){
  if(!confirm('确认将本报告中的所有高/极高风险条目发布为预警？\n将自动写入预警管理、推送至移动端待办。')) return;
  var arr = curPer==='7' ? P7[curPest] : P3[curPest];
  var rows = TOWNS.map(function(t,i){return {t:t,p:arr[i]};}).sort(function(a,b){return b.p-a.p;});
  var alerts = [];
  var now = new Date();
  var ymd = now.getFullYear()+''+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
  var seq = 1;
  rows.forEach(function(r){
    if(r.p >= 0.6){
      var lv = r.p >= 0.8 ? '红色预警' : '橙色预警';
      var level = r.p >= 0.8 ? '极高' : '高';
      alerts.push({
        id: 'ALT' + ymd + String(seq).padStart(3,'0'),
        title: curPest + '·' + r.t + '·' + level + '风险',
        level: lv,
        source: '模型自动生成',
        pest: curPest,
        town: r.t,
        prob: r.p,
        area: r.t + '全乡镇',
        content: '基于' + curPer + '天' + curPest + '预测模型，' + r.t + '发生概率为 ' + (r.p*100).toFixed(0) + '%，风险等级' + level + '。建议：' + advOf(curPest, level) + '。',
        status: '已发布',
        createdAt: now.toISOString().substring(0,19).replace('T',' '),
        publishedAt: now.toISOString().substring(0,19).replace('T',' '),
        period: curPer + '天',
        suggestions: (SUG[curPest][0] || []).slice(0,3).join(' / ')
      });
      seq++;
    }
  });
  if(alerts.length === 0){ alert('本报告无高/极高风险条目，无需发布。'); return; }
  try {
    var existing = JSON.parse(localStorage.getItem('alerts') || '[]');
    var newOnes = alerts.filter(function(a){
      return !existing.some(function(e){ return e.id === a.id; });
    });
    var merged = existing.concat(newOnes);
    localStorage.setItem('alerts', JSON.stringify(merged));
    localStorage.setItem('alerts.lastPublishedAt', now.toISOString());
    localStorage.setItem('alerts.lastReportPest', curPest);
    localStorage.setItem('alerts.lastReportPeriod', curPer);
    showToast('已发布 ' + newOnes.length + ' 条预警（去重跳过 ' + (alerts.length - newOnes.length) + ' 条）');
  } catch(e){
    alert('发布失败：' + e.message);
  }
}

window.addAlertFromPestReport = publishAsAlerts;

function gotoDiagnosis(){
  try {
    var rows = TOWNS.map(function(t,i){
      var arr = curPer==='7' ? P7[curPest] : P3[curPest];
      return { t: t, p: arr[i] };
    }).sort(function(a,b){ return b.p - a.p; });
    var payload = {
      pest: curPest,
      period: curPer,
      generatedAt: new Date().toISOString(),
      towns: rows.slice(0, 12),
      highRisk: rows.filter(function(r){ return r.p >= 0.6; }).slice(0, 5)
    };
    localStorage.setItem('pestReport.summary', JSON.stringify(payload));
    localStorage.setItem('currentObject', JSON.stringify({ pest: curPest, period: curPer, type: 'pestReport' }));
  } catch(e){}
  window.location.href = 'pest_diagnosis.html?pest=' + encodeURIComponent(curPest) + '&period=' + curPer;
}

function gotoScheme(){
  try {
    var payload = {
      pest: curPest,
      period: curPer,
      suggestions: SUG[curPest] || [],
      generatedAt: new Date().toISOString()
    };
    localStorage.setItem('pestReport.forScheme', JSON.stringify(payload));
  } catch(e){}
  window.location.href = 'pest_scheme.html?pest=' + encodeURIComponent(curPest) + '&period=' + curPer;
}
