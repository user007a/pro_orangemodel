<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品种数据库 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: {
        green: { DEFAULT: '#16a34a' },
        blue: { DEFAULT: '#2563eb' },
        red: { DEFAULT: '#dc2626' },
        yellow: { DEFAULT: '#ca8a04' },
        purple: { DEFAULT: '#9333ea' }
      }}}}
    </script>
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
        .region-checkbox { display: inline-flex; align-items: center; margin-right: 12px; margin-bottom: 8px; cursor: pointer; }
        .region-checkbox input { margin-right: 4px; }
        .region-checkbox span { font-size: 13px; color: #374151; }
        .selected-regions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .selected-region-tag { background: #16a34a; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-gray-800">品种数据库</h1>
                <p class="text-gray-500 text-sm mt-1">管理南丰蜜桔品种信息数据</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAddModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    添加品种
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center space-x-4 flex-wrap">
                    <div class="flex-1 max-w-md">
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="search-input" placeholder="搜索品种名称..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" oninput="filterVarieties()">
                        </div>
                    </div>
                    <select id="region-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterVarieties()">
                        <option value="">全部区域</option>
                        <option value="市山镇">市山镇</option>
                        <option value="琴城镇">琴城镇</option>
                        <option value="桑田镇">桑田镇</option>
                        <option value="白舍镇">白舍镇</option>
                        <option value="太和镇">太和镇</option>
                        <option value="东坪乡">东坪乡</option>
                    </select>
                    <button onclick="resetFilter()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">重置</button>
                </div>
            </div>

            <div id="variety-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
            </div>

            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                <p class="text-sm text-gray-500">共 <span id="total-count">7</span> 条记录</p>
                <div class="flex items-center space-x-2">
                    <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">上一页</button>
                    <span class="text-sm text-gray-600"><span id="current-page">1</span> / <span id="total-pages">1</span></span>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">下一页</button>
                    <select id="page-size" class="px-3 py-1 border border-gray-300 rounded text-sm" onchange="changePageSize()">
                        <option value="6">6条/页</option>
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加品种弹窗 -->
    <div id="add-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
        <div style="background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto">
            <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
                <h3 style="font-size:18px;font-weight:600;color:#1f2937">添加品种</h3>
                <button onclick="closeModal('add-modal')" style="padding:4px;background:none;border:none;cursor:pointer;font-size:20px">&times;</button>
            </div>
            <div style="padding:24px">
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种名称 <span style="color:#ef4444">*</span></label>
                    <input type="text" id="add-name" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box" placeholder="请输入品种名称">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">种植区域</label>
                    <div id="add-region-checkboxes">
                        <div class="region-checkbox"><input type="checkbox" value="市山镇"><span>市山镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="琴城镇"><span>琴城镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="桑田镇"><span>桑田镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="白舍镇"><span>白舍镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="太和镇"><span>太和镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="洽湾镇"><span>洽湾镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="东坪乡"><span>东坪乡</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="紫霄镇"><span>紫霄镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="莱溪乡"><span>莱溪乡</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="三溪乡"><span>三溪乡</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="太源乡"><span>太源乡</span></div>
                    </div>
                    <div id="add-selected-regions" class="selected-regions"></div>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">种植面积（万亩）</label>
                    <input type="number" id="add-area" step="0.1" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box" placeholder="请输入种植面积">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">占比（%）</label>
                    <input type="number" id="add-proportion" step="0.1" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box" placeholder="请输入占比">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">种植主体数量（家）</label>
                    <input type="number" id="add-subjects" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box" placeholder="请输入种植主体数量">
                    <input type="text" id="add-subjects-desc" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;margin-top:8px" placeholder="例如：分散散户为主，规模合作社160余家">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种介绍</label>
                    <textarea id="add-intro" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;resize:vertical" rows="3" placeholder="请输入品种介绍"></textarea>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种优势</label>
                    <textarea id="add-advantage" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;resize:vertical" rows="3" placeholder="请输入品种优势"></textarea>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">备注</label>
                    <textarea id="add-remark" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;resize:vertical" rows="2" placeholder="请输入备注"></textarea>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种图片上传</label>
                    <input type="file" id="add-images" accept="image/*" multiple style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box" onchange="previewAddImages(this)">
                    <div id="add-image-preview" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px"></div>
                </div>
            </div>
            <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px">
                <button onclick="closeModal('add-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
                <button onclick="saveVariety()" style="padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">保存</button>
            </div>
        </div>
    </div>

    <!-- 查看详情弹窗 -->
    <div id="detail-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
        <div style="background:#fff;border-radius:12px;width:90%;max-width:550px;max-height:85vh;overflow-y:auto">
            <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
                <h3 style="font-size:18px;font-weight:600;color:#1f2937">品种详情</h3>
                <button onclick="closeModal('detail-modal')" style="padding:4px;background:none;border:none;cursor:pointer;font-size:20px">&times;</button>
            </div>
            <div style="padding:24px">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
                    <div>
                        <span style="font-size:13px;color:#6b7280">品种名称</span>
                        <p style="font-size:14px;font-weight:500;color:#1f2937;margin-top:2px" id="detail-name"></p>
                    </div>
                    <div>
                        <span style="font-size:13px;color:#6b7280">种植区域</span>
                        <p style="font-size:14px;font-weight:500;color:#1f2937;margin-top:2px" id="detail-region"></p>
                    </div>
                    <div>
                        <span style="font-size:13px;color:#6b7280">种植面积</span>
                        <p style="font-size:14px;font-weight:500;color:#1f2937;margin-top:2px" id="detail-area"></p>
                    </div>
                    <div>
                        <span style="font-size:13px;color:#6b7280">占比</span>
                        <p style="font-size:14px;font-weight:500;color:#1f2937;margin-top:2px" id="detail-proportion"></p>
                    </div>
                    <div>
                        <span style="font-size:13px;color:#6b7280">种植主体数量</span>
                        <p style="font-size:14px;font-weight:500;color:#1f2937;margin-top:2px" id="detail-subjects"></p>
                    </div>
                </div>
                <div style="margin-bottom:16px">
                    <span style="font-size:13px;color:#6b7280">主体描述</span>
                    <p style="font-size:14px;color:#1f2937;margin-top:2px;white-space:pre-wrap" id="detail-subjects-desc"></p>
                </div>
                <div style="margin-bottom:16px">
                    <span style="font-size:13px;color:#6b7280">品种介绍</span>
                    <p style="font-size:14px;color:#1f2937;margin-top:2px;white-space:pre-wrap" id="detail-intro"></p>
                </div>
                <div style="margin-bottom:16px">
                    <span style="font-size:13px;color:#6b7280">品种优势</span>
                    <p style="font-size:14px;color:#1f2937;margin-top:2px;white-space:pre-wrap" id="detail-advantage"></p>
                </div>
                <div style="margin-bottom:16px">
                    <span style="font-size:13px;color:#6b7280">备注</span>
                    <p style="font-size:14px;color:#1f2937;margin-top:2px;white-space:pre-wrap" id="detail-remark"></p>
                </div>
                <div>
                    <span style="font-size:13px;color:#6b7280;display:block;margin-bottom:8px">品种图片</span>
                    <div id="detail-images" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
                </div>
            </div>
            <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px">
                <button onclick="closeModal('detail-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑品种弹窗 -->
    <div id="edit-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
        <div style="background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto">
            <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
                <h3 style="font-size:18px;font-weight:600;color:#1f2937">编辑品种</h3>
                <button onclick="closeModal('edit-modal')" style="padding:4px;background:none;border:none;cursor:pointer;font-size:20px">&times;</button>
            </div>
            <div style="padding:24px">
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种名称 <span style="color:#ef4444">*</span></label>
                    <input type="text" id="edit-name" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">种植区域</label>
                    <div id="edit-region-checkboxes">
                        <div class="region-checkbox"><input type="checkbox" value="市山镇"><span>市山镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="琴城镇"><span>琴城镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="桑田镇"><span>桑田镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="白舍镇"><span>白舍镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="太和镇"><span>太和镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="洽湾镇"><span>洽湾镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="东坪乡"><span>东坪乡</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="紫霄镇"><span>紫霄镇</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="莱溪乡"><span>莱溪乡</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="三溪乡"><span>三溪乡</span></div>
                        <div class="region-checkbox"><input type="checkbox" value="太源乡"><span>太源乡</span></div>
                    </div>
                    <div id="edit-selected-regions" class="selected-regions"></div>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">种植面积（万亩）</label>
                    <input type="number" id="edit-area" step="0.1" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">占比（%）</label>
                    <input type="number" id="edit-proportion" step="0.1" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">种植主体数量（家）</label>
                    <input type="number" id="edit-subjects" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box">
                    <input type="text" id="edit-subjects-desc" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;margin-top:8px" placeholder="例如：分散散户为主，规模合作社160余家">
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种介绍</label>
                    <textarea id="edit-intro" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;resize:vertical" rows="3"></textarea>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">品种优势</label>
                    <textarea id="edit-advantage" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;resize:vertical" rows="3"></textarea>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">备注</label>
                    <textarea id="edit-remark" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;resize:vertical" rows="2"></textarea>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">当前图片</label>
                    <div id="edit-existing-images" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
                </div>
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:4px">替换图片（最多4张）</label>
                    <input type="file" id="edit-images" accept="image/*" multiple style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box" onchange="previewEditImages(this)">
                    <div id="edit-image-preview" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px"></div>
                </div>
            </div>
            <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px">
                <button onclick="closeModal('edit-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
                <button onclick="updateVariety()" style="padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
        <div style="background:#fff;border-radius:12px;width:90%;max-width:400px;max-height:85vh;overflow-y:auto">
            <div style="padding:24px;text-align:center">
                <div style="width:64px;height:64px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                    <svg style="width:32px;height:32px;color:#ef4444" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>
                </div>

        let currentPage = 1;

        function getVarietyById(id) {
            return varieties.find(function(v) { return v.id === id; });

        function getRegionColor(region) {
            if (region.includes('市山镇') || region.includes('琴城镇')) return 'bg-blue-100 text-blue-700';
            if (region.includes('白舍镇') || region.includes('桑田镇')) return 'bg-green-100 text-green-700';
            if (region.includes('东坪乡') || region.includes('太和镇')) return 'bg-orange-100 text-orange-700';
            return 'bg-purple-100 text-purple-700';
        }

        function updateSelectedRegions(modalId) {
            var checkboxes = document.querySelectorAll('#' + modalId + '-region-checkboxes input');
            var container = document.getElementById(modalId + '-selected-regions');
            var selected = [];
            checkboxes.forEach(function(cb) {
                if (cb.checked) selected.push(cb.value);
            });
            container.innerHTML = selected.map(function(r) {
                return '<span class="selected-region-tag">' + r + '</span>';
            }).join('');
        }

        ['add', 'edit'].forEach(function(modalId) {
            document.querySelectorAll('#' + modalId + '-region-checkboxes input').forEach(function(cb) {
                cb.addEventListener('change', function() {
                    updateSelectedRegions(modalId);
                });
            });
        });

        function updatePagination() {
            var totalPages = Math.ceil(filteredVarieties.length / pageSize);

            document.getElementById('total-pages').textContent = totalPages || 1;

        function openImagePreview(url) {
            document.getElementById('preview-image').src = url;
            showModal('image-preview-modal');
        }

        function previewAddImages(input) {
            var container = document.getElementById('add-image-preview');
            container.innerHTML = '';
            if (input.files && input.files.length > 0) {
                var maxFiles = Math.min(input.files.length, 4);
                for (var i = 0; i < maxFiles; i++) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.cssText = 'width:100%;height:64px;object-fit:cover;border-radius:6px';
                        container.appendChild(img);
                    };
                    reader.readAsDataURL(input.files[i]);
                }
            }
        }

        function previewEditImages(input) {
            var container = document.getElementById('edit-image-preview');
            container.innerHTML = '';
            if (input.files && input.files.length > 0) {
                var maxFiles = Math.min(input.files.length, 4);
                for (var i = 0; i < maxFiles; i++) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.cssText = 'width:100%;height:64px;object-fit:cover;border-radius:6px';
                        container.appendChild(img);

                    reader.readAsDataURL(input.files[i]);

            document.getElementById('add-remark').value = '';

            updateSelectedRegions('add');
            showModal('add-modal');

        function openEditModal(id) {
            currentId = id;
            var variety = getVarietyById(id);
            if (variety) {
                document.getElementById('edit-name').value = variety.name;
                document.getElementById('edit-area').value = variety.area;
                document.getElementById('edit-proportion').value = variety.proportion;
                document.getElementById('edit-subjects').value = variety.subjects;
                document.getElementById('edit-subjects-desc').value = variety.subjectsDesc;
                document.getElementById('edit-intro').value = variety.intro;
                document.getElementById('edit-advantage').value = variety.advantage;
                document.getElementById('edit-remark').value = variety.remark;
                document.querySelectorAll('#edit-region-checkboxes input').forEach(function(cb) {
                    cb.checked = variety.regions.includes(cb.value);
                });
                updateSelectedRegions('edit');
                var existingContainer = document.getElementById('edit-existing-images');
                existingContainer.innerHTML = variety.images.map(function(img, idx) {
                    return '<img src="' + img + '" alt="品种图片' + (idx + 1) + '" style="width:100%;height:64px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openImagePreview(\'' + img + '\')" onerror="this.style.display=\'none\'" />';

            }
            document.getElementById('edit-images').value = '';
            document.getElementById('edit-image-preview').innerHTML = '';
            showModal('edit-modal');
        }

                document.getElementById('detail-advantage').textContent = variety.advantage;
                document.getElementById('detail-remark').textContent = variety.remark;
                document.getElementById('detail-images').innerHTML = variety.images.map(function(img, idx) {
                    return '<img src="' + img + '" alt="品种图片' + (idx + 1) + '" style="width:100%;height:80px;object-fit:cover;border-radius:6px;cursor:pointer" onclick="openImagePreview(\'' + img + '\')" onerror="this.style.display=\'none\'" />';
                }).join('');
            }
            showModal('detail-modal');
        }

        function openDeleteModal(id) {
            currentId = id;
            var variety = getVarietyById(id);
            document.getElementById('delete-name').textContent = variety ? variety.name : '';
            showModal('delete-modal');
        }

        function saveVariety() {
            var name = document.getElementById('add-name').value;
            if (!name) {
                alert('请填写品种名称');
                return;
            }
            alert('品种数据添加成功！\n名称: ' + name);
            closeModal('add-modal');
        }

        function updateVariety() {
            alert('品种数据更新成功！');
            closeModal('edit-modal');
        }

        function confirmDelete() {
            alert('品种数据删除成功！');
            closeModal('delete-modal');
        }

        function filterVarieties() {
            var searchTerm = document.getElementById('search-input').value.toLowerCase();
            var regionFilter = document.getElementById('region-filter').value;

            filteredVarieties = varieties.filter(function(v) {
                var matchesSearch = v.name.toLowerCase().includes(searchTerm) || v.intro.toLowerCase().includes(searchTerm);
                var matchesRegion = !regionFilter || v.regions.includes(regionFilter);
                return matchesSearch && matchesRegion;
            });

            currentPage = 1;
            renderVarieties();
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('region-filter').value = '';
            filteredVarieties = [...varieties];
            currentPage = 1;
            renderVarieties();
        }

        function prevPage() {
            var totalPages = Math.ceil(filteredVarieties.length / pageSize);
            if (currentPage > 1) {
                currentPage--;
                renderVarieties();
            }
        }

        function nextPage() {
            var totalPages = Math.ceil(filteredVarieties.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderVarieties();
            }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderVarieties();
        }

        document.addEventListener('click', function(e) {
            ['add-modal', 'detail-modal', 'edit-modal', 'delete-modal', 'image-preview-modal'].forEach(function(modalId) {
                var m = document.getElementById(modalId);
                if (m && e.target === m) {
                    hideModal(modalId);
                }
            });
        });

        renderVarieties();
    </script>
</body>
</html>
