<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 我的报告</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
      overflow: hidden;
    }
    .page-header::before {
      content: '';
      position: absolute;
      top: -40px; right: -30px;
      width: 140px; height: 140px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1;
    }
    .header-back svg { width: 18px; height: 18px; }
    .header-content { padding-left: 44px; position: relative; z-index: 1; }
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }

    /* 报告卡片 */
    .report-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin: 0 16px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
    }
    .report-card:active { transform: scale(0.98); }
    .report-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--primary);
    }
    .report-card-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .report-info { flex: 1; }
    .report-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }
    .report-plot {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .report-score-box {
      text-align: center;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .report-score {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }
    .report-score.good { color: var(--success); }
    .report-score.normal { color: var(--warning); }
    .report-score.bad { color: var(--error); }
    .report-score-label {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .report-card-body {
      padding: 0 20px 14px;
    }
    .report-summary {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      padding: 10px 12px;
      background: var(--gray-50);
      border-radius: var(--radius-md);
    }
    .report-card-footer {
      padding: 0 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
    }
    .report-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .report-meta-item svg { width: 12px; height: 12px; }

    /* 评分等级标签 */
    .report-rating-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 600;
      display: inline-block;
      margin-top: 4px;
    }
    .report-rating-tag.good { background: var(--success-bg); color: var(--success); }
    .report-rating-tag.normal { background: var(--warning-bg); color: var(--warning); }
    .report-rating-tag.bad { background: var(--error-bg); color: var(--error); }

    /* 弹窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1000;
      display: none; justify-content: center; align-items: flex-end;
    }
    .modal-overlay.show { display: flex; }
    .detail-modal {
      background: var(--bg-white);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      width: 100%;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .detail-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 8px auto 0;
    }
    .detail-header {
      padding: 12px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-header-title {
      font-size: var(--font-lg);
      font-weight: 700;
      color: var(--text);
    }
    .detail-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-md);
      background: var(--gray-100);
    }
    .detail-close svg { width: 18px; height: 18px; color: var(--text-secondary); }
    .detail-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    /* 弹窗内Tab */
    .detail-tab-bar {
      display: flex;
      background: var(--gray-100);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: 16px;
    }
    .detail-tab {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: var(--font-sm);
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .detail-tab.active {
      background: var(--bg-white);
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* 输入指标展示 */
    .indicator-section {
      margin-bottom: 20px;
    }
    .indicator-section-title {
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .indicator-section-title .dot {
      width: 4px; height: 14px;
      border-radius: 2px;
    }
    .indicator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .indicator-item {
      background: var(--gray-50);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }
    .indicator-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }
    .indicator-value {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }
    .indicator-value .unit {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 400;
      margin-left: 2px;
    }
    .indicator-value .core-tag {
      font-size: 9px;
      padding: 1px 4px;
      background: var(--primary-100);
      color: var(--primary-700);
      border-radius: 3px;
      font-weight: 600;
      margin-left: 4px;
    }

    /* 评价结果展示 */
    .score-circle-small {
      position: relative;
      width: 100px; height: 100px;
      margin: 0 auto 12px;
    }
    .score-circle-small svg {
      transform: rotate(-90deg);
      width: 100%; height: 100%;
    }
    .score-circle-bg-s {
      fill: none;
      stroke: var(--gray-100);
      stroke-width: 8;
    }
    .score-circle-progress-s {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .score-inner-s {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .score-value-s {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .score-label-s {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .eval-bar-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .eval-bar-label {
      width: 76px;
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .eval-bar-wrap {
      flex: 1;
      height: 7px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin: 0 8px;
    }
    .eval-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
    }
    .eval-bar-value {
      font-size: 11px;
      color: var(--text);
      font-weight: 600;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .eval-issue-card {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
      color: white;
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 12px;
    }
    .eval-issue-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .eval-issue-desc {
      font-size: 12px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .eval-problem {
      background: var(--warning-bg);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .eval-problem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .eval-problem-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .eval-problem-badge {
      font-size: 10px;
      padding: 1px 6px;
      background: var(--warning);
      color: white;
      border-radius: var(--radius-sm);
    }
    .eval-problem-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>

    /* ===== 渲染报告列表 ===== */
    function renderReports() {
      var html = '';
      reports.forEach(function(r) {
        var scoreClass = r.score >= 85 ? 'good' : r.score >= 75 ? 'normal' : 'bad';
        html += '<div class="report-card" onclick="viewReport(' + r.id + ')">' +
          '<div class="report-card-header">' +
            '<div class="report-info">' +
              '<div class="report-title">植株综合评价报告</div>' +
              '<div class="report-plot">' + r.plot + ' · ' + r.variety + ' · ' + r.stage + '</div>' +
              '<span class="report-rating-tag ' + r.ratingClass + '">' + r.rating + '</span>' +
            '</div>' +
            '<div class="report-score-box">' +
              '<div class="report-score ' + scoreClass + '">' + r.score + '</div>' +
              '<div class="report-score-label">综合得分</div>' +
            '</div>' +
          '</div>' +
          '<div class="report-card-body">' +
            '<div class="report-summary">' + r.summary + '</div>' +
          '</div>' +
          '<div class="report-card-footer">' +
            '<div class="report-meta-item">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
              r.date + ' ' + r.time +
            '</div>' +
            '<div class="report-meta-item">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
              r.user +
            '</div>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('reportList').innerHTML = html;
    }

    /* ===== 查看报告详情 ===== */
    function viewReport(id) {
      var r = reports.find(function(x) { return x.id === id; });
      if (!r) return;
      renderInputPanel(r);
      renderResultPanel(r);
      switchDetailTab('input');
      document.getElementById('detailModal').classList.add('show');
    }

    function switchDetailTab(tab) {
      document.querySelectorAll('.detail-tab').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelector('[data-dtab="' + tab + '"]').classList.add('active');
      document.getElementById('inputPanel').style.display = tab === 'input' ? 'block' : 'none';
      document.getElementById('resultPanel').style.display = tab === 'result' ? 'block' : 'none';
    }

    /* ===== 渲染输入指标 ===== */
    function renderInputPanel(r) {
      var d = r.inputData;
      var html = '';

      // 评价对象
      html += '<div class="indicator-section">' +
        '<div class="indicator-section-title"><span class="dot" style="background:var(--primary);"></span>评价对象</div>' +
        '<div class="indicator-grid">' +
          ind('果园主体', r.orchard) +
          ind('地块', r.plot) +
          ind('品系/株系', r.variety) +
          ind('砧木', r.rootstock) +
          ind('树龄', r.age) +
          ind('生育阶段', r.stage) +
        '</div>' +
      '</div>';

      // 环境与土壤
      html += '<div class="indicator-section">' +
        '<div class="indicator-section-title"><span class="dot" style="background:var(--primary);"></span>环境与土壤</div>' +
        '<div class="indicator-grid">' +
          indCore('空气温度', d.env.temp, d.env.tempUnit) +
          indCore('空气湿度', d.env.humidity, d.env.humidityUnit) +
          indCore('土壤含水量', d.env.soilMoisture, d.env.soilMoistureUnit) +
          indCore('光照适宜度', d.env.light, d.env.lightUnit) +
          ind('土壤pH', d.env.ph) +
          ind('土壤EC', d.env.ec, d.env.ecUnit) +
          ind('钾营养适宜度', d.env.potassium, d.env.potassiumUnit) +
        '</div>' +
      '</div>';

      // 植株与果实
      html += '<div class="indicator-section">' +
        '<div class="indicator-section-title"><span class="dot" style="background:var(--info);"></span>植株与果实</div>' +
        '<div class="indicator-grid">' +
          ind('整体树势', d.plant.treeHealth, d.plant.treeHealthUnit) +
          ind('新梢状态', d.plant.shoot, d.plant.shootUnit) +
          ind('叶片状态', d.plant.leaf, d.plant.leafUnit) +
          ind('叶片SPAD', d.plant.spad) +
          ind('根系活力', d.plant.root, d.plant.rootUnit) +
          ind('挂果负载', d.plant.fruitLoad, d.plant.fruitLoadUnit) +
          ind('坐果率', d.plant.fruitSet, d.plant.fruitSetUnit) +
          ind('落果率', d.plant.fruitDrop, d.plant.fruitDropUnit) +
          ind('平均果径', d.plant.fruitSize, d.plant.fruitSizeUnit) +
          ind('当前糖度', d.plant.sugar, d.plant.sugarUnit) +
          ind('果实外观', d.plant.fruitAppearance, d.plant.fruitAppearanceUnit) +
          ind('病虫健康度', d.plant.pestHealth, d.plant.pestHealthUnit) +
        '</div>' +
      '</div>';

      // 近期农事记录
      html += '<div class="indicator-section">' +
        '<div class="indicator-section-title"><span class="dot" style="background:var(--harvest-500);"></span>近期农事记录</div>' +
        '<div class="indicator-grid" style="grid-template-columns:1fr;">' +
          ind('近期灌溉', d.farming.irrigation) +
          ind('近期施肥', d.farming.fertilizer) +
        '</div>' +
      '</div>';

      document.getElementById('inputPanel').innerHTML = html;
    }

    function ind(label, value, unit) {
      return '<div class="indicator-item"><div class="indicator-label">' + label + '</div><div class="indicator-value">' + value + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div></div>';
    }

    function indCore(label, value, unit) {
      return '<div class="indicator-item"><div class="indicator-label">' + label + ' <span class="core-tag" style="font-size:9px;padding:1px 4px;background:var(--primary-100);color:var(--primary-700);border-radius:3px;font-weight:600;">核心</span></div><div class="indicator-value">' + value + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div></div>';
    }

    /* ===== 渲染评价结果 ===== */
    function renderResultPanel(r) {
      var e = r.evalData;
      var circumference = 2 * Math.PI * 42;
      var offset = circumference * (1 - e.score / 100);
      var strokeColor = r.score >= 85 ? 'var(--success)' : r.score >= 75 ? 'var(--warning)' : 'var(--error)';

      var html = '';

      // 评分圆环
      html += '<div style="text-align:center;margin-bottom:16px;">' +
        '<div class="score-circle-small">' +
          '<svg viewBox="0 0 100 100">' +
            '<circle cx="50" cy="50" r="42" class="score-circle-bg-s"/>' +
            '<circle cx="50" cy="50" r="42" class="score-circle-progress-s" style="stroke:' + strokeColor + ';stroke-dasharray:' + circumference + ';stroke-dashoffset:' + offset + '"/>' +
          '</svg>' +
          '<div class="score-inner-s">' +
            '<div class="score-value-s">' + e.score + '</div>' +
            '<div class="score-label-s">综合得分 · ' + e.rating + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:var(--font-sm);color:var(--text-secondary);">' + r.plot + ' · ' + r.variety + ' · ' + r.rootstock + ' · ' + r.age + ' · ' + r.stage + '</div>' +
      '</div>';

      // 主要矛盾
      html += '<div class="eval-issue-card">' +
        '<div class="eval-issue-title">' + e.mainIssue.title + '</div>' +
        '<div class="eval-issue-desc">' + e.mainIssue.desc + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">' +
          e.mainIssue.gaps.map(function(g) {
            return '<div style="background:rgba(255,255,255,0.15);border-radius:var(--radius-md);padding:8px;text-align:center;"><div style="font-size:10px;opacity:0.8;">' + g.label + '</div><div style="font-size:14px;font-weight:700;">' + g.value + '</div></div>';
          }).join('') +
        '</div>' +
      '</div>';

      // 九项综合评价
      html += '<div class="indicator-section">' +
        '<div class="indicator-section-title"><span class="dot" style="background:var(--primary);"></span>九项综合评价</div>';
      e.scores.forEach(function(s) {
        var pct = (s.score / s.max) * 100;
        var color = s.score >= 8 ? 'var(--success)' : s.score >= 6.5 ? 'var(--primary)' : 'var(--error)';
        html += '<div class="eval-bar-item">' +
          '<span class="eval-bar-label">' + s.label + '</span>' +
          '<div class="eval-bar-wrap"><div class="eval-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
          '<span class="eval-bar-value">' + s.score.toFixed(1) + '</span>' +
        '</div>';
      });
      html += '</div>';

      // 主要不足
      html += '<div class="indicator-section">' +
        '<div class="indicator-section-title"><span class="dot" style="background:var(--warning);"></span>主要不足与原因分析</div>';
      e.problems.forEach(function(p, i) {
        html += '<div class="eval-problem">' +
          '<div class="eval-problem-header">' +
            '<span class="eval-problem-name">' + (i+1) + '. ' + p.name + '</span>' +
            '<span class="eval-problem-badge">' + p.badge + '</span>' +
          '</div>' +
          '<div class="eval-problem-desc">' + p.desc + '</div>' +
        '</div>';
      });
      html += '</div>';

      // 模型说明
      html += '<div style="background:var(--warning-bg);border-radius:var(--radius-md);padding:12px;font-size:11px;color:var(--text-secondary);line-height:1.5;">' +
        '<strong>模型说明：</strong>本次评价采用 NF-Plant 1.0 模型版本。评价结果基于输入数据计算，仅供参考。实际生产决策请结合现场实际情况综合判断。' +
      '</div>';

      // 跳转按钮
      html += '<button class="mb-btn mb-btn-primary mb-btn-block" style="margin-top:16px;height:44px;" onclick="navigateTo(\'mb_judge_result.html\')">查看完整报告</button>';

      document.getElementById('resultPanel').innerHTML = html;
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    // 初始化
    renderReports();
    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
</script>
  </div>
