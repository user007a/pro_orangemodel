<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 南丰蜜桔模型管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh;
            background: url('../dataanlye/images/login_bg_orchard.jpg') center/cover no-repeat fixed;
            background-color: #5b8ab0;
            background-color: #7fae4e;
            overflow-x: hidden;
        }

        /* ========== 居中大圆登录区 ========== */
        .login-area {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orb-wrap {
            position: relative;
            /* 参考站：圆 7.5rem，根字号 100vw/19.2 → 1920 宽时 750px，随视口等比缩放 */
            width: clamp(480px, 39.06vw, 820px);
            aspect-ratio: 1 / 1;
        }
        /* 参考站 kuang.svg 同款环组：15 秒转一圈（CSS 实现，等价于其 SMIL animateTransform） */
        .orb-rings {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            animation: spin 15s linear infinite;
            transform-origin: 50% 50%;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .orb-rings { animation: none; }
        }

        /* 主圆卡片（对应 kuang.svg 中 r=331 的实心白圆） */
        .login-card {
            position: absolute;
            inset: 5.87%;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-inner {
            width: 58.7%;
            max-width: 440px;
            text-align: center;
        }

        /* ========== 品牌区（标题 + 英文，图 1 字号版式） ========== */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .brand-title {
            font-size: 40px;
            font-weight: 800;
            color: #333;
            letter-spacing: 2px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .brand-en {
            font-size: 15px;
            color: #47a14b;
            letter-spacing: 2.5px;
            font-weight: 400;
            white-space: nowrap;
            margin-top: 12px;
        }
        .brand-tagline {
            display: inline-block;
            font-size: 20px;
            color: #666;
            letter-spacing: 5px;
            margin: 12px 0 0;
        }

        /* ========== 输入区（参考站：440×56，组间距 30/12px） ========== */
        .input-group {
            position: relative;
            margin-top: 12px;
        }
        .input-group:first-of-type { margin-top: 30px; }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #b2b2b2;
            font-size: 17px;
            pointer-events: none;
            z-index: 1;
        }
        .input-field {
            width: 100%;
            height: 56px;
            padding: 0 44px 0 46px;
            border: 1px solid #e3e3e3;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #fff;
            color: #333;
        }
        .input-field::placeholder { color: #b2b2b2; font-size: 16px; }
        .input-field:focus {
            border-color: #4caf50;
            box-shadow: none;
        }
        .toggle-pwd {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #b2b2b2;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px;
        }
        .toggle-pwd:hover { color: #4caf50; }

        /* ========== 登录按钮（参考站：60 高 / #4caf50 / 圆角 6 / 21px） ========== */
        .login-btn {
            width: 100%;
            height: 60px;
            margin-top: 32px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 21px;
            font-family: inherit;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 4px;
            text-indent: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-btn:hover {
            background: #3f9542;
            box-shadow: none;
        }
        .login-btn:active { background: #38873c; }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: toastIn 0.3s ease;
        }
        .toast.success { background: #34a952; }
        .toast.error { background: #f56c6c; }
        .toast.info { background: #409eff; }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Responsive */
        @media (max-width: 1280px), (max-height: 900px) {
            .orb-wrap { width: clamp(560px, 52vw, 700px); }
            .brand-title { font-size: 34px; }
        }
        @media (max-width: 700px), (max-height: 760px) {
            .orb-wrap { width: min(92vw, 560px); }
            .brand-title { font-size: 24px; }
            .brand-en { font-size: 11px; }
            .brand-tagline { font-size: 15px; letter-spacing: 3px; }
            .input-field { height: 46px; }
            .login-btn { height: 48px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- 居中大圆登录区 -->
    <div class="login-area">
        <div class="orb-wrap">
            <!-- 参考站 kuang.svg 同款环组（15s/圈）：淡白晕环 + 双弧线 + 绿色虚线刻度环 -->
            <svg class="orb-rings" viewBox="0 0 750 750" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="375" cy="375" r="375" fill="#FFFFFF" opacity="0.117"/>
                <path d="M375,28 C183.357192,28 28,183.357192 28,375 M375,722 C566.642808,722 722,566.642808 722,375"
                      stroke="#FFFFFF" stroke-width="8" opacity="0.602" fill="none"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M60,375 C60,548.969696 201.030304,690 375,690 M690,375 C690,201.030304 548.969696,60 375,60"
                      stroke="#cfedd4" stroke-width="9" stroke-dasharray="2,16" fill="none"/>
            </svg>
            <div class="login-card">
                <div class="card-inner">
                    <!-- 品牌区 -->
                    <div class="brand-header">
                        <div class="brand-title-wrap">
                            <div class="brand-title">南丰蜜桔模型管理系统</div>
                            <div class="brand-en">NANFENG MANDARIN MODEL MANAGEMENT SYSTEM</div>
                        </div>
                    </div>

                    <div class="brand-tagline">精准辅助生长、科学指导防控</div>

                    <form id="loginForm" onsubmit="return handleLogin(event)">
                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="username" class="input-field" placeholder="请输入账号" autocomplete="username" autofocus>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" class="input-field" placeholder="请输入密码" autocomplete="current-password">
                            <button type="button" class="toggle-pwd" onclick="togglePassword()" aria-label="显示/隐藏密码">
                                <i class="fas fa-eye" id="pwdIcon"></i>
                            </button>
                        </div>
                        <button type="submit" class="login-btn" id="loginBtn">
                            <span>登 录</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var pwd = document.getElementById('password');
            var icon = document.getElementById('pwdIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showToast(message, type) {
            type = type || 'success';
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var iconMap = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };
            toast.innerHTML = '<i class="fas ' + (iconMap[type] || iconMap.info) + '"></i><span>' + message + '</span>';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }

        function handleLogin(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var btn = document.getElementById('loginBtn');

            if (!username) {
                showToast('请输入账号', 'error');
                document.getElementById('username').focus();
                return false;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                document.getElementById('password').focus();
                return false;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>登录中...</span>';

            setTimeout(function() {
                showToast('登录成功，正在跳转...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 800);
            }, 600);

            return false;
        }
    </script>
</body>
</html>
