<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>桔农通 - 数据上报</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-title {
      font-size: var(--font-xl);
      font-weight: 700;
      padding-left: 44px;
    }
    
    .header-sub {
      font-size: var(--font-sm);
      opacity: 0.7;
      padding-left: 44px;
      margin-top: 4px;
    }

    .tab-bar {
      display: flex;
      background: var(--bg-white);
      padding: 4px;
      margin: 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    
    .tab-item {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: var(--font-sm);
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .tab-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 20px;
      margin: 0 16px 16px;
      box-shadow: var(--shadow-card);
    }
    
    .card-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-title svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }

    .form-item {
      margin-bottom: 16px;
    }
    
    .form-label {
      font-size: var(--font-sm);
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
    }
    
    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      color: var(--text);
      background: var(--bg-white);
      transition: all var(--transition-fast);
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .form-input::placeholder { color: var(--text-light); }
    
    .form-select {
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      color: var(--text);
      background: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .form-select:focus, .form-select:active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .form-select svg {
      width: 16px;
      height: 16px;
      color: var(--text-light);
    }
    
    .form-select-value {
      color: var(--text-secondary);
    }

    .location-picker {
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      color: var(--text);
      background: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .location-picker:active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .location-picker svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }
    
    .location-value {
      color: var(--text-secondary);
      flex: 1;
      text-align: left;
    }

    .radio-group {
      display: flex;
      gap: 12px;
    }
    
    .radio-item {
      flex: 1;
      padding: 12px;
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      border: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-fast);
    }
    
    .radio-item.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    
    .radio-item .radio-label {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: 500;
    }

    .btn {
      height: 48px;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
    }
    
    .btn:active { transform: scale(0.98); }
    
    .btn-block { width: 100%; }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
      box-shadow: 0 4px 14px rgba(34, 168, 74, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary svg { width: 18px; height: 18px; }
    
    .btn-secondary {
      background: var(--gray-100);
      color: var(--text-secondary);
    }
    
    .submit-wrap {
      padding: 0 16px 16px;
    }

    .modal-box {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }
    
    .modal-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-icon.success { background: var(--success-bg); }
    .modal-icon.success svg { width: 40px; height: 40px; color: var(--success); }
    
    .modal-title {
      font-size: var(--font-lg);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }
    
    .modal-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .modal-btn {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .picker-option {
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--bg);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: var(--font-base);
      color: var(--text);
      transition: all var(--transition-fast);
    }
    
    .picker-option:hover {
      background: var(--primary-light);
    }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <div class="skeleton-state">
      <div class="page-header">
        <div style="width:36px;height:36px;"></div>
        <div class="mb-skeleton" style="width:100px;height:24px;margin-left:44px;"></div>
        <div class="mb-skeleton" style="width:160px;height:14px;margin-left:44px;margin-top:6px;"></div>
      </div>
      <div class="tab-bar">
        <div class="mb-skeleton" style="flex:1;height:36px;border-radius:var(--radius-md);"></div>
        <div class="mb-skeleton" style="flex:1;height:36px;border-radius:var(--radius-md);"></div>
        <div class="mb-skeleton" style="flex:1;height:36px;border-radius:var(--radius-md);"></div>
      </div>
      <div class="card">
        <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:44px;border-radius:var(--radius-lg);margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:44px;border-radius:var(--radius-lg);margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:44px;border-radius:var(--radius-lg);margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:44px;border-radius:var(--radius-lg);"></div>
      </div>
      <div class="card">
        <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:44px;border-radius:var(--radius-lg);margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:44px;border-radius:var(--radius-lg);"></div>
      </div>
      <div class="submit-wrap">
        <div class="mb-skeleton" style="width:100%;height:48px;border-radius:var(--radius-full);"></div>
      </div>
    </div>

    <div class="real-content">
      <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-title">数据上报</div>
      <div class="header-sub">记录果园各项数据信息</div>
    </div>

    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('soil')">土壤数据</div>
      <div class="tab-item" onclick="switchTab('moisture')">墒情数据</div>
      <div class="tab-item" onclick="switchTab('weather')">气象数据</div>
      <div class="tab-item" onclick="switchTab('farming')">农事记录</div>
    </div>

    <div id="soilForm" class="content">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          地块信息
        </div>
        <div class="form-item">
          <label class="form-label">定位地块</label>
          <div class="location-picker" onclick="getLocation('soil')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span class="location-value" id="soilLocation">点击定位</span>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">采样日期</label>
          <input type="date" class="form-input" value="2026-07-23">
        </div>
      </div>
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          土壤指标
        </div>
        <div class="form-item">
          <label class="form-label">pH值</label>
          <input type="number" class="form-input" placeholder="请输入pH值" step="0.1">
        </div>
        <div class="form-item">
          <label class="form-label">有机质(%)</label>
          <input type="number" class="form-input" placeholder="请输入有机质含量" step="0.01">
        </div>
        <div class="form-item">
          <label class="form-label">氮含量(mg/kg)</label>
          <input type="number" class="form-input" placeholder="请输入氮含量">
        </div>
        <div class="form-item">
          <label class="form-label">磷含量(mg/kg)</label>
          <input type="number" class="form-input" placeholder="请输入磷含量">
        </div>
        <div class="form-item">
          <label class="form-label">钾含量(mg/kg)</label>
          <input type="number" class="form-input" placeholder="请输入钾含量">
        </div>
      </div>
    </div>

    <div id="moistureForm" class="content" style="display: none;">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l-5.5 9 1.8 0 0 5.5 7.4 0 0-5.5 1.8 0z"/>
            <circle cx="12" cy="7" r="2"/>
          </svg>
          墒情数据
        </div>
        <div class="form-item">
          <label class="form-label">定位地块</label>
          <div class="location-picker" onclick="getLocation('moisture')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span class="location-value" id="moistureLocation">点击定位</span>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">采集时间</label>
          <input type="datetime-local" class="form-input">
        </div>
        <div class="form-item">
          <label class="form-label">土壤湿度(%)</label>
          <input type="number" class="form-input" placeholder="请输入土壤湿度">
        </div>
        <div class="form-item">
          <label class="form-label">墒情等级</label>
          <div class="radio-group">
            <div class="radio-item" onclick="selectMoistureLevel('dry')"><div class="radio-label">干旱</div></div>
            <div class="radio-item" onclick="selectMoistureLevel('normal')"><div class="radio-label">适中</div></div>
            <div class="radio-item" onclick="selectMoistureLevel('wet')"><div class="radio-label">充足</div></div>
          </div>
        </div>
      </div>
    </div>

    <div id="weatherForm" class="content" style="display: none;">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h2"/><path d="M20 12h2"/>
          </svg>
          气象数据
        </div>
        <div class="form-item">
          <label class="form-label">记录日期</label>
          <input type="date" class="form-input" value="2026-07-23">
        </div>
        <div class="form-item">
          <label class="form-label">最高温度(°C)</label>
          <input type="number" class="form-input" placeholder="请输入最高温度">
        </div>
        <div class="form-item">
          <label class="form-label">最低温度(°C)</label>
          <input type="number" class="form-input" placeholder="请输入最低温度">
        </div>
        <div class="form-item">
          <label class="form-label">降雨量(mm)</label>
          <input type="number" class="form-input" placeholder="请输入降雨量">
        </div>
        <div class="form-item">
          <label class="form-label">天气状况</label>
          <div class="radio-group">
            <div class="radio-item" onclick="selectWeather('晴', this)"><div class="radio-label">晴</div></div>
            <div class="radio-item" onclick="selectWeather('多云', this)"><div class="radio-label">多云</div></div>
            <div class="radio-item" onclick="selectWeather('阴', this)"><div class="radio-label">阴</div></div>
            <div class="radio-item" onclick="selectWeather('小雨', this)"><div class="radio-label">小雨</div></div>
            <div class="radio-item" onclick="selectWeather('中雨', this)"><div class="radio-label">中雨</div></div>
            <div class="radio-item" onclick="selectWeather('大雨', this)"><div class="radio-label">大雨</div></div>
          </div>
        </div>
      </div>
    </div>

    <div id="farmingForm" class="content" style="display: none;">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          农事记录
        </div>
        <div class="form-item">
          <label class="form-label">定位地块</label>
          <div class="location-picker" onclick="getLocation('farming')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span class="location-value" id="farmingLocation">点击定位</span>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">农事类型</label>
          <div class="radio-group">
            <div class="radio-item" onclick="selectFarmingType('施肥', this)"><div class="radio-label">施肥</div></div>
            <div class="radio-item" onclick="selectFarmingType('灌溉', this)"><div class="radio-label">灌溉</div></div>
            <div class="radio-item" onclick="selectFarmingType('剪枝', this)"><div class="radio-label">剪枝</div></div>
            <div class="radio-item" onclick="selectFarmingType('疏果', this)"><div class="radio-label">疏果</div></div>
            <div class="radio-item" onclick="selectFarmingType('喷药', this)"><div class="radio-label">喷药</div></div>
            <div class="radio-item" onclick="selectFarmingType('其他', this)"><div class="radio-label">其他</div></div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">执行日期</label>
          <input type="date" class="form-input" value="2026-07-23">
        </div>
        <div class="form-item">
          <label class="form-label">备注说明</label>
          <textarea class="form-input" rows="3" placeholder="请输入备注说明..." style="height: auto;"></textarea>
        </div>
      </div>
    </div>

    <div class="submit-wrap">
      <button class="btn btn-primary btn-block" onclick="submitData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><polyline points="20 6 9 17 4 12"/></svg>
        提交数据
      </button>
    </div>
    </div>

    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">首页</div>
      <div class="mb-tab-item active" onclick="navigateTo('mb_data.html')">监测</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_ai.html')">AI助手</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_disease.html')">病虫害</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_profile.html')">我的</div>
    </div>
  </div>

  <script>
    var orchardLocations = ['1号早熟蜜桔区', '2号中熟蜜桔区', '3号晚熟蜜桔区', '4号试验田'];
    
    function goBack() { window.history.back(); }
    
    function switchTab(type) {
      document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
      event.target.classList.add('active');
      
      document.getElementById('soilForm').style.display = 'none';
      document.getElementById('moistureForm').style.display = 'none';
      document.getElementById('weatherForm').style.display = 'none';
      document.getElementById('farmingForm').style.display = 'none';
      document.getElementById(type + 'Form').style.display = 'block';
    }
    
    function getLocation(type) {
      var locationSpan = document.getElementById(type + 'Location');
      locationSpan.textContent = '定位中...';
      
      setTimeout(function() {
        var randomLocation = orchardLocations[Math.floor(Math.random() * orchardLocations.length)];
        locationSpan.textContent = randomLocation;
        locationSpan.style.color = 'var(--text)';
      }, 1000);
    }
    
    function selectMoistureLevel(level) {
      var container = event.target.closest('.card');
      container.querySelectorAll('.radio-item').forEach(item => item.classList.remove('active'));
      event.target.classList.add('active');
    }
    
    function selectWeather(weather, element) {
      var container = element.closest('.card');
      container.querySelectorAll('.radio-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
    
    function selectFarmingType(type, element) {
      var container = element.closest('.card');
      container.querySelectorAll('.radio-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
    
    function submitData() {
      document.getElementById('successModal').classList.add('show');
    }
    
    function closeSuccess() {
      document.getElementById('successModal').classList.remove('show');
      window.history.back();
    }
    
    function navigateTo(url) {
      window.location.href = url;
    }

    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
</body>
</html>
