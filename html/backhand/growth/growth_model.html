<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型说明 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body{margin:0;padding:0;background-color:#F0F2F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif}
        .content-wrapper{padding:24px;height:100vh;overflow-y:auto}
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="content-wrapper">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-xl font-bold text-gray-800">模型说明</h1>
            <p class="text-gray-500 text-sm mt-1">管理南丰蜜桔生长模型的运行状态和参数配置</p>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="window.open('growth_model_memo.html', '_blank')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">模型说明</button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800">植株报告分析</h2>
                <div class="flex items-center space-x-4 text-xs">
                    <span class="text-gray-500">已评价株数: <span class="font-bold text-gray-800">35</span></span>
                    <span class="text-gray-500">平均得分: <span class="font-bold text-green-600">79.2</span></span>
                </div>
            </div>
            <div class="flex items-center space-x-3 mb-3 text-xs">
                <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full">优: 8株</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full">良: 18株</span>
                <span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full">一般: 5株</span>
                <span class="px-2 py-1 bg-orange-100 text-orange-700 rounded-full">异常: 4株</span>
            </div>
            <div class="h-56"><canvas id="trainingDataChart"></canvas></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800">农事建议分析</h2>
                <div class="flex items-center space-x-4 text-xs">
                    <span class="text-gray-500">建议总数: <span class="font-bold text-gray-800">142</span></span>
                    <span class="text-gray-500">采纳率: <span class="font-bold text-green-600">76.3%</span></span>
                </div>
            </div>
            <div class="flex items-center space-x-3 mb-3 text-xs">
                <span class="px-2 py-1 bg-red-100 text-red-700 rounded-full">一项(紧急): 38条</span>
                <span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full">二项(重要): 56条</span>
                <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full">三项(常规): 48条</span>
            </div>
            <div class="h-56"><canvas id="accuracyTrendChart"></canvas></div>
        </div>
    </div>


<!-- 保存参数弹窗 -->
<div id="save-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center">
    <div style="background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto">
        <div style="padding:16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
            <h3 style="font-size:18px;font-weight:600;color:#1f2937">保存参数配置</h3>
            <button onclick="closeModal('save-modal')" style="padding:4px;background:none;border:none;cursor:pointer;border-radius:4px">&times;</button>
        </div>
        <div style="padding:24px">
            <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-bottom:16px">
                <p style="font-size:14px;font-weight:500;color:#1e40af">参数修改确认</p>
                <p style="font-size:12px;color:#2563eb;margin-top:4px">修改模型参数后需要重新训练模型才能生效，预计耗时约15分钟。</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px">
                <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px"><span style="font-size:14px;color:#4b5563">有效积温阈值</span><span style="font-size:14px;font-weight:500;color:#1f2937" id="preview-temp">1200 C·d</span></div>
                <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px"><span style="font-size:14px;color:#4b5563">土壤湿度适宜范围</span><span style="font-size:14px;font-weight:500;color:#1f2937" id="preview-moisture">60-80 %</span></div>
                <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px"><span style="font-size:14px;color:#4b5563">光照强度阈值</span><span style="font-size:14px;font-weight:500;color:#1f2937" id="preview-light">30 klx</span></div>
                <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px"><span style="font-size:14px;color:#4b5563">预测周期</span><span style="font-size:14px;font-weight:500;color:#1f2937" id="preview-period">7 天</span></div>
            </div>
            <div style="margin-top:16px"><label style="display:flex;align-items:center;cursor:pointer"><input type="checkbox" id="restart-model" style="width:16px;height:16px"><span style="margin-left:8px;font-size:14px;color:#4b5563">保存后自动重启模型</span></label></div>
        </div>
        <div style="padding:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:12px">
            <button onclick="closeModal('save-modal')" style="padding:8px 16px;border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:8px;font-size:14px;cursor:pointer">取消</button>
            <button onclick="submitSaveParams()" style="padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">确认保存</button>
        </div>
    </div>
</div>

<script>

window.onload = function(){
    initCharts();
};

function initCharts(){
    var trainingCtx = document.getElementById('trainingDataChart').getContext('2d');
    new Chart(trainingCtx, {
        type: 'bar',
        data: {
            labels: ['树势枝干', '叶片状态', '根系状态', '花果状态', '果实品质', '膨果品质', '温湿度', '水分光照', '病虫管理'],
            datasets: [{
                label: '平均得分',
                data: [8.4, 7.9, 7.3, 7.3, 8.5, 8.3, 7.2, 7.7, 4.6],
                backgroundColor: ['#16A34A', '#22C55E', '#84CC16', '#EAB308', '#16A34A', '#22C55E', '#EAB308', '#84CC16', '#F97316'],
                borderRadius: 4,
                barThickness: 16
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) { return '平均得分: ' + context.parsed.y + ' / 10'; }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 10,
                    ticks: { stepSize: 2, font: { size: 11 } },
                    grid: { color: '#f3f4f6' }
                },
                x: {
                    ticks: { font: { size: 10 }, autoSkip: false, maxRotation: 45, minRotation: 45 },
                    grid: { display: false }
                }
            }
        }
    });

    var accuracyCtx = document.getElementById('accuracyTrendChart').getContext('2d');
    new Chart(accuracyCtx, {
        type: 'bar',
        data: {
            labels: ['疏果管理', '施肥管理', '灌溉管理', '遮阳降温', '病虫防控', '修剪管理'],
            datasets: [
                { label: '一项(紧急)', data: [12, 10, 8, 5, 3, 0], backgroundColor: '#EF4444', borderRadius: 3, barThickness: 14 },
                { label: '二项(重要)', data: [8, 12, 15, 10, 6, 5], backgroundColor: '#EAB308', borderRadius: 3, barThickness: 14 },
                { label: '三项(常规)', data: [5, 8, 6, 4, 15, 10], backgroundColor: '#22C55E', borderRadius: 3, barThickness: 14 }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { padding: 12, font: { size: 11 }, usePointStyle: true, pointStyle: 'circle' }
                },
                tooltip: {
                    mode: 'index',
                    callbacks: {
                        afterBody: function(contexts) {
                            var total = contexts.reduce(function(sum, c) { return sum + c.parsed.y; }, 0);
                            return '合计: ' + total + ' 条';
                        }
                    }
                }
            },
            scales: {
                x: {
                    stacked: true,
                    ticks: { font: { size: 11 } },
                    grid: { display: false }
                },
                y: {
                    stacked: true,
                    beginAtZero: true,
                    ticks: { stepSize: 5, font: { size: 11 } },
                    grid: { color: '#f3f4f6' }
                }
            }
        }
    });
}

function showModal(id){
    var modal = document.getElementById(id);
    if(modal){
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
}

function closeModal(id){
    var modal = document.getElementById(id);
    if(modal){
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }
}

</script>
