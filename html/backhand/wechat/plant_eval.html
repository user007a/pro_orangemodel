                id: 'E-20260718-005', orchard: '琴城镇果园12', plant: '东坡L-01地块·品系A·7年生',
                score: 72, result: '一般', user: '林超', time: '2026-07-18 09:15', source: '移动端',
                factors: {
                    '评价对象': { '果园主体': '琴城镇果园12', '地块': '东坡L-01', '品系/株系': '品系A', '砧木': '红桔砧', '树龄': '7年', '生育阶段': '果实膨大期' },
                    '环境与土壤': { '空气温度': '34°C', '空气湿度': '56%', '土壤含水量': '30%', '光照适宜度': '91%', '土壤pH': '6.1', '土壤EC': '0.8 mS/cm', '钾营养适宜度': '50%' },
                    '植株与果实': { '整体树势': '中等', '新梢状态': '正常', '叶片状态': '褪绿', '叶片SPAD': '34', '根系活力': '一般', '挂果负载': '偏重', '坐果率': '63%', '落果率': '8%', '平均果径': '46mm', '当前糖度': '8.7°Brix', '果实外观': '一般', '病虫健康度': '轻度风险' },
                    '近期农事记录': { '近期灌溉': '7月12日沟灌', '近期施肥': '7月8日复合肥' }
                },
                report: {
                    summary: '综合得分72分，长势一般。土壤含水量偏低，挂果偏重。需加强水肥管理，适当疏果。',
                    mainIssue: '水分不足与挂果过重',
                    deficiencies: [
                        { name: '果径不足', gap: '差9.0 mm', severity: 'high' },
                        { name: '糖度不足', gap: '差1.3 °Brix', severity: 'medium' }
                    ],
                    suggestions: [
                        '增加灌溉频次',
                        '追施高钾肥',
                        '疏果减载',
                        '加强病虫害监测'
                    ]
                }
            },
            {
                id: 'E-20260717-003', orchard: '南丰镇示范园01', plant: '北坡A-07地块·品系A·6年生',
                score: 90, result: '优秀', user: '张明', time: '2026-07-17 14:45', source: 'PC端',
                factors: {
                    '评价对象': { '果园主体': '南丰镇示范园01', '地块': '北坡A-07', '品系/株系': '品系A', '砧木': '枳砧', '树龄': '6年', '生育阶段': '果实膨大期' },
                    '环境与土壤': { '空气温度': '29°C', '空气湿度': '74%', '土壤含水量': '51%', '光照适宜度': '76%', '土壤pH': '6.9', '土壤EC': '1.5 mS/cm', '钾营养适宜度': '87%' },
                    '植株与果实': { '整体树势': '强', '新梢状态': '健壮', '叶片状态': '浓绿', '叶片SPAD': '45', '根系活力': '强', '挂果负载': '适中', '坐果率': '78%', '落果率': '3%', '平均果径': '55mm', '当前糖度': '10.3°Brix', '果实外观': '优', '病虫健康度': '健康' },
                    '近期农事记录': { '近期灌溉': '7月16日滴灌', '近期施肥': '7月12日高钾水溶肥' }
                },
                report: {
                    summary: '综合得分90分，长势优秀。各项指标均处于理想区间，管理精细到位。',
                    mainIssue: '无明显短板',
                    deficiencies: [],
                    suggestions: [
                        '维持当前管理方案',
                        '做好防台防汛准备'
                    ]
                }
            }
        ];

        let currentPage = 1;
        let pageSize = 10;
        let filteredEvals = evals.slice();
        let currentDownloadId = null;

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = evals.length;
            document.getElementById('stat-excellent').textContent = evals.filter(e => e.result === '优秀').length;
            const avgScore = evals.length ? Math.round(evals.reduce((s, e) => s + e.score, 0) / evals.length) : 0;
            document.getElementById('stat-avg-score').textContent = avgScore;
            const now = new Date();
            const monthCount = evals.filter(e => {
                const d = new Date(e.time);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            }).length;
            document.getElementById('stat-month').textContent = monthCount;
        }

        function getScoreColor(score) {
            if (score >= 85) return 'bg-green-500';
            if (score >= 75) return 'bg-blue-500';
            if (score >= 65) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function renderTable() {
            const tbody = document.getElementById('eval-table-body');
            const emptyTip = document.getElementById('empty-tip');
            const total = filteredEvals.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredEvals.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '';
                emptyTip.classList.remove('hidden');
            } else {
                emptyTip.classList.add('hidden');
                tbody.innerHTML = pageData.map(e => {
                    const resultStyle = RESULT_STYLES[e.result] || 'bg-gray-100 text-gray-700';
                    return `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-500">${escapeHtml(e.id)}</td>
                            <td class="px-6 py-4 text-sm text-gray-900">${escapeHtml(e.orchard)}</td>
                            <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(e.plant)}</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center">
                                    <span class="text-sm font-bold text-gray-800 mr-2">${e.score}分</span>
                                    <span class="px-2 py-1 ${resultStyle} text-xs rounded-full">${escapeHtml(e.result)}</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(e.user)}</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center justify-center space-x-3">
                                    <button onclick="openDetailModal('${e.id}')" class="px-3 py-1 text-green hover:bg-green-50 rounded text-xs font-medium transition-colors">查看评价</button>
                                    <button onclick="openDownloadModal('${e.id}')" class="px-3 py-1 text-purple hover:bg-purple-50 rounded text-xs font-medium transition-colors">报告下载</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('page-info').textContent = total === 0 ? '共 0 条记录' : `第 ${start + 1}-${end} 条，共 ${total} 条记录`;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            let html = '';
            html += `<button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">上一页</button>`;
            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            if (start > 1) {
                html += `<button onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">1</button>`;
                if (start > 2) html += `<span class="px-2 text-gray-400">...</span>`;
            }
            for (let i = start; i <= end; i++) {
                html += `<button onclick="changePage(${i})" class="pagination-btn px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            if (end < totalPages) {
                if (end < totalPages - 1) html += `<span class="px-2 text-gray-400">...</span>`;
                html += `<button onclick="changePage(${totalPages})" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">${totalPages}</button>`;
            }
            html += `<button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">下一页</button>`;
            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.max(1, Math.ceil(filteredEvals.length / pageSize));
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }
        function nextPage() {
            const totalPages = Math.max(1, Math.ceil(filteredEvals.length / pageSize));
            if (currentPage < totalPages) { currentPage++; renderTable(); }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderTable();
        }

        function filterEvals() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const source = document.getElementById('source-filter').value;
            const result = document.getElementById('result-filter').value;
            filteredEvals = evals.filter(e => {
                const matchKeyword = !keyword || e.id.toLowerCase().includes(keyword) || e.orchard.toLowerCase().includes(keyword) || e.plant.toLowerCase().includes(keyword);
                const matchSource = !source || e.source === source;
                const matchResult = !result || e.result === result;
                return matchKeyword && matchSource && matchResult;
            });
            currentPage = 1;
            renderTable();
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('source-filter').value = '';
            document.getElementById('result-filter').value = '';
            filteredEvals = evals.slice();
            currentPage = 1;
            renderTable();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function openDetailModal(id) {
            const e = evals.find(x => x.id === id);
            if (!e) return;

            let factorsHtml = '';
            for (const [moduleName, fields] of Object.entries(e.factors)) {
                factorsHtml += `
                    <div class="mb-4">
                        <h4 class="text-sm font-semibold text-gray-800 mb-2 pb-1 border-b border-gray-200">${escapeHtml(moduleName)}</h4>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                `;
                for (const [key, value] of Object.entries(fields)) {
                    factorsHtml += `
                            <div class="bg-gray-50 rounded-lg px-3 py-2">
                                <p class="text-xs text-gray-500">${escapeHtml(key)}</p>
                                <p class="text-sm font-medium text-gray-800 mt-0.5">${escapeHtml(value)}</p>
                            </div>
                    `;
                }
                factorsHtml += `</div></div>`;
            }

            let deficienciesHtml = '';
            if (e.report.deficiencies.length > 0) {
                deficienciesHtml = e.report.deficiencies.map(d => {
                    const sevColor = d.severity === 'high' ? 'text-red-600 bg-red-50' : (d.severity === 'medium' ? 'text-yellow-600 bg-yellow-50' : 'text-gray-600 bg-gray-50');
                    return `
                        <div class="flex items-center justify-between px-3 py-2 ${sevColor} rounded-lg">
                            <span class="text-sm font-medium">${escapeHtml(d.name)}</span>
                            <span class="text-sm">${escapeHtml(d.gap)}</span>
                        </div>
                    `;
                }).join('');
            } else {
                deficienciesHtml = '<p class="text-sm text-gray-400 text-center py-3">无短板项</p>';
            }

            let suggestionsHtml = e.report.suggestions.map((s, i) => `
                <div class="flex items-start mb-2">
                    <span class="flex-shrink-0 w-5 h-5 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xs font-bold mr-2 mt-0.5">${i + 1}</span>
                    <p class="text-sm text-gray-700">${escapeHtml(s)}</p>
                </div>
            `).join('');

            const scoreColor = getScoreColor(e.score);

            document.getElementById('detail-body').innerHTML = `
                <div class="flex items-center justify-between mb-6 p-4 bg-gradient-to-r from-green-50 to-blue-50 rounded-xl">
                    <div>
                        <h4 class="text-lg font-semibold text-gray-800">${escapeHtml(e.id)}</h4>
                        <p class="text-sm text-gray-500 mt-1">${escapeHtml(e.orchard)} · ${escapeHtml(e.plant)}</p>
                        <div class="flex items-center mt-2 space-x-4">
                            <span class="text-sm text-gray-600">用户：${escapeHtml(e.user)}</span>
                            <span class="text-sm text-gray-600">时间：${escapeHtml(e.time)}</span>
                            <span class="px-2 py-0.5 bg-gray-200 text-gray-600 text-xs rounded-full">${escapeHtml(e.source)}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-3xl font-bold text-gray-800">${e.score}<span class="text-lg text-gray-400">分</span></p>
                        <span class="px-3 py-1 ${RESULT_STYLES[e.result]} text-sm rounded-full mt-1">${escapeHtml(e.result)}</span>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-800 mb-3 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        评分因子
                    </h4>
                    ${factorsHtml}
                </div>

                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-800 mb-3 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        评价结果
                    </h4>
                    <div class="bg-gray-50 rounded-xl p-4 mb-3">
                        <p class="text-sm text-gray-700 leading-relaxed">${escapeHtml(e.report.summary)}</p>
                    </div>
                    <div class="bg-orange-50 border border-orange-100 rounded-xl p-4 mb-3">
                        <p class="text-xs text-orange-500 mb-1">主要矛盾</p>
                        <p class="text-sm font-medium text-gray-800">${escapeHtml(e.report.mainIssue)}</p>
                    </div>
                    <div class="mb-3">
                        <p class="text-xs text-gray-500 mb-2">短板分析</p>
                        <div class="space-y-2">${deficienciesHtml}</div>
                    </div>
                </div>

                <div>
                    <h4 class="text-sm font-semibold text-gray-800 mb-3 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                        农事建议
                    </h4>
                    <div class="bg-green-50 rounded-xl p-4">${suggestionsHtml}</div>
                </div>
            `;

            document.getElementById('detail-modal').classList.add('active');
        }

        function openDownloadModal(id) {
            const e = evals.find(x => x.id === id);
            if (!e) return;
            currentDownloadId = id;
            document.getElementById('download-title').textContent = `${e.id} 评价报告`;
            document.getElementById('download-desc').textContent = `${e.orchard} · ${e.score}分 · ${e.user} · ${e.time}`;
            document.getElementById('download-modal').classList.add('active');
        }

        function doDownload(format) {
            const e = evals.find(x => x.id === currentDownloadId);
            if (!e) return;

            if (format === 'pdf') {
                const content = `植株综合评价报告\n\n评分编号: ${e.id}\n评分果园: ${e.orchard}\n评分植株: ${e.plant}\n综合得分: ${e.score}分 (${e.result})\n评分用户: ${e.user}\n时间: ${e.time}\n来源: ${e.source}\n\n=== 评分因子 ===\n${Object.entries(e.factors).map(([module, fields]) => `\n【${module}】\n${Object.entries(fields).map(([k, v]) => `  ${k}: ${v}`).join('\n')}`).join('\n')}\n\n=== 评价结果 ===\n综合概述: ${e.report.summary}\n主要矛盾: ${e.report.mainIssue}\n${e.report.deficiencies.length > 0 ? '\n短板分析:\n' + e.report.deficiencies.map(d => `  - ${d.name}: ${d.gap}`).join('\n') : ''}\n\n=== 农事建议 ===\n${e.report.suggestions.map((s, i) => `${i + 1}. ${s}`).join('\n')}`;
                const blob = new Blob(['\ufeff' + content], { type: 'text/plain;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `评价报告_${e.id}.txt`;
                link.click();
            } else {
                let csv = '评分编号,评分果园,评分植株,综合得分,评分结果,评分用户,时间,来源\n';
                csv += `${e.id},${e.orchard},${e.plant},${e.score},${e.result},${e.user},${e.time},${e.source}\n\n`;
                csv += '模块,因子,数值\n';
                for (const [module, fields] of Object.entries(e.factors)) {
                    for (const [k, v] of Object.entries(fields)) {
                        csv += `${module},${k},${v}\n`;
                    }
                }
                const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `评价数据_${e.id}.csv`;
                link.click();
            }

            closeModal('download-modal');
            alert('报告下载已开始，请留意浏览器下载提示');
        }

        document.addEventListener('click', (e) => {
            const detailModal = document.getElementById('detail-modal');
            if (detailModal && e.target === detailModal) detailModal.classList.remove('active');
            const downloadModal = document.getElementById('download-modal');
            if (downloadModal && e.target === downloadModal) downloadModal.classList.remove('active');
        });

        updateStats();
        renderTable();
    </script>
</body>
</html>
