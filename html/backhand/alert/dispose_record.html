<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处置记录 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: {
        green: { DEFAULT: '#16a34a' },
        blue: { DEFAULT: '#2563eb' },
        red: { DEFAULT: '#dc2626' },
        yellow: { DEFAULT: '#ca8a04' },
        purple: { DEFAULT: '#9333ea' }
      }}}}
    </script>

    <style>
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-overlay.active .modal-content { animation: modalSlideIn 0.3s ease; }
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; }
        .pagination-btn.active { background-color: #16A34A; color: white; border-color: #16A34A; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-gray-800">处置记录</h1>
                <p class="text-gray-500 text-sm mt-1">管理预警处置记录，跟踪处置进度</p>
            </div>
            <button onclick="exportRecords()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50 flex items-center transition">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                导出记录
            </button>
        </div>

        <!-- 统计数据 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">待处置</p>
                        <h3 class="text-2xl font-bold text-orange-600 mt-1" id="stat-pending">5</h3>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">处置中</p>
                        <h3 class="text-2xl font-bold text-blue mt-1" id="stat-processing">4</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7 text-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">已完成</p>
                        <h3 class="text-2xl font-bold text-green mt-1" id="stat-done">23</h3>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7 text-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">已关闭</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1" id="stat-closed">3</h3>
                    </div>
                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center space-x-4 flex-wrap">
                    <div class="flex-1 max-w-md">
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="search-input" placeholder="搜索预警编号、处置人..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" oninput="filterRecords()">
                        </div>
                    </div>
                    <select id="status-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterRecords()">
                        <option value="">全部状态</option>
                        <option value="待处置">待处置</option>
                        <option value="处置中">处置中</option>
                        <option value="已完成">已完成</option>
                        <option value="已关闭">已关闭</option>
                    </select>
                    <select id="handler-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterRecords()">
                        <option value="">全部处置人</option>
                        <option value="李农技">李农技</option>
                        <option value="王农技">王农技</option>
                        <option value="赵农技">赵农技</option>
                    </select>
                    <button onclick="resetFilters()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">重置</button>
                </div>
            </div>

            <!-- 数据列表 -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">预警编号</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">预警标题</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">预警级别</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">处置人</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">处置状态</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">处置措施</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">开始时间</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">完成时间</th>
                            <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="record-table-body"></tbody>
                </table>
                <div id="empty-tip" class="hidden py-12 text-center text-gray-400 text-sm">
                    <p>暂无匹配的处置记录</p>
                </div>
            </div>

            <!-- 分页 -->
            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <p class="text-sm text-gray-500" id="page-info">共 0 条记录</p>
                    <select id="page-size" onchange="changePageSize()" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600">
                        <option value="5">5条/页</option>
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2" id="pagination"></div>
            </div>
        </div>
    </div>

    <!-- 查看详情弹窗 -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    处置详情
                </h3>
                <button onclick="closeModal('detail-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><p class="text-sm text-gray-500 mb-1">预警编号</p><p id="detail-id" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">预警标题</p><p id="detail-title" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">预警级别</p><p id="detail-level" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">处置人</p><p id="detail-handler" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">处置状态</p><p id="detail-status" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">影响区域</p><p id="detail-area" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">开始时间</p><p id="detail-start" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                    <div><p class="text-sm text-gray-500 mb-1">完成时间</p><p id="detail-end" class="text-sm text-gray-800 bg-gray-50 px-3 py-2 rounded"></p></div>
                </div>
                <div class="mb-4">
                    <p class="text-sm text-gray-500 mb-1">处置措施</p>
                    <p id="detail-measure" class="text-sm text-gray-800 bg-gray-50 px-3 py-3 rounded leading-relaxed"></p>
                </div>
                <div>
                    <p class="text-sm text-gray-500 mb-1">处置结果</p>
                    <p id="detail-result" class="text-sm text-gray-800 bg-gray-50 px-3 py-3 rounded leading-relaxed"></p>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <button onclick="closeModal('detail-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    编辑处置记录
                </h3>
                <button onclick="closeModal('edit-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">处置人</label>
                        <select id="edit-handler" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="李农技">李农技</option>
                            <option value="王农技">王农技</option>
                            <option value="赵农技">赵农技</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">处置状态</label>
                        <select id="edit-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="待处置">待处置</option>
                            <option value="处置中">处置中</option>
                            <option value="已完成">已完成</option>
                            <option value="已关闭">已关闭</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">处置措施</label>
                        <textarea id="edit-measure" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">处置结果</label>
                        <textarea id="edit-result" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入处置结果"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('edit-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">取消</button>
                <button onclick="submitEdit()" class="px-4 py-2 text-white rounded-lg hover:bg-green-700 text-sm" style="background-color: #16A34A;">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    删除确认
                </h3>
                <button onclick="closeModal('delete-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="flex items-center mb-4">
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>
                    </div>
                    <div>
                        <p class="font-medium text-gray-800">确认删除该处置记录？</p>
                        <p class="text-sm text-gray-500 mt-1">删除后将无法恢复，请谨慎操作。</p>
                    </div>
                </div>
                <p class="text-sm text-gray-600">要删除的记录：<span id="delete-name" class="font-medium text-gray-800"></span></p>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('delete-modal')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">取消</button>
                <button onclick="submitDelete()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">确认删除</button>
            </div>
        </div>
    </div>

    <script>
        const LEVEL_STYLES = {
            '红色预警': 'bg-red-100 text-red-700',
            '橙色预警': 'bg-orange-100 text-orange-700',
            '黄色预警': 'bg-yellow-100 text-yellow-700',
            '蓝色预警': 'bg-blue-100 text-blue-700'
        };
        const STATUS_STYLES = {
            '待处置': 'bg-orange-100 text-orange-700',
            '处置中': 'bg-blue-100 text-blue-700',
            '已完成': 'bg-green-100 text-green-700',
            '已关闭': 'bg-gray-100 text-gray-700'
        };

        let records = [
            { id: 'YJ-20260722-001', title: '高温热害预警', level: '红色预警', handler: '李农技', status: '已完成', measure: '喷水降温、遮阳网覆盖', result: '果面温度降至安全范围，高温影响消除', area: '全县范围', start: '2026-07-22 11:00', end: '2026-07-22 16:30' },
            { id: 'YJ-20260721-015', title: '炭疽病发生预警', level: '黄色预警', handler: '王农技', status: '处置中', measure: '咪鲜胺喷雾防治', result: '-', area: '白舍镇', start: '2026-07-21 15:00', end: '-' },
            { id: 'YJ-20260722-003', title: '持续干旱预警', level: '黄色预警', handler: '赵农技', status: '待处置', measure: '-', result: '-', area: '全县范围', start: '-', end: '-' },
            { id: 'YJ-20260722-004', title: '潜叶蛾高发预警', level: '橙色预警', handler: '赵农技', status: '处置中', measure: '氯氰菊酯喷雾防治', result: '-', area: '太和镇、桑田镇', start: '2026-07-22 14:00', end: '-' },
            { id: 'YJ-20260722-005', title: '日灼病预警', level: '红色预警', handler: '王农技', status: '待处置', measure: '-', result: '-', area: '洽湾镇', start: '-', end: '-' },
            { id: 'YJ-20260722-006', title: '白粉虱发生预警', level: '蓝色预警', handler: '李农技', status: '已完成', measure: '黄板诱杀+吡虫啉喷雾', result: '虫口密度降至安全水平', area: '桑田镇', start: '2026-07-22 08:00', end: '2026-07-22 12:00' },
            { id: 'YJ-20260721-017', title: '暴雨洪涝预警', level: '橙色预警', handler: '王农技', status: '已完成', measure: '开沟排水、加固果园', result: '积水排出，果园无损失', area: '太和镇、东坪乡', start: '2026-07-21 16:00', end: '2026-07-21 20:30' },

            { id: 'YJ-20260705-142', title: '缺镁预警', level: '蓝色预警', handler: '王农技', status: '已完成', measure: '叶面喷施硫酸镁', result: '叶片含镁量恢复至0.4%', area: '东坪乡', start: '2026-07-05 11:00', end: '2026-07-05 15:00' }
        ];

        let currentPage = 1;
        let pageSize = 5;
        let filteredRecords = records.slice();
        let editTargetId = null;
        let deleteTargetId = null;

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function updateStats() {
            document.getElementById('stat-pending').textContent = records.filter(r => r.status === '待处置').length;
            document.getElementById('stat-processing').textContent = records.filter(r => r.status === '处置中').length;
            document.getElementById('stat-done').textContent = records.filter(r => r.status === '已完成').length;
            document.getElementById('stat-closed').textContent = records.filter(r => r.status === '已关闭').length;
        }

        function renderTable() {
            const tbody = document.getElementById('record-table-body');
            const emptyTip = document.getElementById('empty-tip');
            const total = filteredRecords.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredRecords.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '';
                emptyTip.classList.remove('hidden');
            } else {
                emptyTip.classList.add('hidden');
                tbody.innerHTML = pageData.map(r => {
                    const levelStyle = LEVEL_STYLES[r.level] || 'bg-gray-100 text-gray-700';
                    const statusStyle = STATUS_STYLES[r.status] || 'bg-gray-100 text-gray-700';
                    return `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-500">${escapeHtml(r.id)}</td>
                            <td class="px-6 py-4"><span class="font-medium text-gray-900">${escapeHtml(r.title)}</span></td>
                            <td class="px-6 py-4"><span class="px-2 py-1 ${levelStyle} text-xs rounded-full">${escapeHtml(r.level)}</span></td>
                            <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(r.handler)}</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 ${statusStyle} text-xs rounded-full">${escapeHtml(r.status)}</span></td>
                            <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(r.measure)}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${escapeHtml(r.start)}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${escapeHtml(r.end)}</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center justify-center space-x-2">
                                    <button onclick="openDetailModal('${r.id}')" class="px-3 py-1 text-green hover:bg-green-50 rounded text-xs font-medium transition-colors">查看</button>
                                    <button onclick="openEditModal('${r.id}')" class="px-3 py-1 text-blue hover:bg-blue-50 rounded text-xs font-medium transition-colors">编辑</button>
                                    <button onclick="openDeleteModal('${r.id}')" class="px-3 py-1 text-red hover:bg-red-50 rounded text-xs font-medium transition-colors">删除</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('page-info').textContent = total === 0 ? '共 0 条记录' : `第 ${start + 1}-${end} 条，共 ${total} 条记录`;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            let html = '';
            html += `<button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">上一页</button>`;
            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            if (start > 1) {
                html += `<button onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">1</button>`;
                if (start > 2) html += `<span class="px-2 text-gray-400">...</span>`;
            }
            for (let i = start; i <= end; i++) {
                html += `<button onclick="changePage(${i})" class="pagination-btn px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            if (end < totalPages) {
                if (end < totalPages - 1) html += `<span class="px-2 text-gray-400">...</span>`;
                html += `<button onclick="changePage(${totalPages})" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">${totalPages}</button>`;
            }
            html += `<button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">下一页</button>`;
            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.max(1, Math.ceil(filteredRecords.length / pageSize));
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }
        function nextPage() {
            const totalPages = Math.max(1, Math.ceil(filteredRecords.length / pageSize));
            if (currentPage < totalPages) { currentPage++; renderTable(); }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderTable();
        }

        function filterRecords() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const status = document.getElementById('status-filter').value;
            const handler = document.getElementById('handler-filter').value;
            filteredRecords = records.filter(r => {
                const matchKeyword = !keyword || r.id.toLowerCase().includes(keyword) || r.handler.toLowerCase().includes(keyword) || r.title.toLowerCase().includes(keyword);
                const matchStatus = !status || r.status === status;
                const matchHandler = !handler || r.handler === handler;
                return matchKeyword && matchStatus && matchHandler;
            });
            currentPage = 1;
            renderTable();
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('status-filter').value = '';
            document.getElementById('handler-filter').value = '';
            filteredRecords = records.slice();
            currentPage = 1;
            renderTable();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function openDetailModal(id) {
            const r = records.find(x => x.id === id);
            if (!r) return;
            document.getElementById('detail-id').textContent = r.id;
            document.getElementById('detail-title').textContent = r.title;
            document.getElementById('detail-level').textContent = r.level;
            document.getElementById('detail-handler').textContent = r.handler;
            document.getElementById('detail-status').textContent = r.status;
            document.getElementById('detail-area').textContent = r.area;
            document.getElementById('detail-start').textContent = r.start;
            document.getElementById('detail-end').textContent = r.end;
            document.getElementById('detail-measure').textContent = r.measure;
            document.getElementById('detail-result').textContent = r.result;
            document.getElementById('detail-modal').classList.add('active');
        }

        function openEditModal(id) {
            const r = records.find(x => x.id === id);
            if (!r) return;
            editTargetId = id;
            document.getElementById('edit-handler').value = r.handler;
            document.getElementById('edit-status').value = r.status;
            document.getElementById('edit-measure').value = r.measure === '-' ? '' : r.measure;
            document.getElementById('edit-result').value = r.result === '-' ? '' : r.result;
            document.getElementById('edit-modal').classList.add('active');
        }

        function submitEdit() {
            if (editTargetId === null) return;
            const handler = document.getElementById('edit-handler').value;
            const status = document.getElementById('edit-status').value;
            const measure = document.getElementById('edit-measure').value.trim() || '-';
            const result = document.getElementById('edit-result').value.trim() || '-';
            const r = records.find(x => x.id === editTargetId);
            if (r) {
                r.handler = handler;
                r.status = status;
                r.measure = measure;
                r.result = result;
                if (status === '已完成' && r.end === '-') {
                    const now = new Date();
                    const pad = (n) => String(n).padStart(2, '0');
                    r.end = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
                }
            }
            closeModal('edit-modal');
            editTargetId = null;
            filteredRecords = applyCurrentFilter();
            updateStats();
            renderTable();
            alert('处置记录修改成功！');
        }

        function openDeleteModal(id) {
            const r = records.find(x => x.id === id);
            if (!r) return;
            deleteTargetId = id;
            document.getElementById('delete-name').textContent = r.title + '（' + r.id + '）';
            document.getElementById('delete-modal').classList.add('active');
        }

        function submitDelete() {
            if (deleteTargetId === null) return;
            records = records.filter(x => x.id !== deleteTargetId);
            closeModal('delete-modal');
            deleteTargetId = null;
            filteredRecords = applyCurrentFilter();
            const totalPages = Math.max(1, Math.ceil(filteredRecords.length / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            updateStats();
            renderTable();
            alert('处置记录删除成功！');
        }

        function applyCurrentFilter() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const status = document.getElementById('status-filter').value;
            const handler = document.getElementById('handler-filter').value;
            return records.filter(r => {
                const matchKeyword = !keyword || r.id.toLowerCase().includes(keyword) || r.handler.toLowerCase().includes(keyword) || r.title.toLowerCase().includes(keyword);
                const matchStatus = !status || r.status === status;
                const matchHandler = !handler || r.handler === handler;
                return matchKeyword && matchStatus && matchHandler;
            });
        }

        function exportRecords() {
            const content = '预警编号,预警标题,预警级别,处置人,处置状态,处置措施,开始时间,完成时间\n' +
                records.map(r => `${r.id},${r.title},${r.level},${r.handler},${r.status},${r.measure},${r.start},${r.end}`).join('\n');
            const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '处置记录_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
            alert('导出成功！共导出 ' + records.length + ' 条处置记录。');
        }

        document.addEventListener('click', (e) => {
            ['detail-modal', 'edit-modal', 'delete-modal'].forEach(id => {
                const modal = document.getElementById(id);
                if (!modal) return;
                if (e.target === modal) modal.classList.remove('active');
            });
        });

        updateStats();
        renderTable();
    </script>
