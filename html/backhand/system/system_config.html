<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">系统配置</h1>
                <p class="text-gray-500 mt-1">管理系统基础配置参数</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="backupConfig()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
                    备份配置
                </button>
                <button onclick="saveConfig()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                    保存配置
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            基本配置
                        </h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">系统名称</label>
                                <input type="text" id="systemName" value="南丰蜜桔模型管理系统" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">系统版本</label>
                                <input type="text" id="systemVersion" value="v1.0.0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">系统域名</label>
                                <input type="text" id="systemDomain" value="https://model.nanfeng.gov.cn" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">系统Logo</label>
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                    </div>
                                    <button onclick="uploadLogo()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition">
                                        上传Logo
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            邮件配置
                        </h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">SMTP服务器</label>
                                <input type="text" id="smtpServer" value="smtp.qq.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">SMTP端口</label>
                                <input type="text" id="smtpPort" value="465" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">发件人邮箱</label>
                                <input type="text" id="mailFrom" value="notify@nanfeng.gov.cn" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">发件人名称</label>
                                <input type="text" value="南丰蜜桔模型系统" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">邮箱密码</label>
                                <input type="password" value="********" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">使用SSL</label>
                                <div class="flex items-center space-x-2">
                                    <input type="checkbox" checked class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                                    <span class="text-sm text-gray-600">启用SSL加密</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
                            数据配置
                        </h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">数据备份周期</label>
                                <select id="backupCycle" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                                    <option>每天</option>
                                    <option>每周</option>
                                    <option>每月</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">备份保留天数</label>
                                <input type="text" id="backupKeepDays" value="30" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">自动清理日志</label>
                                <div class="flex items-center space-x-2">
                                    <input type="checkbox" checked class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                                    <span class="text-sm text-gray-600">启用自动清理</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">日志保留天数</label>
                                <input type="text" value="90" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            系统信息
                        </h3>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">操作系统</span>
                            <span class="text-sm text-gray-800">Linux CentOS 7</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">Python版本</span>
                            <span class="text-sm text-gray-800">3.9.13</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">数据库</span>
                            <span class="text-sm text-gray-800">MySQL 8.0</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">服务器IP</span>
                            <span class="text-sm text-gray-800">192.168.1.100</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">运行时间</span>
                            <span class="text-sm text-gray-800">98天 12小时</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-500">最后更新</span>
                            <span class="text-sm text-gray-800">2026-07-22</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
                            存储信息
                        </h3>
                    </div>
                    <div class="p-4 space-y-3">
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm text-gray-500">磁盘使用</span>
                                <span class="text-sm text-gray-800">85% / 100GB</span>
                            </div>
                            <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div class="w-[85%] h-full bg-red-500 rounded-full"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm text-gray-500">内存使用</span>
                                <span class="text-sm text-gray-800">65% / 16GB</span>
                            </div>
                            <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div class="w-[65%] h-full bg-yellow-500 rounded-full"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm text-gray-500">CPU使用</span>
                                <span class="text-sm text-gray-800">28% / 8核</span>
                            </div>
                            <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div class="w-[28%] h-full bg-green-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            更新检查
                        </h3>
                    </div>
                    <div class="p-4">
                        <div class="text-center">
                            <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <p class="text-sm text-gray-800">当前版本已是最新</p>
                            <p class="text-xs text-gray-500 mt-1">版本号: v1.0.0</p>
                            <button onclick="checkUpdate()" class="mt-4 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition">
                                检查更新
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 保存确认弹窗 -->
    <div id="saveConfirmModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                    确认保存配置
                </h3>
                <button onclick="closeModal('saveConfirmModal')" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-600 mb-4">请确认以下配置信息无误，保存后将立即生效：</p>
                <div id="configSummary" class="bg-gray-50 rounded-lg p-4 space-y-2 text-sm"></div>
            </div>
            <div class="p-4 border-t border-gray-100 flex justify-end space-x-3">
                <button onclick="closeModal('saveConfirmModal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition">取消</button>
                <button onclick="confirmSave()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition">确认保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed top-6 right-6 hidden z-50">
        <div id="toastContent" class="flex items-center px-4 py-3 rounded-lg shadow-lg text-sm text-white"></div>
    </div>

    <!-- 隐藏的文件上传输入 -->
    <input type="file" id="logoFileInput" accept="image/*" class="hidden">

    <script>
        // 显示 Toast 提示
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const content = document.getElementById('toastContent');
            const colors = {
                success: 'bg-green-600',
                info: 'bg-blue-600',
                warning: 'bg-yellow-500',
                error: 'bg-red-600'
            };
            const icons = {
                success: 'material-symbols:check-circle',
                info: 'material-symbols:info',
                warning: 'material-symbols:warning',
                error: 'material-symbols:error'
            };
            content.className = 'flex items-center px-4 py-3 rounded-lg shadow-lg text-sm text-white ' + (colors[type] || colors.info);
            content.innerHTML = '<iconify-icon icon="' + (icons[type] || icons.info) + '" class="w-5 h-5 mr-2"></iconify-icon>' + message;
            toast.classList.remove('hidden');
            setTimeout(function() {
                toast.classList.add('hidden');
            }, 2500);
        }

        // 打开弹窗
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 关闭弹窗
        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 保存配置：弹出确认弹窗并显示配置摘要
        function saveConfig() {
            const summary = document.getElementById('configSummary');
            const getValue = function(id) {
                const el = document.getElementById(id);
                return el ? el.value : '';
            };
            summary.innerHTML =
                '<div class="flex justify-between"><span class="text-gray-500">系统名称</span><span class="text-gray-800 font-medium">' + getValue('systemName') + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-500">系统版本</span><span class="text-gray-800 font-medium">' + getValue('systemVersion') + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-500">系统域名</span><span class="text-gray-800 font-medium break-all">' + getValue('systemDomain') + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-500">SMTP服务器</span><span class="text-gray-800 font-medium">' + getValue('smtpServer') + ':' + getValue('smtpPort') + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-500">发件人邮箱</span><span class="text-gray-800 font-medium">' + getValue('mailFrom') + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-500">数据备份周期</span><span class="text-gray-800 font-medium">' + getValue('backupCycle') + '</span></div>' +
                '<div class="flex justify-between"><span class="text-gray-500">备份保留天数</span><span class="text-gray-800 font-medium">' + getValue('backupKeepDays') + ' 天</span></div>';
            openModal('saveConfirmModal');
        }

        // 确认保存：关闭弹窗并提示成功
        function confirmSave() {
            closeModal('saveConfirmModal');
            showToast('配置保存成功', 'success');
        }

        // 备份配置：弹出备份中提示
        function backupConfig() {
            showToast('正在备份配置，请稍候...', 'info');
            setTimeout(function() {
                showToast('配置备份已完成', 'success');
            }, 2000);
        }

        // 上传Logo：触发文件选择
        function uploadLogo() {
            const input = document.getElementById('logoFileInput');
            input.value = '';
            input.click();
        }

        // 文件选择后处理
        document.getElementById('logoFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('请选择图片文件', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
                const logoBox = document.querySelector('.w-12.h-12.bg-gray-100.rounded-lg');
                if (logoBox) {
                    logoBox.innerHTML = '<img src="' + ev.target.result + '" class="w-full h-full object-cover rounded-lg">';
                }
                showToast('Logo 上传成功', 'success');
            };
            reader.readAsDataURL(file);
        });

        // 检查更新：弹出检查中提示
        function checkUpdate() {
            showToast('正在检查更新...', 'info');
            setTimeout(function() {
                showToast('当前版本已是最新版本', 'success');
            }, 1500);
        }

        // 点击遮罩层关闭弹窗
        document.getElementById('saveConfirmModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal('saveConfirmModal');
            }
        });
    </script>
</body>
</html>
