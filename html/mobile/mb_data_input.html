<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 数据上报</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <link rel="stylesheet" href="css/mobile-tokens.css">
  <link rel="stylesheet" href="css/mobile-icons.css">
  <link rel="stylesheet" href="css/mobile-components.css">
  <link rel="stylesheet" href="css/mobile-ds-override.css">
  <link rel="stylesheet" href="css/mobile-form.css">
</head>
<body>
  <div class="mb-app loading">
    <div class="skeleton-state">
      <div class="page-header">
        <div class="mb-skeleton" style="width:120px;height:24px;"></div>
        <div class="mb-skeleton" style="width:200px;height:14px;margin-top:8px;"></div>
      </div>
      <div class="entry-card">
        <div class="mb-skeleton" style="width:40px;height:40px;border-radius:var(--radius-md);"></div>
        <div style="flex:1;">
          <div class="mb-skeleton" style="width:96px;height:16px;"></div>
          <div class="mb-skeleton" style="width:180px;height:12px;margin-top:8px;"></div>
        </div>
      </div>
      <div class="entry-card">
        <div class="mb-skeleton" style="width:40px;height:40px;border-radius:var(--radius-md);"></div>
        <div style="flex:1;">
          <div class="mb-skeleton" style="width:96px;height:16px;"></div>
          <div class="mb-skeleton" style="width:180px;height:12px;margin-top:8px;"></div>
        </div>
      </div>
      <div class="entry-card">
        <div class="mb-skeleton" style="width:40px;height:40px;border-radius:var(--radius-md);"></div>
        <div style="flex:1;">
          <div class="mb-skeleton" style="width:96px;height:16px;"></div>
          <div class="mb-skeleton" style="width:180px;height:12px;margin-top:8px;"></div>
        </div>
      </div>
      <div class="entry-card">
        <div class="mb-skeleton" style="width:40px;height:40px;border-radius:var(--radius-md);"></div>
        <div style="flex:1;">
          <div class="mb-skeleton" style="width:96px;height:16px;"></div>
          <div class="mb-skeleton" style="width:180px;height:12px;margin-top:8px;"></div>
        </div>
      </div>
    </div>

    <div class="real-content">
      <div class="page-header">
        <div class="header-back" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-title">数据上报</div>
        <div class="header-sub">记录果园各项数据信息</div>
      </div>

      <div class="entry-card type-farming" onclick="navigateTo('mb_input_farming.html')">
        <div class="entry-icon farming">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        </div>
        <div class="entry-main">
          <div class="entry-name">农事数据</div>
          <div class="entry-desc">记录施肥、灌溉、剪枝等农事操作</div>
        </div>
        <svg class="entry-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div class="entry-card type-disease" onclick="navigateTo('mb_input_disease.html')">
        <div class="entry-icon disease">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="entry-main">
          <div class="entry-name">病虫害数据</div>
          <div class="entry-desc">上报病虫害发生程度与处置情况</div>
        </div>
        <svg class="entry-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div class="entry-card type-weather" onclick="navigateTo('mb_input_weather.html')">
        <div class="entry-icon weather">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h2M20 12h2"/></svg>
        </div>
        <div class="entry-main">
          <div class="entry-name">气象数据</div>
          <div class="entry-desc">记录温度、降雨量与天气状况</div>
        </div>
        <svg class="entry-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div class="entry-card type-soil" onclick="navigateTo('mb_input_soil.html')">
        <div class="entry-icon soil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </div>
        <div class="entry-main">
          <div class="entry-name">土壤数据</div>
          <div class="entry-desc">记录土壤pH、有机质、氮磷钾与墒情</div>
        </div>
        <svg class="entry-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item active">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>监测</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_disease_knowledge.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>病虫害</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_profile.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    function goBack() { navigateTo('mb_home.html'); }

    function navigateTo(url) { window.location.href = url; }

    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() { app.classList.remove('loading'); }, 600);
    })();

    // 兼容旧链接（?tab=soil/weather/farming/disease/sales），直接跳转到对应的独立上报页
    (function() {
      var tabPageMap = {
        soil: 'mb_input_soil.html',
        weather: 'mb_input_weather.html',
        farming: 'mb_input_farming.html',
        disease: 'mb_input_disease.html',
        sales: 'mb_input_sales.html'
      };
      var tab = new URLSearchParams(window.location.search).get('tab');
      if (tab && tabPageMap[tab]) {
        window.location.replace(tabPageMap[tab]);
      }
    })();
  </script>
</body>
</html>
