            { id: 7, name: '东坪乡监测站', location: '东坪乡东坪村', moisture: 42, level: '正常', soilType: '砂壤土', ph: 6.7, organic: 2.3, nitrogen: 1.4, phosphorus: 0.9, potassium: 160, sampleTime: '2026-07-25 14:00:00', deviceId: 'SM-NF-007', status: '在线', manager: '吴国平', phone: '13879421007' },
            { id: 8, name: '莱溪乡监测站', location: '莱溪乡莱溪村', moisture: 38, level: '偏干', soilType: '壤土', ph: 6.3, organic: 2.0, nitrogen: 1.3, phosphorus: 0.7, potassium: 140, sampleTime: '2026-07-25 13:55:00', deviceId: 'SM-NF-008', status: '离线', manager: '赵长青', phone: '13879421008' },
            { id: 9, name: '太源乡监测站', location: '太源乡太源村', moisture: 50, level: '正常', soilType: '黏土', ph: 6.9, organic: 2.6, nitrogen: 1.6, phosphorus: 1.1, potassium: 190, sampleTime: '2026-07-25 13:50:00', deviceId: 'SM-NF-009', status: '在线', manager: '孙宝山', phone: '13879421009' },
            { id: 10, name: '傅坊乡监测站', location: '傅坊乡傅坊村', moisture: 25, level: '干旱', soilType: '砂土', ph: 7.2, organic: 1.5, nitrogen: 0.8, phosphorus: 0.5, potassium: 100, sampleTime: '2026-07-25 13:45:00', deviceId: 'SM-NF-010', status: '离线', manager: '周建辉', phone: '13879421010' },
            { id: 11, name: '紫霄镇监测站', location: '紫霄镇紫霄村', moisture: 58, level: '正常', soilType: '壤土', ph: 6.5, organic: 2.7, nitrogen: 1.9, phosphorus: 1.4, potassium: 210, sampleTime: '2026-07-25 13:40:00', deviceId: 'SM-NF-011', status: '在线', manager: '胡兴邦', phone: '13879421011' },
            { id: 12, name: '南丰县监测站', location: '南丰县琴城镇', moisture: 65, level: '偏湿', soilType: '砂壤土', ph: 6.6, organic: 2.9, nitrogen: 2.1, phosphorus: 1.6, potassium: 230, sampleTime: '2026-07-25 13:35:00', deviceId: 'SM-NF-012', status: '在线', manager: '徐龙华', phone: '13879421012' }
        ];

        let currentPage = 1;
        const pageSize = 10;
        let filteredStations = [...mockStations];

        function getLevelClass(level) {
            switch(level) {
                case '正常': return 'bg-green-100 text-green-700';
                case '偏干': return 'bg-yellow-100 text-yellow-700';
                case '干旱': return 'bg-red-100 text-red-700';
                case '偏湿': return 'bg-blue-100 text-blue-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('station-table-body');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const data = filteredStations.slice(start, end);

            tbody.innerHTML = data.map(station => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${station.name}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${station.location}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.deviceId}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">自动墒情站 SM-200</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.manager}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.phone}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${station.status === '在线' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${station.status}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <button onclick="viewStation(${station.id})" class="text-blue-600 hover:text-blue-900 mr-3">查看</button>
                        <button onclick="openEditModal(${station.id})" class="text-blue-600 hover:text-blue-900 mr-3">编辑</button>
                        <button onclick="openDataModal(${station.id})" class="text-cyan-600 hover:text-cyan-900 mr-3">数据查看</button>
                        <button onclick="deleteStation(${station.id})" class="text-red-600 hover:text-red-900">删除</button>
                    </td>
                </tr>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredStations.length / pageSize);
            document.getElementById('total-count').textContent = filteredStations.length;
            document.getElementById('page-info').textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredStations.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        function filterStations() {
            filteredStations = [...mockStations];
            currentPage = 1;
            renderTable();
        }

        function refreshData() {
            filteredStations = [...mockStations];
            currentPage = 1;
            renderTable();
        }

        function viewStation(id) {
            const station = mockStations.find(s => s.id === id);
            if (!station) return;

            document.getElementById('detail-name').textContent = station.name;
            document.getElementById('detail-location').textContent = station.location;
            document.getElementById('detail-device-id').textContent = station.deviceId;
            document.getElementById('detail-manager').textContent = station.manager;
            document.getElementById('detail-phone').textContent = station.phone;

            const statusEl = document.getElementById('detail-status');
            statusEl.textContent = station.status;
            statusEl.className = 'w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg text-sm font-semibold ' +
                (station.status === '在线' ? 'text-green-600' : 'text-red-600');

            document.getElementById('detail-modal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        function openDataModal(id) {
            const station = mockStations.find(s => s.id === id);
            if (!station) return;

            document.getElementById('data-station-name').textContent = station.name;

            const baseDate = new Date(station.sampleTime.replace(/-/g, '/'));
            const records = [];
            for (let i = 0; i < 20; i++) {
                const recordDate = new Date(baseDate.getTime() - i * 2 * 60 * 60 * 1000);
                const pad = n => String(n).padStart(2, '0');
                const sampleTime = `${recordDate.getFullYear()}-${pad(recordDate.getMonth() + 1)}-${pad(recordDate.getDate())} ${pad(recordDate.getHours())}:${pad(recordDate.getMinutes())}:${pad(recordDate.getSeconds())}`;

                const vary = (val, percent) => {
                    const factor = 1 + (Math.random() * 2 - 1) * percent / 100;
                    return val * factor;
                };

                const moisture = Math.round(vary(station.moisture, 20));
                const ph = parseFloat(vary(station.ph, 10).toFixed(2));
                const organic = parseFloat(vary(station.organic, 15).toFixed(2));
                const nitrogen = parseFloat(vary(station.nitrogen, 15).toFixed(2));
                const phosphorus = parseFloat(vary(station.phosphorus, 15).toFixed(2));
                const potassium = Math.round(vary(station.potassium, 15));

                let level = '正常';
                if (moisture < 30) level = '干旱';
                else if (moisture < 40) level = '偏干';
                else if (moisture > 65) level = '偏湿';

                records.push({ sampleTime, moisture, level, ph, organic, nitrogen, phosphorus, potassium });
            }

            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = records.map(r => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${r.sampleTime}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${r.moisture}%</td>
                    <td class="px-4 py-3 whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${getLevelClass(r.level)}">${r.level}</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${r.ph}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${r.organic}%</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${r.nitrogen}g/kg</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${r.phosphorus}g/kg</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${r.potassium}mg/kg</td>
                </tr>
            `).join('');

            document.getElementById('data-modal').classList.add('active');
        }

        function closeDataModal() {
            document.getElementById('data-modal').classList.remove('active');
        }

        function deleteStation(id) {
            if (!confirm('确定要删除该监测站点吗？')) return;

            const index = mockStations.findIndex(s => s.id === id);
            if (index === -1) return;

            mockStations.splice(index, 1);
            filteredStations = filteredStations.filter(s => s.id !== id);

            const totalPages = Math.ceil(filteredStations.length / pageSize);
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            } else if (totalPages === 0) {
                currentPage = 1;
            }

            renderTable();
            alert('监测站点已删除');
        }

        let currentEditStationId = null;

        function openEditModal(id) {
            const station = mockStations.find(s => s.id === id);
            if (!station) return;

            currentEditStationId = id;
            document.getElementById('edit-name').value = station.name;
            document.getElementById('edit-location').value = station.location;
            document.getElementById('edit-device-id').value = station.deviceId;
            document.getElementById('edit-status').value = station.status;
            document.getElementById('edit-manager').value = station.manager;
            document.getElementById('edit-phone').value = station.phone;

            document.getElementById('edit-modal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        function openAddModal() {
            document.getElementById('add-name').value = '';
            document.getElementById('add-location').value = '';
            document.getElementById('add-device-id').value = '';
            document.getElementById('add-status').value = '在线';
            document.getElementById('add-manager').value = '';
            document.getElementById('add-phone').value = '';
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        function saveAddModal() {
            const name = document.getElementById('add-name').value.trim();
            if (!name) {
                alert('请输入站点名称');
                return;
            }

            const newId = mockStations.length > 0 ? Math.max(...mockStations.map(s => s.id)) + 1 : 1;
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const sampleTime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const newStation = {
                id: newId,
                name: name,
                location: document.getElementById('add-location').value.trim(),
                soilType: '壤土',
                moisture: 45,
                level: '正常',
                ph: 6.5,
                organic: 2.0,
                nitrogen: 1.2,
                phosphorus: 0.8,
                potassium: 150,
                deviceId: document.getElementById('add-device-id').value.trim(),
                status: document.getElementById('add-status').value,
                manager: document.getElementById('add-manager').value.trim(),
                phone: document.getElementById('add-phone').value.trim(),
                sampleTime: sampleTime
            };

            mockStations.push(newStation);
            filteredStations = [...mockStations];
            currentPage = 1;
            closeAddModal();
            renderTable();
            alert('监测点已新增');
        }

        function saveEditModal() {
            const name = document.getElementById('edit-name').value.trim();
            if (!name) {
                alert('请输入站点名称');
                return;
            }

            const station = mockStations.find(s => s.id === currentEditStationId);
            if (!station) return;

            station.name = name;
            station.location = document.getElementById('edit-location').value.trim();
            station.deviceId = document.getElementById('edit-device-id').value.trim();
            station.status = document.getElementById('edit-status').value;
            station.manager = document.getElementById('edit-manager').value.trim();
            station.phone = document.getElementById('edit-phone').value.trim();

            closeEditModal();
            renderTable();
            alert('站点信息已保存');
        }

        window.addEventListener('load', () => {
            renderTable();
        });

        document.addEventListener('click', (e) => {
            const editModal = document.getElementById('edit-modal');
            const editBtn = e.target.closest('[onclick*="openEditModal"]');
            if (!editModal.contains(e.target) && !editBtn) {
                editModal.classList.remove('active');
            }
            const addModal = document.getElementById('add-modal');
            const addBtn = e.target.closest('[onclick*="openAddModal"]');
            if (!addModal.contains(e.target) && !addBtn) {
                addModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
