<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>桔农通 - 病虫害</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-content { padding-left: 44px; }
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }
    
    .header-actions {
      position: absolute;
      right: 12px;
      top: 44px;
    }
    
    .header-action-btn {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-action-btn svg { width: 18px; height: 18px; }

    .stats-bar {
      display: flex; gap: 8px;
      padding: 0 16px; margin-top: 12px;
      position: relative; z-index: 10;
    }
    
    .stat-card {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .stat-num {
      font-size: var(--font-lg); font-weight: 700;
    }
    
    .stat-num.danger { color: var(--error); }
    .stat-num.info { color: var(--info); }
    .stat-num.success { color: var(--success); }
    
    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .quick-actions {
      display: flex; gap: 12px;
      padding: 0 16px 16px;
    }
    
    .quick-action {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    
    .quick-action:active { transform: scale(0.96); }
    
    .quick-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
    }
    
    .quick-icon svg { width: 22px; height: 22px; }
    .quick-icon.red { background: var(--error-bg); color: var(--error); }
    .quick-icon.orange { background: var(--warning-bg); color: var(--warning); }
    .quick-icon.blue { background: var(--info-bg); color: var(--info); }
    .quick-icon.purple { background: var(--purple-bg); color: var(--purple); }
    
    .quick-name {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
    }

    .disease-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin: 0 16px 12px;
      padding: 16px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 16px;
    }
    
    .disease-card:active { transform: scale(0.99); }
    
    .disease-image {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    
    .disease-info { flex: 1; display: flex; flex-direction: column; }
    
    .disease-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .disease-name {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    
    .disease-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    
    .disease-dot.danger { background: var(--error); }
    .disease-dot.warning { background: var(--warning); }
    .disease-dot.info { background: var(--info); }
    
    .disease-status {
      font-size: var(--font-xs);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 500;
    }
    
    .disease-status.danger { background: var(--error-bg); color: var(--error); }
    .disease-status.warning { background: var(--warning-bg); color: var(--warning); }
    
    .disease-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
    }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <div class="skeleton-state">
      <div class="page-header">
        <div style="width:36px;height:36px;"></div>
        <div class="header-content">
          <div class="mb-skeleton" style="width:100px;height:20px;"></div>
          <div class="mb-skeleton" style="width:160px;height:14px;margin-top:6px;"></div>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-card"><div class="mb-skeleton" style="width:32px;height:24px;margin:0 auto;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:6px auto 0;"></div></div>
        <div class="stat-card"><div class="mb-skeleton" style="width:32px;height:24px;margin:0 auto;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:6px auto 0;"></div></div>
        <div class="stat-card"><div class="mb-skeleton" style="width:32px;height:24px;margin:0 auto;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:6px auto 0;"></div></div>
      </div>
      <div class="mb-body">
        <div class="mb-section">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:12px;"></div>
          <div class="quick-actions">
            <div class="quick-action"><div class="mb-skeleton" style="width:44px;height:44px;border-radius:var(--radius-lg);"></div><div class="mb-skeleton" style="width:32px;height:12px;margin-top:8px;"></div></div>
            <div class="quick-action"><div class="mb-skeleton" style="width:44px;height:44px;border-radius:var(--radius-lg);"></div><div class="mb-skeleton" style="width:32px;height:12px;margin-top:8px;"></div></div>
            <div class="quick-action"><div class="mb-skeleton" style="width:44px;height:44px;border-radius:var(--radius-lg);"></div><div class="mb-skeleton" style="width:32px;height:12px;margin-top:8px;"></div></div>
          </div>
        </div>
        <div class="mb-section">
          <div class="mb-skeleton" style="width:120px;height:16px;margin-bottom:12px;"></div>
          <div class="mb-skeleton-card"><div class="mb-skeleton-line long"></div><div class="mb-skeleton-line medium"></div></div>
          <div class="mb-skeleton-card"><div class="mb-skeleton-line long"></div><div class="mb-skeleton-line medium"></div></div>
        </div>
      </div>
    </div>

    <div class="real-content">
      <div class="page-header">
        <div class="header-back" onclick="navigateTo('mb_home.html')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-content">
          <div class="header-title">病虫害防治</div>
          <div class="header-sub">AI智能识别病虫害，科学防治保丰收</div>
        </div>
        <div class="header-actions">
          <div class="header-action-btn" onclick="navigateTo('mb_disease_ai.html')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-card"><div class="stat-num danger">8</div><div class="stat-label">病虫害种类</div></div>
        <div class="stat-card"><div class="stat-num info">3</div><div class="stat-label">高发预警</div></div>
        <div class="stat-card"><div class="stat-num success">12</div><div class="stat-label">防治方案</div></div>
      </div>

      <div class="mb-body">
        <div class="mb-section">
          <div class="mb-section-title"><span class="mb-section-dot"></span>防治功能</div>
          <div class="quick-actions">
            <div class="quick-action" onclick="navigateTo('mb_disease_ai.html')">
              <div class="quick-icon red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
                </svg>
              </div>
              <div class="quick-name">AI识别</div>
            </div>
            <div class="quick-action" onclick="navigateTo('mb_disease_knowledge.html')">
              <div class="quick-icon orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
              </div>
              <div class="quick-name">病虫害库</div>
            </div>
            <div class="quick-action" onclick="navigateTo('mb_disease_report.html')">
              <div class="quick-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
              </div>
              <div class="quick-name">预警上报</div>
            </div>
          </div>
        </div>

        <div class="mb-section">
          <div class="flex justify-between items-center mb-3 px-4">
            <div class="mb-section-title" style="margin-bottom:0;"><span class="mb-section-dot"></span>近期高发病虫害</div>
            <span class="text-xs text-secondary" onclick="navigateTo('mb_disease_knowledge.html')">查看全部 ›</span>
          </div>
          <div class="disease-card" onclick="navigateTo('mb_disease_knowledge.html')">
            <div class="img-wrapper loading" style="width:70px;height:70px;border-radius:var(--radius-md);">
              <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=红蜘蛛危害蜜桔叶片症状，叶片发白失绿&image_size=square_hd" alt="红蜘蛛" onload="this.parentElement.classList.remove('loading')" onerror="this.parentElement.classList.remove('loading');this.parentElement.classList.add('error')">
            </div>
            <div class="disease-info">
              <div class="disease-header">
                <div class="disease-name"><span class="disease-dot danger"></span>红蜘蛛</div>
                <span class="disease-status danger">高风险</span>
              </div>
              <div class="disease-desc">近期气温升高，红蜘蛛进入高发期。建议使用阿维菌素或螺螨酯进行防治。</div>
            </div>
          </div>
          <div class="disease-card" onclick="navigateTo('mb_disease_knowledge.html')">
            <div class="img-wrapper loading" style="width:70px;height:70px;border-radius:var(--radius-md);">
              <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=蚧壳虫危害蜜桔枝条症状，枝条上的褐色蚧壳&image_size=square_hd" alt="蚧壳虫" onload="this.parentElement.classList.remove('loading')" onerror="this.parentElement.classList.remove('loading');this.parentElement.classList.add('error')">
            </div>
            <div class="disease-info">
              <div class="disease-header">
                <div class="disease-name"><span class="disease-dot warning"></span>蚧壳虫</div>
                <span class="disease-status warning">中风险</span>
              </div>
              <div class="disease-desc">蚧壳虫开始活动，注意巡查枝叶交界处。可选用噻嗪酮或毒死蜱喷雾。</div>
            </div>
          </div>
          <div class="disease-card" onclick="navigateTo('mb_disease_knowledge.html')">
            <div class="img-wrapper loading" style="width:70px;height:70px;border-radius:var(--radius-md);">
              <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=炭疽病危害蜜桔叶片症状，叶片上红色斑点&image_size=square_hd" alt="炭疽病" onload="this.parentElement.classList.remove('loading')" onerror="this.parentElement.classList.remove('loading');this.parentElement.classList.add('error')">
            </div>
            <div class="disease-info">
              <div class="disease-header">
                <div class="disease-name"><span class="disease-dot warning"></span>炭疽病</div>
                <span class="disease-status warning">中风险</span>
              </div>
              <div class="disease-desc">高温高湿环境易引发炭疽病。建议喷施咪鲜胺或苯醚甲环唑预防。</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">首页</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_data.html')">监测</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_ai.html')">AI助手</div>
      <div class="mb-tab-item active">病虫害</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_profile.html')">我的</div>
    </div>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
</body>
</html>
