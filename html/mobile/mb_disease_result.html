<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 识别结果</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <link rel="stylesheet" href="css/mobile-tokens.css">
  <link rel="stylesheet" href="css/mobile-icons.css">
  <link rel="stylesheet" href="css/mobile-components.css">
  <link rel="stylesheet" href="css/mobile-ds-override.css">
  <link rel="stylesheet" href="css/detail-page.css">
  <style>
    /* 用户上传图片卡片隐藏（按需求移除） */
    .user-image-card,
    .user-image-label,
    .result-top-img-wrap,
    .result-top-img,
    .img-placeholder,
    .detect-box { display: none !important; }

    /* .top-back 已废弃，改用全局 .header-back */

    /* 白色卡片浮层（作为页面首个卡片，顶部 margin 适当加大） */
    .result-card {
      position: relative;
      margin: 16px 16px 0;
      background: #fff;
      border-radius: var(--radius-xl);
      padding: 18px 18px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      z-index: 4;
    }
    .result-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .result-card-edit {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .result-card-edit svg { width: 18px; height: 18px; }

    .result-card-main {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 0;
    }
    .result-thumb {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      border: 2px solid var(--error);
      object-fit: cover;
      flex-shrink: 0;
      background: #f0f0f0;
      display: block;
    }
    .result-meta {
      flex: 1;
      min-width: 0;
    }
    .result-meta-name {
      font-size: var(--font-xl);
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .result-meta-sim {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .result-meta-sim b {
      color: var(--error);
      font-weight: 700;
      font-size: var(--font-base);
    }

    /* 三张样例图：移出卡片，作为下方独立区块 */
    .ref-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 16px 0;
    }
    .ref-img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: #f0f0f0;
    }

    /* 信息列表 */
    .info-block {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin: 12px 16px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .info-row {
      display: flex;
      gap: 8px;
      padding: 10px 0;
      font-size: var(--font-sm);
      line-height: 1.7;
      border-bottom: 1px solid var(--border-light);
    }
    .info-row:last-child { border-bottom: none; }
    .info-key {
      flex-shrink: 0;
      min-width: 70px;
      color: var(--text);
      font-weight: 600;
    }
    .info-val {
      flex: 1;
      color: var(--text-secondary);
    }

    /* 更多介绍按钮 */
    .more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 12px 16px 16px;
      height: 48px;
      background: var(--bg-white);
      border-radius: var(--radius-md);
      font-size: var(--font-base);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .more-btn svg { width: 14px; height: 14px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 顶部 Header（白底 + 返回按钮 + 居中标题 + 居中副标题） -->
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">识别结果</div>
        <div class="header-sub">AI视觉分析已完成，请谨慎核对识别结果</div>
      </div>
    </div>

    <!-- 用户上传图片（独立卡片） -->
    <div class="user-image-card">
      <div class="user-image-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>用户上传图片</span>
      </div>
      <div class="result-top-img-wrap">
        <img class="result-top-img" id="topImg" alt="用户上传图片">
        <div class="img-placeholder" id="topImgPlaceholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
        <div class="detect-box b1"></div>
        <div class="detect-box b2"></div>
        <div class="detect-box b3"></div>
      </div>
    </div>

    <!-- 主结果卡片：缩略图 + 名称 + 相似度，独立下移到图片下方 -->
    <div class="result-card">
      <div class="result-card-head">
        <span>你要识别的可能是：</span>
        <div class="result-card-edit" onclick="recogAgain()" title="重新识别">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
      </div>
      <div class="result-card-main">
        <img class="result-thumb" id="resultThumb" alt="缩略图">
        <div class="result-meta">
          <div class="result-meta-name" id="resultName">柑橘黄龙病</div>
          <div class="result-meta-sim">相似度 <b id="resultSim">92%</b></div>
        </div>
      </div>
    </div>

    <!-- 三张样例图 -->
    <div class="ref-images" id="refImages"></div>

    <!-- 信息列表 -->
    <div class="info-block">
      <div class="info-row">
        <div class="info-key">名称：</div>
        <div class="info-val" id="infoName">-</div>
      </div>
      <div class="info-row">
        <div class="info-key">危害症状：</div>
        <div class="info-val" id="infoSymptom">-</div>
      </div>
      <div class="info-row">
        <div class="info-key">防治方案：</div>
        <div class="info-val" id="infoTreatment">-</div>
      </div>
      <div class="info-row">
        <div class="info-key">发生规律：</div>
        <div class="info-val" id="infoRule">-</div>
      </div>
      <div class="info-row">
        <div class="info-key">危害：</div>
        <div class="info-val" id="infoHarm">-</div>
      </div>
    </div>

    <!-- 更多介绍 -->
    <div class="more-btn" onclick="viewDetail()">
      更多介绍
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>

    <div style="height: 80px;"></div>

    <!-- 底部操作栏：再来一次（居中） -->
    <div class="detail-bottom-bar" style="justify-content: center;">
      <button class="detail-bottom-btn primary" onclick="recogAgain()" style="flex: 1; max-width: 320px;">
        再来一次
      </button>
    </div>
  </div>

  <script src="js/pest-risk-engine.js"></script>
  <script>
    // 病虫害详情映射
    var PEST_INFO = {
      '柑橘黄龙病': {
        symptom: '(1)叶片和枝梢：黄梢和斑驳是柑橘黄龙病的典型症状，叶片黄绿相间；(2)果实：果实变小、畸形、着色不均，出现"红鼻果"；(3)根部：根系腐烂，树势衰弱。',
        treatment: '加强检疫、种无病苗、防除木虱、挖除病树。幼树期重点监测，发现病株立即挖除烧毁并消毒土壤。',
        rule: '5月下旬开始发病，8～9月份最严重。春梢、夏梢、秋梢均可表现症状，通过柑桔木虱传播。',
        harm: '树体瘦弱，毁园。毁灭性病害，传播迅速，目前无有效治疗药剂。'
      },
      '红蜘蛛': {
        symptom: '(1)叶片出现灰白色小点，逐渐失绿；(2)严重时叶片苍白脱落；(3)果实表面出现褐色斑点；(4)叶片背面有白色丝网。',
        treatment: '春季螨类始发期喷第一次药，7-10天喷一次，连喷2-3次，重点喷叶片背面。后期用杀卵剂与杀成螨剂混用。',
        rule: '一年发生多代，4-5月和9-10月为高峰期。高温干旱时繁殖迅速。',
        harm: '导致叶片失绿、果实品质下降，严重时引起大量落叶落果。'
      }
    };

    // ========== 病虫害本地实景图（与 mb_disease_knowledge.html 共用 images 目录） ==========
    // 所有图片已下载到 images/ 目录，本地引用，0 网络依赖
    var PEST_ART = {
      '柑橘黄龙病': {
        main:    'images/disease_huanglongbing.jpg',
        thumb:   'images/disease_huanglongbing.jpg',
        samples: [
          'images/disease_huanglongbing.jpg',
          'images/disease_huanglongbing.jpg',
          'images/disease_huanglongbing.jpg'
        ]
      },
      '柑桔木虱': {
        main:    'images/pest_mushi.jpg',
        thumb:   'images/pest_mushi.jpg',
        samples: [
          'images/pest_mushi.jpg',
          'images/pest_mushi.jpg',
          'images/pest_mushi.jpg'
        ]
      },
      '疮痂病': {
        main:    'images/disease_chuangjia.jpg',
        thumb:   'images/disease_chuangjia.jpg',
        samples: [
          'images/disease_chuangjia.jpg',
          'images/disease_chuangjia.jpg',
          'images/disease_chuangjia.jpg'
        ]
      },
      '黑点病': {
        main:    'images/disease_heidian.jpg',
        thumb:   'images/disease_heidian.jpg',
        samples: [
          'images/disease_heidian.jpg',
          'images/disease_heidian.jpg',
          'images/disease_heidian.jpg'
        ]
      },
      '黑星病': {
        main:    'images/disease_heixing.jpg',
        thumb:   'images/disease_heixing.jpg',
        samples: [
          'images/disease_heixing.jpg',
          'images/disease_heixing.jpg',
          'images/disease_heixing.jpg'
        ]
      },
      '红蜘蛛': {
        main:    'images/pest_hongzhizhu.jpg',
        thumb:   'images/pest_hongzhizhu.jpg',
        samples: [
          'images/pest_hongzhizhu.jpg',
          'images/pest_hongzhizhu.jpg',
          'images/pest_hongzhizhu.jpg'
        ]
      },
      '蚧壳虫': {
        main:    'images/pest_jieke.jpg',
        thumb:   'images/pest_jieke.jpg',
        samples: [
          'images/pest_jieke.jpg',
          'images/pest_jieke.jpg',
          'images/pest_jieke.jpg'
        ]
      },
      '粉虱': {
        main:    'images/pest_fenshi.jpg',
        thumb:   'images/pest_fenshi.jpg',
        samples: [
          'images/pest_fenshi.jpg',
          'images/pest_fenshi.jpg',
          'images/pest_fenshi.jpg'
        ]
      }
    };

    // 通用兜底图（未在字典中的病虫害）
    var IMG_FALLBACK_MAIN  = 'images/disease_huanglongbing.jpg';
    var IMG_FALLBACK_THUMB = 'images/disease_huanglongbing.jpg';

    // 模拟识别结果 — 相似度在 75-82% 区间随机（更贴近真实识别精度，避免高得离谱）
    var RECOGNITION_RESULT = {
      top: { name: '柑橘黄龙病', confidence: 75 + Math.floor(Math.random() * 8) },
      info: PEST_INFO['柑橘黄龙病'],
      uploadTime: '2026-08-10 10:30'
    };

    function getQueryParam(name) {
      var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    }

    var topPest = getQueryParam('pest') || RECOGNITION_RESULT.top.name;

    function getArtFor(pestName) {
      return PEST_ART[pestName] || {
        main: IMG_FALLBACK_MAIN,
        thumb: IMG_FALLBACK_THUMB,
        samples: [IMG_FALLBACK_MAIN, IMG_FALLBACK_MAIN, IMG_FALLBACK_MAIN]
      };
    }

    function makeFallbackImg(label) {
      return IMG_BASE + encodeURIComponent(label) + SQ_HD;
    }

    function renderResult() {
      document.getElementById('resultName').textContent = topPest;
      document.getElementById('resultSim').textContent = RECOGNITION_RESULT.top.confidence + '%';

      var art = getArtFor(topPest);
      var placeholder = document.getElementById('topImgPlaceholder');
      placeholder.classList.remove('is-show');

      // 主图 / 缩略图 / 样例图 — 直接用 text_to_image URL（与 mb_disease_knowledge.html 同源）
      document.getElementById('resultThumb').src = art.thumb;

      var refHtml = '';
      art.samples.forEach(function(url) {
        refHtml += '<img class="ref-img" src="' + url + '" alt="">';
      });
      document.getElementById('refImages').innerHTML = refHtml;

      // 信息列表
      var info = RECOGNITION_RESULT.info || PEST_INFO[topPest] || {};
      document.getElementById('infoName').textContent = topPest;
      document.getElementById('infoSymptom').textContent = info.symptom || '-';
      document.getElementById('infoTreatment').textContent = info.treatment || '-';
      document.getElementById('infoRule').textContent = info.rule || '-';
      document.getElementById('infoHarm').textContent = info.harm || '-';
    }

    // 兜底占位图：生成 SVG data URI
    function makeFallbackImg(label) {
      var colors = ['#3a5a3e', '#5e8b3a', '#2c3e2e'];
      var c1 = colors[Math.floor(Math.random() * colors.length)];
      var c2 = '#1f2e22';
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="400" height="300" fill="url(#g)"/>' +
        '<text x="200" y="160" text-anchor="middle" fill="#fff" font-size="18" font-family="sans-serif" opacity="0.7">' + label + '</text>' +
        '</svg>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function viewDetail() {
      navigateTo('mb_disease_detail.html?pest=' + encodeURIComponent(topPest));
    }
    function recogAgain() {
      navigateTo('mb_disease_ai.html');
    }
    function goBack() { history.back(); }
    function goHome() { navigateTo('mb_home.html'); }
    function navigateTo(url) { window.location.href = url; }

    renderResult();
  </script>
</body>
</html>
