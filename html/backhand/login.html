<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 南丰蜜桔生长模型和病虫害模型管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #nf-orchard-login { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
        #nf-orchard-login * { box-sizing: border-box; }

        /* ========== 整页容器 ========== */
        .page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            border-radius: 0;
            color: #fff;
            background: #093f33 url('../dataanlye/images/login_bg_source.jpg') center/cover no-repeat;
        }
        /* 暗角：源网页精确参数（仅水平方向） */
        .shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                rgba(1,28,23,0.12) 0%,
                rgba(1,28,23,0.12) 41%,
                rgba(2,30,24,0.74) 63%,
                rgba(1,20,17,0.94) 100%);
        }

        /* ========== 顶部栏 ========== */
        .top {
            position: relative;
            z-index: 1;
            height: 78px;
            margin: 0 6%;
            border-bottom: 1px solid rgba(255,255,255,0.32);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: 1.5px;
        }
        .top-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .nf-mark {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255,255,255,0.76);
            border-radius: 50%;
            position: relative;
        }
        .nf-mark:after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ed991c;
            border-radius: 50%;
            left: 9px;
            top: 9px;
        }

        /* ========== 右侧登录面板 ========== */
        .panel {
            z-index: 1;
            position: relative;
            margin-left: auto;
            width: 46%;
            min-width: 460px;
            padding: 62px 12% 56px 7.2%;
            min-height: calc(100vh - 78px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .overline {
            font-size: 11px;
            color: #eeb35c;
            letter-spacing: 4px;
            margin-bottom: 17px;
        }
        .brand-title {
            font-family: Georgia, "Microsoft YaHei", serif;
            font-weight: 500;
            font-size: 55px;
            letter-spacing: 3px;
            line-height: 1.1;
            margin: 0;
            color: #fff;
        }
        .brand-title .sub {
            display: block;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 9px;
            margin-top: 15px;
        }
        .rule {
            width: 58px;
            height: 2px;
            background: #efaa44;
            margin: 29px 0 24px;
        }

        /* ========== 登录表单 ========== */
        .enter {
            font-size: 13px;
            letter-spacing: 2px;
            margin: 0 0 17px;
            color: rgba(255,255,255,0.86);
        }
        .form-label {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            display: block;
            margin: 13px 0 7px;
        }
        .form-input {
            height: 44px;
            width: 100%;
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,0.46);
            color: #fff;
            background: rgba(255,255,255,0.06);
            outline: 0;
            padding: 0 13px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.55); }
        .form-input:focus { border-bottom-color: rgba(255,255,255,0.85); }
        .pwd-wrap { position: relative; }
        .toggle-pwd {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.55);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
        }
        .toggle-pwd:hover { color: #f6bb60; }

        /* 选项行 */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin: 18px 0 25px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .remember-me input { accent-color: #ed991c; cursor: pointer; }
        .forgot-link {
            color: #f6bb60;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }

        /* 登录按钮 */
        .login-btn {
            height: 50px;
            border: 1px solid #ef9d28;
            background: #ed981f;
            color: #fff;
            width: 100%;
            font-size: 14px;
            letter-spacing: 8px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .login-btn:hover {
            background: #d9881a;
            box-shadow: 0 4px 14px rgba(237,152,31,0.35);
        }
        .login-btn:active { background: #c47a14; }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* ========== 版权 ========== */
        .foot {
            position: absolute;
            z-index: 1;
            left: 6%;
            bottom: 24px;
            font-size: 11px;
            color: rgba(255,255,255,0.62);
            letter-spacing: 1px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 10000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            animation: toastIn 0.3s ease;
        }
        .toast.success { background: #ed981f; }
        .toast.error { background: #f56c6c; }
        .toast.info { background: #409eff; }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* ========== 响应式（沿用源网页断点） ========== */
        @media (max-width: 760px) {
            .top { margin: 0 28px; }
            .top span:last-child { display: none; }
            .page { min-height: 720px; }
            .shade { background: rgba(1,23,18,0.66); }
            .panel {
                margin: 0;
                width: auto;
                min-width: 0;
                padding: 80px 36px 65px;
                min-height: 642px;
            }
            .brand-title { font-size: 44px; }
            .foot { left: 28px; }
        }
    </style>
</head>
<body>
    <div id="nf-orchard-login">
        <section class="page" aria-label="南丰蜜桔生长模型和病虫害模型管理系统登录页">
            <div class="shade"></div>

            <!-- 顶部栏：左 logo+品牌名，右 位置 -->
            <header class="top">
                <div class="top-brand">
                    <span class="nf-mark" aria-hidden="true"></span>
                    <span>南丰蜜桔生长模型和病虫害模型管理系统</span>
                </div>
                <span>中国 · 江西 · 抚州 · 南丰</span>
            </header>

            <!-- 右侧登录面板 -->
            <main class="panel">
                <div class="overline">NANFENG MANDARIN</div>
                <h1 class="brand-title">南丰蜜桔<span class="sub">生长模型和病虫害模型管理系统</span></h1>
                <div class="rule"></div>

                <p class="enter">登录入口</p>

                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <label class="form-label" for="account">账号</label>
                    <input id="account" class="form-input" placeholder="请输入账号" autocomplete="username" autofocus>

                    <label class="form-label" for="password">密码</label>
                    <div class="pwd-wrap">
                        <input id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" type="password">
                        <button type="button" class="toggle-pwd" onclick="togglePassword()" aria-label="显示/隐藏密码">👁</button>
                    </div>

                    <div class="actions">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>记住登录状态</span>
                        </label>
                        <a class="forgot-link" href="#" onclick="showToast('请联系管理员重置密码', 'info'); return false;">忘记密码</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">登 录</button>
                </form>
            </main>

            <div class="foot">© 2023-2026 江西省抚州市南丰县农业农村局</div>
        </section>
    </div>

    <script>
        (function() {
            var remembered = localStorage.getItem('nf_username');
            if (remembered) {
                document.getElementById('account').value = remembered;
                document.getElementById('remember').checked = true;
            }
        })();

        function togglePassword() {
            var pwd = document.getElementById('password');
            var btn = document.querySelector('.toggle-pwd');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁';
            }
        }

        function showToast(message, type) {
            type = type || 'success';
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }

        function handleLogin(e) {
            e.preventDefault();
            var username = document.getElementById('account').value.trim();
            var password = document.getElementById('password').value.trim();
            var remember = document.getElementById('remember').checked;
            var btn = document.getElementById('loginBtn');

            if (!username) {
                showToast('请输入账号', 'error');
                document.getElementById('account').focus();
                return false;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                document.getElementById('password').focus();
                return false;
            }

            btn.disabled = true;
            btn.innerHTML = '登录中...';

            setTimeout(function() {
                if (remember) {
                    localStorage.setItem('nf_username', username);
                } else {
                    localStorage.removeItem('nf_username');
                }
                showToast('登录成功，正在跳转...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 800);
            }, 600);

            return false;
        }
    </script>
</body>
</html>
