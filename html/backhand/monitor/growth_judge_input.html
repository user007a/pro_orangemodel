<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植株指标数据录入 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">植株指标数据录入</h1>
                <p class="text-gray-500 mt-1">填写当期果园与植株指标</p>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-sm text-gray-500">评价日期</span>
                <span class="text-sm font-medium text-gray-800">2026-07-27</span>
            </div>
        </div>

        <div class="bg-gradient-to-r from-green-800 to-green-700 rounded-xl p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div>
                        <h3 class="text-lg font-semibold text-white">填写当期果园与植株指标</h3>
                        <p class="text-green-100 text-sm mt-1">带"核心"的指标建议由传感器自动同步，其余可按巡园或抽样结果填写。</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-white text-sm">数据完整度</span>
                    <div class="w-32 h-2 bg-green-900/50 rounded-full overflow-hidden">
                        <div class="w-full h-full bg-yellow-400 rounded-full"></div>
                    </div>
                    <span class="text-yellow-400 font-bold text-lg">100%</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center">
                        <span class="text-gray-600 font-semibold">Ⅰ</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">评价对象</h3>
                        <p class="text-gray-500 text-sm">用于匹配品系、砧木、树龄和生育阶段参数</p>
                    </div>
                </div>
                <button class="text-xs px-3 py-1 bg-gray-100 text-gray-600 rounded-full hover:bg-gray-200">建档数据</button>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">果园主体</label>
                    <input type="text" value="南丰蜜桔示范园 01" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">地块</label>
                    <input type="text" value="东坡 A-03 地块" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">品系 / 株系</label>
                    <input type="text" value="品系 A" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">砧木</label>
                    <input type="text" value="枳砧" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">树龄</label>
                    <div class="flex items-center">
                        <input type="number" value="6" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">年</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">生育阶段</label>
                    <select class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <option value="幼苗期">幼苗期</option>
                        <option value="生长期">生长期</option>
                        <option value="开花期">开花期</option>
                        <option value="果实膨大期" selected>果实膨大期</option>
                        <option value="成熟期">成熟期</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center">
                        <span class="text-gray-600 font-semibold">Ⅱ</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">环境与土壤</h3>
                        <p class="text-gray-500 text-sm">温度为模型硬阈值，水分、光照和土壤用于综合扣分</p>
                    </div>
                </div>
                <button class="text-xs px-3 py-1 bg-green-100 text-green-700 rounded-full flex items-center">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full mr-1"></span>核心数据
                </button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1 flex items-center">空气温度 <span class="ml-1 px-1.5 py-0.5 bg-green-100 text-green-700 text-xs rounded">核心</span></label>
                    <div class="flex items-center">
                        <input type="number" value="32" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">°C</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1 flex items-center">空气湿度 <span class="ml-1 px-1.5 py-0.5 bg-green-100 text-green-700 text-xs rounded">核心</span></label>
                    <div class="flex items-center">
                        <input type="number" value="82" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">%</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1 flex items-center">土壤含水量 <span class="ml-1 px-1.5 py-0.5 bg-green-100 text-green-700 text-xs rounded">核心</span></label>
                    <div class="flex items-center">
                        <input type="number" value="78" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">%</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1 flex items-center">光照适宜度 <span class="ml-1 px-1.5 py-0.5 bg-green-100 text-green-700 text-xs rounded">核心</span></label>
                    <div class="flex items-center">
                        <input type="number" value="68" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">土壤 pH</label>
                    <input type="number" step="0.1" value="5.3" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">土壤 EC</label>
                    <div class="flex items-center">
                        <input type="number" step="0.01" value="0.72" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">mS/cm</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">钾营养适宜度</label>
                    <div class="flex items-center">
                        <input type="number" value="72" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center">
                        <span class="text-gray-600 font-semibold">Ⅲ</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">植株与果实</h3>
                        <p class="text-gray-500 text-sm">请填写代表性株株或地块抽样平均值</p>
                    </div>
                </div>
                <button class="text-xs px-3 py-1 bg-blue-100 text-blue-700 rounded-full">巡园 / 抽样</button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">整体树势</label>
                    <div class="flex items-center">
                        <input type="number" value="86" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">新梢状态</label>
                    <div class="flex items-center">
                        <input type="number" value="82" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">叶片状态</label>
                    <div class="flex items-center">
                        <input type="number" value="78" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">叶片 SPAD</label>
                    <input type="number" value="36" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">根系活力</label>
                    <div class="flex items-center">
                        <input type="number" value="68" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">挂果负载</label>
                    <div class="flex items-center">
                        <input type="number" value="118" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">%目标值</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">坐果率</label>
                    <div class="flex items-center">
                        <input type="number" value="84" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">%</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">落果率</label>
                    <div class="flex items-center">
                        <input type="number" value="9" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">%</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">平均果径</label>
                    <div class="flex items-center">
                        <input type="number" step="0.1" value="48.6" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">mm</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">当前糖度</label>
                    <div class="flex items-center">
                        <input type="number" step="0.1" value="9.4" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">°Brix</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">果实外观</label>
                    <div class="flex items-center">
                        <input type="number" value="88" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">病虫健康度</label>
                    <div class="flex items-center">
                        <input type="number" value="92" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                        <span class="ml-2 text-sm text-gray-500">/100</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center">
                        <span class="text-gray-600 font-semibold">Ⅳ</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">近期农事记录</h3>
                        <p class="text-gray-500 text-sm">帮助模型判断问题是环境、营养还是管理造成</p>
                    </div>
                </div>
                <button class="text-xs px-3 py-1 bg-gray-100 text-gray-600 rounded-full">人工记录</button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">近期灌溉</label>
                    <input type="text" value="近3日灌溉1次" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">近期施肥</label>
                    <input type="text" value="10天前施用高钾水溶肥" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end space-x-4">
            <button onclick="resetMockData()" class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 text-sm font-medium transition-colors">
                恢复模拟数据
            </button>
            <button onclick="runEvaluation()" class="px-8 py-2.5 bg-orange-500 text-white rounded-lg hover:bg-orange-600 text-sm font-medium transition-colors flex items-center">
                <span>运行综合评价</span>
                <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </button>
        </div>
    </div>

    <script>
        const mockData = {
            '果园主体': '南丰蜜桔示范园 01',
            '地块': '东坡 A-03 地块',
            '品系 / 株系': '品系 A',
            '砧木': '枳砧',
            '树龄': '6',
            '生育阶段': '果实膨大期',
            '空气温度': '32',
            '空气湿度': '82',
            '土壤含水量': '78',
            '光照适宜度': '68',
            '土壤 pH': '5.3',
            '土壤 EC': '0.72',
            '钾营养适宜度': '72',
            '整体树势': '86',
            '新梢状态': '82',
            '叶片状态': '78',
            '叶片 SPAD': '36',
            '根系活力': '68',
            '挂果负载': '118',
            '坐果率': '84',
            '落果率': '9',
            '平均果径': '48.6',
            '当前糖度': '9.4',
            '果实外观': '88',
            '病虫健康度': '92',
            '近期灌溉': '近3日灌溉1次',
            '近期施肥': '10天前施用高钾水溶肥'
        };

        function resetMockData() {
            Object.keys(mockData).forEach(key => {
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    if (input.value !== mockData[key]) {
                        input.value = mockData[key];
                    }
                });
            });
            alert('模拟数据已恢复');
        }

        function runEvaluation() {
            try {
                if (window.top && typeof window.top.openPage === 'function') {
                    window.top.openPage('monitor/growth_judge_result.html', '', null);
                } else if (window.parent && typeof window.parent.openPage === 'function') {
                    window.parent.openPage('monitor/growth_judge_result.html', '', null);
                } else {
                    window.location.href = 'growth_judge_result.html';
                }
            } catch (e) {
                console.error('runEvaluation error:', e);
                window.location.href = 'growth_judge_result.html';
            }
        }
    </script>
</body>
</html>
