<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 南丰蜜桔模型管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            min-height: 100vh;
            background: url('../dataanlye/images/Aerial_view_of_a_lush_green_ap_2026-05-20T10-52-24.png') center/cover no-repeat fixed;
            background-color: #7a4a20;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(180,105,30,0.60) 0%, rgba(200,120,40,0.50) 40%, rgba(160,85,20,0.55) 70%, rgba(120,60,15,0.65) 100%);
            z-index: 1;
        }

        /* ========== 左侧品牌内容 ========== */
        .brand-area {
            position: fixed;
            top: 0; left: 0;
            width: 55%;
            height: 100vh;
            z-index: 2;
            padding: 0 56px 36px;
            display: flex;
            flex-direction: column;
            color: white;
        }
        .brand-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(245,158,11,0.4);
        }
        .brand-logo svg { width: 22px; height: 22px; }
        .brand-title-wrap { line-height: 1.25; }
        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .brand-en {
            font-size: 11px;
            color: rgba(255,255,255,0.65);
            letter-spacing: 2.5px;
            margin-top: 3px;
        }

        .brand-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            line-height: 1.7;
            margin-bottom: 32px;
            max-width: 360px;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            color: rgba(255,255,255,0.9);
        }
        .feature-icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            flex-shrink: 0;
            background: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
        }

        .brand-footer {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.3px;
        }

        /* ========== 右侧登录卡片 ========== */
        .login-area {
            position: fixed;
            top: 0; right: 0;
            width: 45%;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .login-card {
            width: 360px;
            background: white;
            border-radius: 14px;
            padding: 32px 28px 24px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.2);
        }
        .login-card-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 4px 14px rgba(234,88,12,0.35);
        }
        .login-card-logo svg { width: 24px; height: 24px; }

        .welcome-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
            pointer-events: none;
        }
        .input-field {
            width: 100%;
            height: 42px;
            padding: 0 38px 0 36px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            background: white;
            color: #1e293b;
        }
        .input-field::placeholder { color: #94a3b8; font-size: 14px; }
        .input-field:focus {
            border-color: #EA580C;
            box-shadow: 0 0 0 2px rgba(234,88,12,0.08);
        }
        .toggle-pwd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px;
        }
        .toggle-pwd:hover { color: #475569; }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #64748b;
            cursor: pointer;
            user-select: none;
        }
        .remember-me input { cursor: pointer; accent-color: #EA580C; }
        .forgot-link {
            color: #EA580C;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 12px;
        }
        .forgot-link:hover { color: #C2410C; text-decoration: underline; }

        .login-btn {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(234,88,12,0.3);
            letter-spacing: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(234,88,12,0.4);
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.7;
        }
        .login-footer .platform { color: #64748b; }
        .login-footer .tech { color: #94a3b8; margin-top: 1px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: toastIn 0.3s ease;
        }
        .toast.success { background: #EA580C; }
        .toast.error { background: #f56c6c; }
        .toast.info { background: #409eff; }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Responsive */
        @media (max-width: 960px) {
            .brand-area { display: none; }
            .login-area {
                width: 100%;
                position: relative;
                width: 100%;
                height: 100vh;
            }
        }
        @media (max-width: 480px) {
            .login-card { padding: 24px 20px 20px; width: 100%; }
            .welcome-title { font-size: 16px; }
        }
    </style>
</head>
<body>
    <!-- 左侧品牌内容 -->
    <div class="brand-area">
        <div class="brand-main">
            <div class="brand-header">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="white">
                        <circle cx="12" cy="13" r="8"/>
                        <ellipse cx="12" cy="5" rx="2.5" ry="1.2" fill="#22c55e"/>
                        <path d="M12 5 Q12 2 14 2 Q13 4 12 5" fill="#16a34a"/>
                    </svg>
                </div>
                <div class="brand-title-wrap">
                    <div class="brand-title">南丰蜜桔模型管理系统</div>
                    <div class="brand-en">NANFENG MANDARIN</div>
                </div>
            </div>

            <div class="brand-desc">
                围绕南丰蜜桔品质改造、品种改良、精准作业、提质增效全流程，以模型驱动果园数字化管理，助力蜜桔产业高质量发展。
            </div>

            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="12" height="12"><circle cx="12" cy="13" r="6"/><path d="M12 7 Q12 4 14 4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
                    </div>
                    <span>模型精准辅助生长，科学指导生产管理</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="12" height="12"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <span>防控病虫害，保障蜜桔健康生长</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="12" height="12"><path d="M4 4h16v12H4zM2 20h20v2H2z"/></svg>
                    </div>
                    <span>智能设备实时监控，数据全面感知</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="12" height="12"><path d="M3 17l6-6 4 4 8-8v5h2V3h-7v2h4l-7 7-4-4-7 7z"/></svg>
                    </div>
                    <span>提质增效，提升蜜桔产业综合效益</span>
                </div>
            </div>
        </div>

        <div class="brand-footer">
            © 2026 南丰蜜桔模型管理系统版权所有 保留所有权利
        </div>
    </div>

    <!-- 右侧登录卡片 -->
    <div class="login-area">
        <div class="login-card">
            <div class="login-card-logo">
                <svg viewBox="0 0 24 24" fill="white">
                    <circle cx="12" cy="13" r="8"/>
                    <ellipse cx="12" cy="5" rx="2.5" ry="1.2" fill="#16a34a"/>
                    <path d="M12 5 Q12 2 14 2 Q13 4 12 5" fill="#15803d"/>
                </svg>
            </div>
            <div class="welcome-title">欢迎登录</div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="input-group">
                    <label class="input-label">用户名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="input-field" placeholder="请输入用户名" autocomplete="username" autofocus>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="input-field" placeholder="请输入密码" autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePassword()" aria-label="显示/隐藏密码">
                            <i class="fas fa-eye" id="pwdIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>记住密码</span>
                    </label>
                    <a class="forgot-link" onclick="showToast('请联系系统管理员重置密码', 'info')">忘记密码？</a>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span>登 录</span>
                </button>
            </form>

            <div class="login-footer">
                <div class="platform">南丰蜜桔模型管理平台</div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var pwd = document.getElementById('password');
            var icon = document.getElementById('pwdIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showToast(message, type) {
            type = type || 'success';
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var iconMap = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };
            toast.innerHTML = '<i class="fas ' + (iconMap[type] || iconMap.info) + '"></i><span>' + message + '</span>';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }

        function handleLogin(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var btn = document.getElementById('loginBtn');

            if (!username) {
                showToast('请输入用户名', 'error');
                document.getElementById('username').focus();
                return false;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                document.getElementById('password').focus();
                return false;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>登录中...</span>';

            setTimeout(function() {
                showToast('登录成功，正在跳转...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 800);
            }, 600);

            return false;
        }
    </script>
</body>
</html>
