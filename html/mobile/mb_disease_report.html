<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>桔农通 - 预警上报</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-content { padding-left: 44px; }
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }

    .card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .card-title svg { width: 18px; height: 18px; color: var(--primary); }

    .form-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }
    
    .form-item:last-child { border-bottom: none; }
    
    .form-label { font-size: var(--font-base); color: var(--text); }
    .form-value { font-size: var(--font-base); color: var(--text-secondary); }
    .form-value.selected { color: var(--text); }
    
    .form-select {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--bg);
      border-radius: var(--radius-md);
    }
    
    .form-select svg { width: 16px; height: 16px; color: var(--text-light); }

    .level-options { display: flex; gap: var(--space-3); }
    .level-option {
      flex: 1;
      padding: var(--space-3);
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .level-option.active { border-color: var(--primary); background: var(--primary-light); }
    .level-option .level-name { font-size: var(--font-base); font-weight: 600; color: var(--text); }
    .level-option .level-desc { font-size: var(--font-xs); color: var(--text-secondary); margin-top: var(--space-1); }

    .radio-options { display: flex; gap: var(--space-3); }
    .radio-option {
      flex: 1;
      padding: var(--space-3);
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .radio-option.active { border-color: var(--primary); background: var(--primary-light); }
    .radio-option span { font-size: var(--font-base); font-weight: 500; color: var(--text); }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }
    
    .photo-item {
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .photo-item:active { transform: scale(0.95); }
    .photo-item svg { width: 24px; height: 24px; color: var(--text-light); }
    
    .textarea-box {
      width: 100%;
      height: 120px;
      padding: var(--space-3);
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      font-size: var(--font-base);
      color: var(--text);
      resize: none;
      outline: none;
    }
    
    .textarea-box:focus { border-color: var(--primary); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1000;
      display: none; justify-content: center; align-items: center;
    }
    
    .modal-overlay.show { display: flex; }
    
    .modal-box {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 360px;
      max-height: 70vh;
      overflow: hidden;
    }
    
    .modal-header {
      padding: var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .modal-title { font-size: var(--font-lg); font-weight: 600; color: var(--text); }
    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-md);
      background: var(--gray-100);
    }
    
    .modal-close svg { width: 18px; height: 18px; color: var(--text-secondary); }
    
    .modal-body { padding: var(--space-4); max-height: 50vh; overflow-y: auto; }
    
    .modal-item {
      padding: var(--space-3);
      border-radius: var(--radius-md);
      background: var(--bg);
      margin-bottom: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .modal-item:active { background: var(--gray-100); }
    .modal-item span { font-size: var(--font-base); color: var(--text); }
    
    .modal-footer {
      padding: var(--space-4);
      border-top: 1px solid var(--border);
    }
    
    .success-modal {
      text-align: center;
      padding: var(--space-8) var(--space-6);
    }
    
    .success-icon {
      width: 64px; height: 64px;
      margin: 0 auto var(--space-4);
      border-radius: 50%;
      background: var(--success-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .success-icon svg { width: 32px; height: 32px; color: var(--success); }
    
    .success-title { font-size: var(--font-lg); font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
    .success-desc { font-size: var(--font-sm); color: var(--text-secondary); }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <!-- ===================== 骨架屏 ===================== -->
    <div class="skeleton-state">
      <div class="page-header">
        <div class="header-nav">
          <div style="width:36px;height:36px;"></div>
          <div class="header-title"></div>
        </div>
      </div>
      <div class="mb-section">
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line long"></div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div style="display:flex;gap:12px;">
            <div class="mb-skeleton" style="flex:1;height:60px;border-radius:8px;"></div>
            <div class="mb-skeleton" style="flex:1;height:60px;border-radius:8px;"></div>
            <div class="mb-skeleton" style="flex:1;height:60px;border-radius:8px;"></div>
          </div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton" style="width:100%;height:120px;border-radius:8px;"></div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton" style="width:100%;height:48px;border-radius:24px;"></div>
      </div>
    </div>

    <!-- ===================== 真实内容 ===================== -->
    <div class="real-content">
      <!-- Header -->
      <div class="page-header">
        <div class="header-back" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-content">
          <div class="header-title">预警上报</div>
          <div class="header-sub">发现病虫害，及时上报处理</div>
        </div>
      </div>

      <div class="mb-section">
        <!-- 基本信息 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            基本信息
          </div>
          
          <div class="form-item" onclick="showTypeSelect()">
            <div class="form-label">病虫害类型</div>
            <div class="form-select">
              <span class="form-value" id="diseaseType">请选择</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>

          <div class="form-item" onclick="showLocationSelect()">
            <div class="form-label">发生地块</div>
            <div class="form-select">
              <span class="form-value" id="location">请选择</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>

          <div class="form-item">
            <div class="form-label">发生日期</div>
            <div class="form-value" id="reportDate">2026-07-23</div>
          </div>
        </div>

        <!-- 发生程度 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            发生程度
          </div>
          <div class="level-options">
            <div class="level-option" id="level-light" onclick="selectLevel('light')">
              <div class="level-name">轻度</div>
              <div class="level-desc">零星发生</div>
            </div>
            <div class="level-option" id="level-medium" onclick="selectLevel('medium')">
              <div class="level-name">中度</div>
              <div class="level-desc">部分发生</div>
            </div>
            <div class="level-option" id="level-heavy" onclick="selectLevel('heavy')">
              <div class="level-name">重度</div>
              <div class="level-desc">大面积发生</div>
            </div>
          </div>
        </div>

        <!-- 现场照片 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            现场照片
          </div>
          <div class="photo-grid">
            <div class="photo-item" onclick="uploadPhoto()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </div>
            <div class="photo-item" onclick="selectPhoto()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
          </div>
        </div>

        <!-- 处置情况 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            处置情况
          </div>
          <div class="radio-options">
            <div class="radio-option" id="disposed-no" onclick="selectDisposed('no')">
              <span>未处置</span>
            </div>
            <div class="radio-option" id="disposed-yes" onclick="selectDisposed('yes')">
              <span>已处置</span>
            </div>
          </div>
          
          <div id="disposalMethod" style="display:none; margin-top: var(--space-3);">
            <div class="form-item" onclick="showMethodSelect()">
              <div class="form-label">处置方式</div>
              <div class="form-select">
                <span class="form-value" id="methodValue">请选择</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </div>
            </div>
          </div>
          
          <div id="disposalNote" style="display:none; margin-top: var(--space-3);">
            <div class="form-label" style="margin-bottom: var(--space-2);">处置备注</div>
            <textarea class="textarea-box" placeholder="请描述具体的处置措施..."></textarea>
          </div>
        </div>

        <!-- 备注信息 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            备注信息
          </div>
          <textarea class="textarea-box" placeholder="请描述病虫害发生情况，如症状表现、发生范围等..."></textarea>
        </div>

        <!-- 提交按钮 -->
        <button class="mb-btn mb-btn-primary mb-btn-block" onclick="submitReport()">
          提交上报
        </button>
      </div>
    </div><!-- /real-content -->

    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">首页</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_data.html')">监测</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_ai.html')">AI助手</div>
      <div class="mb-tab-item active" onclick="navigateTo('mb_disease.html')">病虫害</div>
      <div class="mb-tab-item" onclick="navigateTo('mb_profile.html')">我的</div>
    </div>
  </div>

  <!-- 病虫害类型选择 -->
  <div class="modal-overlay" id="typeModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">选择病虫害类型</div>
        <div class="modal-close" onclick="closeModal('typeModal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
      </div>
      <div class="modal-body">
        <div style="font-size: var(--font-sm); font-weight: 600; color: var(--text-secondary); margin-bottom: var(--space-2);">病害</div>
        <div class="modal-item" onclick="selectType('黄龙病')"><span>黄龙病</span></div>
        <div class="modal-item" onclick="selectType('黑点病')"><span>黑点病</span></div>
        <div class="modal-item" onclick="selectType('疮痂病')"><span>疮痂病</span></div>
        <div class="modal-item" onclick="selectType('炭疽病')"><span>炭疽病</span></div>
        <div style="font-size: var(--font-sm); font-weight: 600; color: var(--text-secondary); margin: var(--space-3) 0 var(--space-2);">虫害</div>
        <div class="modal-item" onclick="selectType('红蜘蛛')"><span>红蜘蛛</span></div>
        <div class="modal-item" onclick="selectType('蚧壳虫')"><span>蚧壳虫</span></div>
        <div class="modal-item" onclick="selectType('木虱')"><span>木虱</span></div>
        <div class="modal-item" onclick="selectType('蚜虫')"><span>蚜虫</span></div>
      </div>
    </div>
  </div>

  <!-- 地块选择 -->
  <div class="modal-overlay" id="locationModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">选择地块</div>
        <div class="modal-close" onclick="closeModal('locationModal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-item" onclick="selectLocation('1号早熟蜜桔区')"><span>1号早熟蜜桔区</span></div>
        <div class="modal-item" onclick="selectLocation('2号中熟蜜桔区')"><span>2号中熟蜜桔区</span></div>
        <div class="modal-item" onclick="selectLocation('3号晚熟蜜桔区')"><span>3号晚熟蜜桔区</span></div>
        <div class="modal-item" onclick="selectLocation('4号试验田')"><span>4号试验田</span></div>
      </div>
    </div>
  </div>

  <!-- 处置方式选择 -->
  <div class="modal-overlay" id="methodModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">选择处置方式</div>
        <div class="modal-close" onclick="closeModal('methodModal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-item" onclick="selectMethod('化学防治')"><span>化学防治</span></div>
        <div class="modal-item" onclick="selectMethod('生物防治')"><span>生物防治</span></div>
        <div class="modal-item" onclick="selectMethod('物理防治')"><span>物理防治</span></div>
        <div class="modal-item" onclick="selectMethod('农业防治')"><span>农业防治</span></div>
        <div class="modal-item" onclick="selectMethod('综合防治')"><span>综合防治</span></div>
      </div>
    </div>
  </div>

  <!-- 成功提示 -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-box">
      <div class="success-modal">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="success-title">上报成功</div>
        <div class="success-desc">预警信息已提交，农技人员将尽快处理</div>
      </div>
      <div class="modal-footer">
        <button class="mb-btn mb-btn-primary mb-btn-block" onclick="closeModal('successModal'); window.history.back();">确定</button>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function showTypeSelect() {
      document.getElementById('typeModal').classList.add('show');
    }

    function selectType(type) {
      var el = document.getElementById('diseaseType');
      el.textContent = type;
      el.classList.add('selected');
      closeModal('typeModal');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function selectLevel(level) {
      ['light', 'medium', 'heavy'].forEach(l => {
        const el = document.getElementById('level-' + l);
        el.classList.remove('active');
      });
      document.getElementById('level-' + level).classList.add('active');
    }

    function showLocationSelect() {
      document.getElementById('locationModal').classList.add('show');
    }

    function selectLocation(loc) {
      var el = document.getElementById('location');
      el.textContent = loc;
      el.classList.add('selected');
      closeModal('locationModal');
    }

    function uploadPhoto() {
      var grid = document.querySelector('.photo-grid');
      var photo = document.createElement('div');
      photo.className = 'photo-item';
      photo.style.background = 'linear-gradient(135deg, #ffebee, #ffcdd2)';
      photo.style.backgroundSize = 'cover';
      photo.style.backgroundPosition = 'center';
      photo.style.display = 'flex';
      photo.style.alignItems = 'center';
      photo.style.justifyContent = 'center';
      photo.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#e57373" stroke-width="1.5" style="width: 24px; height: 24px; opacity: 0.5;"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>';
      grid.insertBefore(photo, grid.lastElementChild);
    }

    function selectPhoto() {
      var grid = document.querySelector('.photo-grid');
      var photo = document.createElement('div');
      photo.className = 'photo-item';
      photo.style.background = 'linear-gradient(135deg, #fff3e0, #ffe0b2)';
      photo.style.backgroundSize = 'cover';
      photo.style.backgroundPosition = 'center';
      photo.style.display = 'flex';
      photo.style.alignItems = 'center';
      photo.style.justifyContent = 'center';
      photo.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffb74d" stroke-width="1.5" style="width: 24px; height: 24px; opacity: 0.5;"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>';
      grid.insertBefore(photo, grid.lastElementChild);
    }

    function selectDisposed(val) {
      ['yes', 'no'].forEach(v => {
        const el = document.getElementById('disposed-' + v);
        el.classList.remove('active');
      });
      document.getElementById('disposed-' + val).classList.add('active');
      const show = val === 'yes';
      document.getElementById('disposalMethod').style.display = show ? 'block' : 'none';
      document.getElementById('disposalNote').style.display = show ? 'block' : 'none';
    }

    function showMethodSelect() {
      document.getElementById('methodModal').classList.add('show');
    }

    function selectMethod(method) {
      var el = document.getElementById('methodValue');
      el.textContent = method;
      el.classList.add('selected');
      closeModal('methodModal');
    }

    function submitReport() {
      var type = document.getElementById('diseaseType').textContent;
      if (type === '请选择') {
        alert('请选择病虫害类型');
        return;
      }
      document.getElementById('successModal').classList.add('show');
    }

    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
</body>
</html>
