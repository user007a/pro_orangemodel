<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南丰蜜桔产业模型平台</title><style>:root{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:#f9f7ed;background:#0a241d}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input{font:inherit}.login-page{min-height:100vh;position:relative;isolation:isolate;overflow:hidden;background:#0a241d url("login_assets/nanfen-orchard-login.png") center/cover no-repeat}.orchard-overlay{position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,rgba(4,37,29,.04),rgba(4,37,29,.06) 47%,rgba(3,39,31,.61) 61%,rgba(1,24,19,.93))}.site-header{height:70px;position:absolute;top:0;left:5%;right:5%;display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid rgba(255,255,255,.24)}.location{color:rgba(255,255,255,.76);font-size:13px;letter-spacing:2px}.login-panel{width:min(392px,34vw);min-width:350px;position:absolute;top:50%;right:10.5%;transform:translateY(-47%)}.title-block h1{margin:0;color:#f3c36c;font-family:"STKaiti","KaiTi",serif;font-size:clamp(54px,4.6vw,80px);font-weight:400;letter-spacing:5px;line-height:1.05;white-space:nowrap}.title-block p{margin:16px 0 0;color:#f6f2e8;font-family:"STKaiti","KaiTi",serif;font-size:clamp(27px,2vw,36px);letter-spacing:9px;white-space:nowrap}.accent-line{width:100%;height:2px;margin:40px 0 30px;background:#e8b55a}.entry-label{margin:0 0 42px;font-family:"STKaiti","KaiTi",serif;font-size:26px;letter-spacing:3px}form{display:grid;gap:10px}form>label{font-size:15px;letter-spacing:1px;margin-top:8px}input[type=text],input[type=password],input:not([type]){width:100%;height:51px;padding:0 15px;border:1px solid rgba(232,245,235,.47);border-radius:5px;outline:0;color:#fff;background:rgba(6,44,35,.46)}input::placeholder{color:rgba(238,243,235,.57)}input:focus{border-color:#efb75d;background:rgba(6,44,35,.66)}.password-field{position:relative}.password-field input{padding-right:64px}.password-toggle,.forgot{padding:0;border:0;color:#f1c167;background:transparent;cursor:pointer}.password-toggle{position:absolute;top:0;right:15px;height:51px;font-size:13px}.form-options{display:flex;justify-content:space-between;align-items:center;margin:22px 0 26px;color:rgba(255,255,255,.88);font-size:14px}.remember-option{display:inline-flex;align-items:center;gap:9px;cursor:pointer}.remember-option input{width:19px;height:19px;margin:0;accent-color:#e99a27}.submit{height:60px;border:0;border-radius:8px;cursor:pointer;color:#fff;background:#ef9826;box-shadow:0 12px 25px rgba(0,0,0,.2);font-size:18px;letter-spacing:12px}.submit:hover{background:#f5a838}.form-status{min-height:20px;margin:12px 0 0;color:#f3cf8a;font-size:13px;text-align:center}footer{position:absolute;left:5%;bottom:31px;color:rgba(255,255,255,.75);font-size:13px;letter-spacing:1px}@media(max-width:820px){.login-page{background-position:38% center}.orchard-overlay{background:rgba(1,28,21,.68)}.site-header{left:28px;right:28px}.login-panel{width:auto;min-width:0;left:28px;right:28px;top:54%;transform:translateY(-50%)}.title-block h1{font-size:55px}.title-block p{font-size:28px}.accent-line{margin:28px 0 24px}.entry-label{margin-bottom:28px}footer{left:28px;bottom:22px}}</style></head><body><main class="login-page"><div class="orchard-overlay"></div><header class="site-header"><span class="location">中国 · 江西 · 南丰</span></header><section class="login-panel"><div class="title-block"><h1>南丰蜜桔</h1><p>产业模型平台</p></div><div class="accent-line"></div><p class="entry-label">登录入口</p><form id="login-form"><label for="account">账号</label><input id="account" placeholder="请输入账号" autocomplete="username"><label for="password">密码</label><div class="password-field"><input id="password" placeholder="请输入密码" type="password" autocomplete="current-password"><button class="password-toggle" type="button" id="toggle">显示</button></div><div class="form-options"><label class="remember-option"><input type="checkbox"><span>记住登录状态</span></label><button type="button" class="forgot" id="forgot">忘记密码</button></div><button class="submit" type="submit">登 录</button><p class="form-status" id="status"></p></form></section><footer>© 2026 南丰县农业农村局</footer></main><script>const p=document.getElementById('password'),s=document.getElementById('status');document.getElementById('toggle').onclick=()=>{p.type=p.type==='password'?'text':'password';document.getElementById('toggle').textContent=p.type==='password'?'显示':'隐藏'};document.getElementById('forgot').onclick=()=>s.textContent='请联系平台管理员重置密码';document.getElementById('login-form').onsubmit=e=>{e.preventDefault();if(!account.value.trim()||!p.value){s.textContent='请输入账号和密码';return}s.textContent='登录信息已提交，正在进入平台…';setTimeout(()=>location.href='index.html',500)}</script></body></html>
