<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 价格指数</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .page-header {
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 20px;
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      position: relative;
    }

    .header-back {
      position: absolute;
      left: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .header-back svg { width: 18px; height: 18px; }

    .header-title {
      font-size: var(--font-xl);
      font-weight: var(--font-bold);
      margin-bottom: 4px;
    }

    .header-sub {
      font-size: var(--font-sm);
      opacity: 0.85;
    }

    .search-bar {
      background: var(--bg-white);
      margin: 12px 16px;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      position: relative;
    }

    .search-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      border-right: 1px solid var(--border-light);
      cursor: pointer;
    }

    .search-item:last-child {
      border-right: none;
    }

    .search-item svg {
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .search-text {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      flex: 1;
    }

    .search-arrow {
      width: 12px;
      height: 12px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: transform var(--transition-fast);
    }

    .search-item.open .search-arrow {
      transform: rotate(180deg);
    }

    .variety-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      padding: 6px;
      display: none;
      z-index: 20;
    }

    .variety-dropdown.show {
      display: block;
    }

    .variety-option {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .variety-option:hover {
      background: var(--gray-50);
    }

    .variety-option.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: var(--font-medium);
    }

    .variety-option .check {
      width: 16px;
      height: 16px;
      color: var(--primary);
      display: none;
    }

    .variety-option.active .check {
      display: block;
    }

    .category-tabs {
      display: flex;
      gap: 6px;
      padding: 0 16px 12px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .category-tab {
      padding: 6px 16px;
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      color: var(--text-secondary);
      background: var(--bg-white);
      border-radius: var(--radius-full);
      cursor: pointer;
      border: 1px solid var(--border);
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .category-tab.active {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      border-color: transparent;
    }

    .price-summary {
      background: var(--bg-white);
      margin: 0 16px 12px;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .price-date {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .price-alert {
      display: inline-block;
      font-size: var(--font-xs);
      padding: 2px 8px;
      background: var(--warning-light);
      color: var(--warning-dark);
      border-radius: var(--radius-sm);
      margin-left: 8px;
      font-weight: var(--font-medium);
    }

    .price-info {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .price-item {
      flex: 1;
    }

    .price-label {
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }

    .price-value {
      font-size: var(--font-lg);
      font-weight: var(--font-extrabold);
      font-family: var(--font-family-number);
    }

    .price-value.min { color: var(--error); }
    .price-value.avg { color: var(--text); }
    .price-value.max { color: var(--success); }

    .price-unit {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      font-weight: var(--font-normal);
    }

    .chart-section {
      background: var(--bg-white);
      margin: 0 16px 12px;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .chart-title {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .chart-container {
      height: 160px;
      position: relative;
    }

    .chart-y-axis {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 20px;
      width: 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chart-y-label {
      font-size: 10px;
      color: var(--text-tertiary);
      text-align: right;
      padding-right: 4px;
    }

    .chart-area {
      margin-left: 35px;
      height: 100%;
      position: relative;
    }

    .chart-grid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chart-grid-line {
      height: 1px;
      background: var(--border-light);
    }

    .chart-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 20px;
    }

    .chart-line {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }

    .chart-line.high { stroke: var(--success); }
    .chart-line.avg { stroke: var(--primary); }
    .chart-line.low { stroke: var(--error); }

    .chart-tooltip {
      position: absolute;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: var(--font-xs);
      color: var(--text);
      pointer-events: none;
      z-index: 100;
      display: none;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }

    .chart-tooltip.show {
      display: block;
    }

    .chart-tooltip-date {
      font-weight: var(--font-semibold);
      margin-bottom: 4px;
    }

    .chart-tooltip-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }

    .chart-tooltip-item:last-child {
      margin-bottom: 0;
    }

    .chart-tooltip-label {
      color: var(--text-secondary);
    }

    .chart-tooltip-value {
      font-weight: var(--font-semibold);
    }

    .chart-points {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    .chart-point {
      position: absolute;
      top: 0;
      width: 16px;
      height: 100%;
      margin-left: -8px;
      pointer-events: auto;
      cursor: pointer;
    }

    .chart-point:hover {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }

    .chart-x-axis {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20px;
      display: flex;
      justify-content: space-between;
    }

    .chart-x-label {
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .legend-dot.high { background: var(--success); }
    .legend-dot.avg { background: var(--primary); }
    .legend-dot.low { background: var(--error); }

    .price-list-section {
      background: var(--bg-white);
      margin: 0 16px;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .list-title {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .list-header {
      display: flex;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .list-header .col-1 { flex: 2; }
    .list-header .col-2 { flex: 2; text-align: center; }
    .list-header .col-3 { flex: 1; text-align: right; }

    .list-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item .col-1 { flex: 2; }
    .list-item .col-2 { flex: 2; text-align: center; }
    .list-item .col-3 { flex: 1; text-align: right; }

    .fruit-name {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
    }

    .market-name {
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .market-cell {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .price-cell {
      font-size: var(--font-md);
      font-weight: var(--font-bold);
      color: var(--primary);
      font-family: var(--font-family-number);
    }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>

          { date: '07-01', high: 25.5, avg: 20.8, low: 16.0 },

        ],
        markets: [

          { fruit: '石门蜜桔', origin: '河南郑州市场', market: '河南郑州市...', price: 18.80 },
          { fruit: '石门蜜桔', origin: '上海农产品市场', market: '上海农产品...', price: 21.50 },
          { fruit: '石门蜜桔', origin: '广东广州市场', market: '广东广州市...', price: 24.00 }
        ]
      },
      'yongquan': {
        name: '涌泉蜜桔',
        today: { min: 18.40, avg: 28.80, max: 42.00 },
        trend: [
          { date: '06-15', high: 38.0, avg: 31.0, low: 24.5 },
          { date: '06-18', high: 37.5, avg: 30.5, low: 24.0 },
          { date: '06-21', high: 39.2, avg: 32.0, low: 25.4 },
          { date: '06-24', high: 40.0, avg: 32.8, low: 26.0 },
          { date: '06-27', high: 40.8, avg: 33.4, low: 26.6 },
          { date: '07-01', high: 39.5, avg: 32.2, low: 25.4 },
          { date: '07-04', high: 38.0, avg: 30.8, low: 24.0 },
          { date: '07-07', high: 38.6, avg: 31.4, low: 24.6 }
        ],
        markets: [
          { fruit: '涌泉蜜桔', origin: '浙江涌泉市场', market: '浙江涌泉市...', price: 22.50 },
          { fruit: '涌泉蜜桔', origin: '上海农产品市场', market: '上海农产品...', price: 28.80 },
          { fruit: '涌泉蜜桔', origin: '江苏苏州市场', market: '江苏苏州市...', price: 32.00 },
          { fruit: '涌泉蜜桔', origin: '北京新发地市场', market: '北京新发地...', price: 36.50 },
          { fruit: '涌泉蜜桔', origin: '广东深圳市场', market: '广东深圳市...', price: 40.00 }
        ]
      }
    };

    var varietyKeys = ['nanfeng', 'huangyan', 'shimen', 'yongquan'];
    var currentVariety = 'nanfeng';
    var chartData = varietyData[currentVariety].trend;

    // 构建品种下拉
    function buildVarietyDropdown() {
      var dd = document.getElementById('varietyDropdown');
      var html = '';
      varietyKeys.forEach(function(key) {
        var v = varietyData[key];
        html += '<div class="variety-option' + (key === currentVariety ? ' active' : '') +
                '" data-key="' + key + '" onclick="selectVariety(\'' + key + '\', event)">' +
                '<span>' + v.name + '</span>' +
                '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                '</div>';
      });
      dd.innerHTML = html;
    }

    function openVarietyDropdown() {
      document.getElementById('varietyDropdown').classList.add('show');
      document.getElementById('varietyTrigger').classList.add('open');
    }

    function closeVarietyDropdown() {
      var dd = document.getElementById('varietyDropdown');
      var trigger = document.getElementById('varietyTrigger');
      if (dd) dd.classList.remove('show');
      if (trigger) trigger.classList.remove('open');
    }

    function toggleVarietyDropdown(e) {
      if (e) { e.stopPropagation(); }
      var dd = document.getElementById('varietyDropdown');
      if (dd.classList.contains('show')) {
        closeVarietyDropdown();
      } else {
        openVarietyDropdown();
      }
    }

    function selectVariety(key, e) {
      if (e) { e.stopPropagation(); }
      currentVariety = key;
      document.getElementById('varietyLabel').textContent = varietyData[key].name;
      buildVarietyDropdown();
      renderAll();
      closeVarietyDropdown();
    }

    document.addEventListener('click', function(e) {
      var trigger = document.getElementById('varietyTrigger');
      var dd = document.getElementById('varietyDropdown');
      if (trigger && dd && !trigger.contains(e.target) && !dd.contains(e.target)) {
        closeVarietyDropdown();
      }
    });

    // 渲染当日价格
    function renderTodayPrice() {
      var d = varietyData[currentVariety].today;
      document.getElementById('priceMin').innerHTML = d.min.toFixed(2) + '<span class="price-unit">元/公斤</span>';
      document.getElementById('priceAvg').innerHTML = d.avg.toFixed(2) + '<span class="price-unit">元/公斤</span>';
      document.getElementById('priceMax').innerHTML = d.max.toFixed(2) + '<span class="price-unit">元/公斤</span>';
    }

    // 渲染近8天图表
    function buildLinePath(values, min, max) {
      var W = 280, H = 140, padTop = 10, padBottom = 20;
      var range = max - min || 1;
      var stepX = W / (values.length - 1);
      var points = values.map(function(v, i) {
        var x = i * stepX;
        var y = padTop + (1 - (v - min) / range) * (H - padTop - padBottom);
        return [x, y];
      });
      var d = 'M' + points[0][0].toFixed(1) + ',' + points[0][1].toFixed(1);
      for (var i = 1; i < points.length; i++) {
        var prev = points[i - 1];
        var curr = points[i];
        var cx = (prev[0] + curr[0]) / 2;
        d += ' Q' + cx.toFixed(1) + ',' + prev[1].toFixed(1) + ' ' + cx.toFixed(1) + ',' + ((prev[1] + curr[1]) / 2).toFixed(1);
        d += ' T' + curr[0].toFixed(1) + ',' + curr[1].toFixed(1);
      }
      return d;
    }

    function renderChart() {
      var highs = chartData.map(function(d) { return d.high; });
      var avgs = chartData.map(function(d) { return d.avg; });
      var lows = chartData.map(function(d) { return d.low; });
      var allVals = highs.concat(avgs).concat(lows);
      var minV = Math.min.apply(null, allVals);
      var maxV = Math.max.apply(null, allVals);
      var step = Math.max(1, Math.ceil((maxV - minV) / 5));
      minV = Math.floor((minV - step) / step) * step;
      maxV = Math.ceil((maxV + step) / step) * step;
      if (minV < 0) minV = 0;

      // Y 轴
      var yHtml = '';
      var ticks = 5;
      for (var i = 0; i <= ticks; i++) {
        var v = maxV - (i * (maxV - minV) / ticks);
        yHtml += '<span class="chart-y-label">' + v.toFixed(0) + '</span>';
      }
      document.getElementById('chartYAxis').innerHTML = yHtml;

      // X 轴
      var xHtml = '';
      chartData.forEach(function(d) {
        xHtml += '<span class="chart-x-label">' + d.date + '</span>';
      });
      document.getElementById('chartXAxis').innerHTML = xHtml;

      // 折线
      document.getElementById('lineHigh').setAttribute('d', buildLinePath(highs, minV, maxV));
      document.getElementById('lineAvg').setAttribute('d', buildLinePath(avgs, minV, maxV));
      document.getElementById('lineLow').setAttribute('d', buildLinePath(lows, minV, maxV));

      // 交互点
      var container = document.getElementById('chartPoints');
      container.innerHTML = '';
      chartData.forEach(function(item, index) {
        var x = (index / (chartData.length - 1)) * 100;
        var point = document.createElement('div');
        point.className = 'chart-point';
        point.style.left = x + '%';
        point.setAttribute('data-index', index);
        point.addEventListener('mouseenter', function(e) { showTooltip(index, e); });
        point.addEventListener('mouseleave', hideTooltip);
        container.appendChild(point);
      });
    }

    // 渲染价格列表
    function renderPriceList() {
      var list = document.getElementById('priceList');
      var html = '';
      varietyData[currentVariety].markets.forEach(function(m) {
        html += '<div class="list-item">' +
                  '<div class="col-1">' +
                    '<div class="fruit-name">' + m.fruit + '</div>' +
                    '<div class="market-name">' + m.origin + '</div>' +
                  '</div>' +
                  '<div class="col-2"><span class="market-cell">' + m.market + '</span></div>' +
                  '<div class="col-3"><span class="price-cell">' + m.price.toFixed(2) + '</span></div>' +
                '</div>';
      });
      list.innerHTML = html;
    }

    function renderAll() {
      chartData = varietyData[currentVariety].trend;
      renderTodayPrice();
      renderChart();
      renderPriceList();
    }

    function showTooltip(index, event) {
      var data = chartData[index];
      var tooltip = document.getElementById('chartTooltip');
      document.getElementById('tooltipDate').textContent = data.date;
      document.getElementById('tooltipHigh').textContent = data.high.toFixed(2) + ' 元/公斤';
      document.getElementById('tooltipAvg').textContent = data.avg.toFixed(2) + ' 元/公斤';
      document.getElementById('tooltipLow').textContent = data.low.toFixed(2) + ' 元/公斤';
      tooltip.classList.add('show');
      var rect = event.currentTarget.getBoundingClientRect();
      var containerRect = document.querySelector('.chart-content').getBoundingClientRect();
      tooltip.style.left = (rect.left - containerRect.left + rect.width / 2 - 60) + 'px';
      tooltip.style.top = (rect.top - containerRect.top - 80) + 'px';
    }

    function hideTooltip() {
      document.getElementById('chartTooltip').classList.remove('show');
    }

    buildVarietyDropdown();
    renderAll();

    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
