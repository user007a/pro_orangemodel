<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蜜桔农业助手 - 价格指数</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <link rel="stylesheet" href="css/mobile-tokens.css">
  <link rel="stylesheet" href="css/mobile-icons.css">
  <link rel="stylesheet" href="css/mobile-components.css">
  <link rel="stylesheet" href="css/mobile-ds-override.css">
  <style>
    /* ============================================================
       页面基础
       ============================================================ */
    body { background: var(--bg-page); }
    .real-content { padding-bottom: 96px; }

    /* ============================================================
       Header（白底沉浸 + 返回）
       ============================================================ */
    .page-header {
      background: #FFFFFF !important;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 32px !important;
      color: var(--text-primary) !important;
      border-radius: 0 0 var(--radius-xl) var(--radius-xl) !important;
      border-bottom: none !important;
      position: relative !important;
      box-shadow: var(--shadow-sm);
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      text-align: center !important;
      height: auto !important;
      min-height: 80px !important;
    }
    .header-back {
      position: absolute;
      left: 14px;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      width: 36px;
      height: 36px;
      background: transparent;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background var(--transition-fast);
    }
    .header-back:active { background: var(--border-light); }
    .header-back svg { width: 18px; height: 18px; }
    .header-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
      text-align: center;
    }
    .header-sub {
      font-size: 13px;
      color: var(--text-tertiary);
      text-align: center;
    }

    /* ============================================================
       筛选器（市场 / 品类）
       ============================================================ */
    .search-bar {
      margin: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .search-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .search-label {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      flex-shrink: 0;
      width: 48px;
    }
    .search-value-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-item.open .search-value-wrap {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 2px rgba(46,139,87,0.08);
    }
    .search-text {
      font-size: 15px;
      color: var(--text-secondary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-arrow {
      width: 14px;
      height: 14px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: transform var(--transition-fast);
    }
    .search-item.open .search-arrow { transform: rotate(180deg); }

    .market-dropdown,
    .variety-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-light);
      padding: 6px;
      display: none;
      z-index: 20;
      max-height: 240px;
      overflow-y: auto;
    }
    .market-dropdown.show,
    .variety-dropdown.show { display: block; }

    .variety-option,
    .market-option {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 15px;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background var(--transition-fast);
    }
    .market-option:hover,
    .variety-option:hover { background: var(--bg-page); }
    .market-option.active,
    .variety-option.active {
      background: var(--brand-primary-light);
      color: var(--brand-primary);
      font-weight: 600;
    }
    .market-option .check,
    .variety-option .check {
      width: 16px;
      height: 16px;
      color: var(--brand-primary);
      display: none;
    }
    .market-option.active .check,
    .variety-option.active .check { display: block; }

    /* ============================================================
       价格摘要卡
       ============================================================ */
    .price-summary {
      background: var(--bg-card);
      margin: 0 16px 14px;
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .price-date {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .price-date .date-text {
      font-weight: 700;
      color: var(--text-primary);
      font-size: 17px;
      letter-spacing: 0.2px;
    }
    .price-alert {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      padding: 4px 12px;
      background: var(--brand-primary-light);
      color: var(--brand-primary);
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--brand-primary);
      transition: all var(--transition-fast);
    }
    .price-alert:active { background: var(--brand-primary); color: #fff; }

    .price-info {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .price-item { flex: 1; }
    .price-label {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .price-value {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-family-number, inherit);
      line-height: 1.2;
      letter-spacing: -0.3px;
    }
    .price-value.min   { color: var(--danger); }
    .price-value.avg   { color: var(--text-primary); }
    .price-value.max   { color: var(--success); }
    .price-value.change { color: var(--success); }
    .price-value.change.down { color: var(--danger); }
    .price-unit {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-left: 2px;
    }

    /* ============================================================
       图表卡
       ============================================================ */
    .chart-section {
      background: var(--bg-card);
      margin: 0 16px 14px;
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .chart-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .chart-unit {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 12px;
      display: block;
    }
    .chart-container { height: 180px; position: relative; }
    .chart-y-axis {
      position: absolute;
      left: 0; top: 0; bottom: 24px;
      width: 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .chart-y-label {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: right;
      padding-right: 6px;
    }
    .chart-area { margin-left: 42px; height: 100%; position: relative; }
    .chart-grid {
      position: absolute; top: 0; left: 0; right: 0; bottom: 24px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .chart-grid-line {
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--border-light) 0, var(--border-light) 4px, transparent 4px, transparent 8px);
    }
    .chart-content {
      position: absolute; top: 0; left: 0; right: 0; bottom: 24px;
    }
    .chart-line {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }
    .chart-line.high { stroke: var(--danger); }
    .chart-line.avg  { stroke: #F39C12; }
    .chart-line.low  { stroke: var(--brand-primary); }
    .chart-dot-group { pointer-events: none; }
    .chart-dot {
      fill: #fff;
      stroke-width: 2;
    }
    .chart-dot.high { stroke: var(--danger); }
    .chart-dot.avg  { stroke: #F39C12; }
    .chart-dot.low  { stroke: var(--brand-primary); }

    .chart-tooltip {
      position: absolute;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-primary);
      pointer-events: none;
      z-index: 100;
      display: none;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }
    .chart-tooltip.show { display: block; }
    .chart-tooltip-date { font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .chart-tooltip-item {
      display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px;
    }
    .chart-tooltip-item:last-child { margin-bottom: 0; }
    .chart-tooltip-label { color: var(--text-secondary); }
    .chart-tooltip-value { font-weight: 600; }

    .chart-points {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .chart-point {
      position: absolute; top: 0;
      width: 16px; height: 100%;
      margin-left: -8px;
      pointer-events: auto;
      cursor: pointer;
    }
    .chart-point:hover {
      background: rgba(0,0,0,0.04);
      border-radius: 8px;
    }
    .chart-x-axis {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 24px;
      display: flex; justify-content: space-between;
    }
    .chart-x-label { font-size: 11px; color: var(--text-tertiary); }
    .chart-legend {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      justify-content: center;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-secondary);
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .legend-dot.high { background: var(--danger); }
    .legend-dot.avg  { background: #F39C12; }
    .legend-dot.low  { background: var(--brand-primary); }

    /* ============================================================
       价格列表卡
       ============================================================ */
    .price-list-section {
      background: var(--bg-card);
      margin: 0 16px;
      padding: 18px 16px 4px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .list-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 14px;
      padding-left: 0;
    }
    .list-header {
      display: flex;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-tertiary);
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .list-header .col-1 { flex: 1; text-align: left; white-space: nowrap; }
    .list-header .col-2 { flex: 1.4; text-align: left; white-space: nowrap; }
    .list-header .col-3 { flex: 0.8; text-align: right; white-space: nowrap; }

    .list-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      gap: 8px;
      border-bottom: 1px solid var(--border-light);
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .col-1 { flex: 1; text-align: left; white-space: nowrap; }
    .list-item .col-2 { flex: 1.4; text-align: left; }
    .list-item .col-3 { flex: 0.8; text-align: right; white-space: nowrap; }

    .fruit-name {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .market-cell {
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: 100%;
    }
    .price-cell {
      font-size: 14px;
      font-weight: 500;
      color: var(--brand-primary);
      font-family: var(--font-family-number, inherit);
    }

    /* ============================================================
       Skeleton（加载态）
       ============================================================ */
    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <div class="skeleton-state">
      <div class="page-header">
        <div class="mb-skeleton" style="width:120px;height:24px;"></div>
        <div class="mb-skeleton" style="width:180px;height:14px;margin-top:6px;"></div>
      </div>
      <div class="search-bar">
        <div class="mb-skeleton" style="width:200px;height:40px;border-radius:var(--radius-lg);"></div>
      </div>
      <div class="price-summary">
        <div class="mb-skeleton" style="width:100px;height:14px;margin-bottom:12px;"></div>
        <div style="display:flex;gap:12px;">
          <div class="mb-skeleton" style="flex:1;height:40px;border-radius:var(--radius-md);"></div>
          <div class="mb-skeleton" style="flex:1;height:40px;border-radius:var(--radius-md);"></div>
          <div class="mb-skeleton" style="flex:1;height:40px;border-radius:var(--radius-md);"></div>
        </div>
      </div>
      <div class="chart-section">
        <div class="mb-skeleton" style="width:120px;height:16px;margin-bottom:16px;"></div>
        <div class="mb-skeleton" style="width:100%;height:160px;border-radius:var(--radius-lg);"></div>
      </div>
      <div class="price-list-section">
        <div class="mb-skeleton" style="width:120px;height:16px;margin-bottom:12px;"></div>
        <div class="mb-skeleton-line long"></div>
        <div class="mb-skeleton-line long"></div>
        <div class="mb-skeleton-line long"></div>
        <div class="mb-skeleton-line long"></div>
        <div class="mb-skeleton-line long"></div>
      </div>
    </div>

    <div class="real-content">
      <div class="page-header">
        <div class="header-back" onclick="navigateTo('mb_home.html')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-title">价格指数</div>
        <div class="header-sub">实时掌握柑桔市场行情</div>
      </div>

    <div class="search-bar">
      <div class="search-item" id="marketTrigger" onclick="toggleMarketDropdown(event)">
        <div class="search-label">市场</div>
        <div class="search-value-wrap">
          <span class="search-text" id="marketLabel">全部批发市场</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-arrow"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="search-item" id="varietyTrigger" onclick="toggleVarietyDropdown(event)">
        <div class="search-label">品类</div>
        <div class="search-value-wrap">
          <span class="search-text" id="varietyLabel">南丰蜜桔</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-arrow"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="market-dropdown" id="marketDropdown"></div>
      <div class="variety-dropdown" id="varietyDropdown"></div>
    </div>

    <div class="price-summary">
      <div class="price-date"><span class="date-text">2026-09-10</span><span class="price-alert" onclick="openAlertModal()">⚙ 预警提醒</span></div>
      <div class="price-info">
        <div class="price-item price-item-wide">
          <div class="price-label">当日均价</div>
          <div class="price-value avg" id="priceAvg">2.90<span class="price-unit">元/公斤</span></div>
        </div>
        <div class="price-item price-item-wide">
          <div class="price-label">相比前日</div>
          <div class="price-value change" id="priceChange">±0.00<span class="price-unit">元/公斤</span></div>
        </div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-title">近8天的价格变化</div>
      <span class="chart-unit">元/公斤</span>
      <div class="chart-container">
        <div class="chart-y-axis" id="chartYAxis"></div>
        <div class="chart-area">
          <div class="chart-grid">
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
          </div>
          <div class="chart-content">
            <div class="chart-tooltip" id="chartTooltip">
              <div class="chart-tooltip-date" id="tooltipDate"></div>
              <div class="chart-tooltip-item"><span class="chart-tooltip-label" style="color:var(--danger)">● 最高价</span><span class="chart-tooltip-value" style="color:var(--danger)" id="tooltipHigh"></span></div>
              <div class="chart-tooltip-item"><span class="chart-tooltip-label" style="color:#F39C12">● 均价</span><span class="chart-tooltip-value" style="color:#F39C12" id="tooltipAvg"></span></div>
              <div class="chart-tooltip-item"><span class="chart-tooltip-label" style="color:var(--brand-primary)">● 最低价</span><span class="chart-tooltip-value" style="color:var(--brand-primary)" id="tooltipLow"></span></div>
            </div>
            <svg id="chartSvg" viewBox="0 0 280 136" preserveAspectRatio="none" style="width:100%;height:100%;">
              <path class="chart-line low" id="lineLow" d=""/>
              <path class="chart-line avg" id="lineAvg" d=""/>
              <path class="chart-line high" id="lineHigh" d=""/>
              <g id="chartDots" class="chart-dot-group"></g>
            </svg>
            <div class="chart-points" id="chartPoints"></div>
          </div>
          <div class="chart-x-axis" id="chartXAxis"></div>
        </div>
      </div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot high"></div><span>最高价</span></div>
        <div class="legend-item"><div class="legend-dot avg"></div><span>均价</span></div>
        <div class="legend-item"><div class="legend-dot low"></div><span>最低价</span></div>
      </div>
    </div>

    <div class="price-list-section">
      <div class="list-title">2026-09-10 价格</div>
      <div class="list-header">
        <div class="col-1">品种</div>
        <div class="col-2">市场</div>
        <div class="col-3">价格(元/公斤)</div>
      </div>
      <div id="priceList"></div>
    </div>
    </div>
    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item active">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_data.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>监测</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_disease_knowledge.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>病虫害</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_profile.html')">
        <svg class="mb-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>

    <!-- 预警阈值弹窗 -->
    <div class="alert-modal-mask" id="alertModalMask" onclick="closeAlertModal(event)" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;">
      <div style="background:#fff;border-radius:20px;width:88%;max-width:340px;padding:28px 24px 24px;position:relative;">
        <div style="text-align:center;font-size:18px;font-weight:700;color:var(--text);margin-bottom:24px;">设置预警阈值</div>
        <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;">
          <span style="width:42px;font-size:16px;font-weight:700;color:var(--text);">高于</span>
          <input id="alertHigh" type="number" step="0.01" placeholder="请输入内容" style="flex:1;height:44px;border:1px solid var(--border);border-radius:12px;padding:0 16px;font-size:15px;outline:none;">
        </div>
        <div style="margin-bottom:28px;display:flex;align-items:center;gap:12px;">
          <span style="width:42px;font-size:16px;font-weight:700;color:var(--text);">低于</span>
          <input id="alertLow" type="number" step="0.01" placeholder="请输入内容" style="flex:1;height:44px;border:1px solid var(--border);border-radius:12px;padding:0 16px;font-size:15px;outline:none;">
        </div>
        <div style="display:flex;gap:12px;">
          <button onclick="saveAlert()" style="flex:1;height:48px;border:none;background:var(--primary);color:#fff;font-size:16px;font-weight:700;border-radius:999px;cursor:pointer;">保存阈值</button>
          <button onclick="clearAlert()" style="flex:1;height:48px;border:none;background:#fff;color:var(--primary);font-size:16px;font-weight:700;border-radius:999px;cursor:pointer;border:1px solid var(--primary);">清空阈值</button>
        </div>
        <div onclick="closeAlertModal()" style="position:absolute;top:12px;right:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);font-size:22px;line-height:1;">×</div>
      </div>
    </div>

<script>
    function navigateTo(page) { window.location.href = page; }

    // 预警阈值弹窗
    function openAlertModal() {
      var saved = JSON.parse(localStorage.getItem('priceAlert') || '{}');
      document.getElementById('alertHigh').value = saved.high != null ? saved.high : '';
      document.getElementById('alertLow').value = saved.low != null ? saved.low : '';
      document.getElementById('alertModalMask').style.display = 'flex';
    }
    function closeAlertModal(e) {
      if (e && e.target && e.target.id !== 'alertModalMask') return;
      document.getElementById('alertModalMask').style.display = 'none';
    }
    function saveAlert() {
      var high = document.getElementById('alertHigh').value;
      var low = document.getElementById('alertLow').value;
      localStorage.setItem('priceAlert', JSON.stringify({ high: high || null, low: low || null }));
      closeAlertModal();
    }
    function clearAlert() {
      document.getElementById('alertHigh').value = '';
      document.getElementById('alertLow').value = '';
      localStorage.removeItem('priceAlert');
      closeAlertModal();
    }

    // 品种数据：包含当日均价/相比前日、近8天趋势、各市场详细列表
    var varietyData = {
      'nanfeng': {
        name: '南丰蜜桔',
        today: { avg: 2.90, prev: 2.90, change: 0.00 },
        trend: [
          { date: '09-03', avg: 2.98, high: 3.12, low: 2.85 },
          { date: '09-04', avg: 2.98, high: 3.12, low: 2.85 },
          { date: '09-05', avg: 2.98, high: 3.15, low: 2.82 },
          { date: '09-06', avg: 2.98, high: 3.10, low: 2.80 },
          { date: '09-07', avg: 2.98, high: 3.08, low: 2.78 },
          { date: '09-08', avg: 2.98, high: 3.05, low: 2.76 },
          { date: '09-09', avg: 2.90, high: 3.02, low: 2.70 },
          { date: '09-10', avg: 2.90, high: 3.00, low: 2.72 }
        ],
        markets: [
          { fruit: '南丰蜜桔', origin: '江西南丰市场', market: '江西南丰市', price: 2.60 },
          { fruit: '南丰蜜桔', origin: '山东潍坊市场', market: '山东潍坊市', price: 2.90 },
          { fruit: '南丰蜜桔', origin: '浙江杭州市场', market: '浙江杭州市', price: 3.10 },
          { fruit: '南丰蜜桔', origin: '上海农产品市场', market: '上海农产品市场', price: 3.30 },
          { fruit: '南丰蜜桔', origin: '广东广州市场', market: '广东广州市', price: 3.50 }
        ]
      },
      'huangyan': {
        name: '黄岩蜜桔',
        today: { avg: 3.40, prev: 3.35, change: 0.05 },
        trend: [
          { date: '09-03', avg: 3.65, high: 3.80, low: 3.50 },
          { date: '09-04', avg: 3.60, high: 3.75, low: 3.45 },
          { date: '09-05', avg: 3.75, high: 3.90, low: 3.60 },
          { date: '09-06', avg: 3.85, high: 4.00, low: 3.70 },
          { date: '09-07', avg: 3.90, high: 4.05, low: 3.75 },
          { date: '09-08', avg: 3.80, high: 3.95, low: 3.65 },
          { date: '09-09', avg: 3.60, high: 3.78, low: 3.45 },
          { date: '09-10', avg: 3.70, high: 3.88, low: 3.55 }
        ],
        markets: [
          { fruit: '黄岩蜜桔', origin: '浙江黄岩市场', market: '浙江黄岩市', price: 2.70 },
          { fruit: '黄岩蜜桔', origin: '上海农产品市场', market: '上海农产品市场', price: 3.40 },
          { fruit: '黄岩蜜桔', origin: '江苏南京市场', market: '江苏南京市', price: 3.60 },
          { fruit: '黄岩蜜桔', origin: '北京新发地市场', market: '北京新发地市场', price: 4.20 },
          { fruit: '黄岩蜜桔', origin: '广东深圳市场', market: '广东深圳市', price: 4.80 }
        ]
      },
      'shimen': {
        name: '石门蜜桔',
        today: { avg: 2.55, prev: 2.60, change: -0.05 },
        trend: [
          { date: '09-03', avg: 2.80, high: 2.95, low: 2.65 },
          { date: '09-04', avg: 2.75, high: 2.90, low: 2.60 },
          { date: '09-05', avg: 2.90, high: 3.05, low: 2.75 },
          { date: '09-06', avg: 2.95, high: 3.10, low: 2.80 },
          { date: '09-07', avg: 3.00, high: 3.18, low: 2.82 },
          { date: '09-08', avg: 2.85, high: 3.00, low: 2.70 },
          { date: '09-09', avg: 2.70, high: 2.85, low: 2.55 },
          { date: '09-10', avg: 2.75, high: 2.90, low: 2.60 }
        ],
        markets: [
          { fruit: '石门蜜桔', origin: '湖南石门市场', market: '湖南石门市', price: 2.00 },
          { fruit: '石门蜜桔', origin: '湖北武汉市场', market: '湖北武汉市', price: 2.35 },
          { fruit: '石门蜜桔', origin: '河南郑州市场', market: '河南郑州市', price: 2.60 },
          { fruit: '石门蜜桔', origin: '上海农产品市场', market: '上海农产品市场', price: 2.95 },
          { fruit: '石门蜜桔', origin: '广东广州市场', market: '广东广州市', price: 3.30 }
        ]
      },
      'yongquan': {
        name: '涌泉蜜桔',
        today: { avg: 3.95, prev: 3.90, change: 0.05 },
        trend: [
          { date: '09-03', avg: 4.25, high: 4.45, low: 4.05 },
          { date: '09-04', avg: 4.20, high: 4.40, low: 4.00 },
          { date: '09-05', avg: 4.40, high: 4.60, low: 4.20 },
          { date: '09-06', avg: 4.50, high: 4.70, low: 4.30 },
          { date: '09-07', avg: 4.60, high: 4.82, low: 4.40 },
          { date: '09-08', avg: 4.40, high: 4.60, low: 4.20 },
          { date: '09-09', avg: 4.20, high: 4.40, low: 4.00 },
          { date: '09-10', avg: 4.30, high: 4.50, low: 4.10 }
        ],
        markets: [
          { fruit: '涌泉蜜桔', origin: '浙江涌泉市场', market: '浙江涌泉市', price: 3.10 },
          { fruit: '涌泉蜜桔', origin: '上海农产品市场', market: '上海农产品市场', price: 3.95 },
          { fruit: '涌泉蜜桔', origin: '江苏苏州市场', market: '江苏苏州市', price: 4.40 },
          { fruit: '涌泉蜜桔', origin: '北京新发地市场', market: '北京新发地市场', price: 5.00 },
          { fruit: '涌泉蜜桔', origin: '广东深圳市场', market: '广东深圳市', price: 5.50 }
        ]
      }
    };

    var varietyKeys = ['nanfeng', 'huangyan', 'shimen', 'yongquan'];
    var currentVariety = 'nanfeng';
    var chartData = varietyData[currentVariety].trend;

    // 从所有品种里汇总去重批发市场列表
    var marketList = (function() {
      var set = {};
      var arr = [];
      varietyKeys.forEach(function(k) {
        varietyData[k].markets.forEach(function(m) {
          if (!set[m.origin]) {
            set[m.origin] = true;
            arr.push(m.origin);
          }
        });
      });
      return arr;
    })();
    var currentMarket = 'all';

    // 构建市场下拉
    function buildMarketDropdown() {
      var dd = document.getElementById('marketDropdown');
      var html = '';
      html += '<div class="market-option' + (currentMarket === 'all' ? ' active' : '') +
              '" data-key="all" onclick="selectMarket(\'all\', event)">' +
              '<span>全部批发市场</span>' +
              '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
              '</div>';
      marketList.forEach(function(name) {
        html += '<div class="market-option' + (currentMarket === name ? ' active' : '') +
                '" data-key="' + name + '" onclick="selectMarket(\'' + name.replace(/'/g, "\\'") + '\', event)">' +
                '<span>' + name + '</span>' +
                '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                '</div>';
      });
      dd.innerHTML = html;
    }

    function openMarketDropdown() {
      closeVarietyDropdown();
      document.getElementById('marketDropdown').classList.add('show');
      document.getElementById('marketTrigger').classList.add('open');
    }

    function closeMarketDropdown() {
      var dd = document.getElementById('marketDropdown');
      var trigger = document.getElementById('marketTrigger');
      if (dd) dd.classList.remove('show');
      if (trigger) trigger.classList.remove('open');
    }

    function toggleMarketDropdown(e) {
      if (e) { e.stopPropagation(); }
      var dd = document.getElementById('marketDropdown');
      if (dd.classList.contains('show')) {
        closeMarketDropdown();
      } else {
        openMarketDropdown();
      }
    }

    function selectMarket(key, e) {
      if (e) { e.stopPropagation(); }
      currentMarket = key;
      document.getElementById('marketLabel').textContent = key === 'all' ? '全部批发市场' : key;
      buildMarketDropdown();
      renderPriceList();
      closeMarketDropdown();
    }

    // 构建品种下拉
    function buildVarietyDropdown() {
      var dd = document.getElementById('varietyDropdown');
      var html = '';
      varietyKeys.forEach(function(key) {
        var v = varietyData[key];
        html += '<div class="variety-option' + (key === currentVariety ? ' active' : '') +
                '" data-key="' + key + '" onclick="selectVariety(\'' + key + '\', event)">' +
                '<span>' + v.name + '</span>' +
                '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                '</div>';
      });
      dd.innerHTML = html;
    }

    function openVarietyDropdown() {
      closeMarketDropdown();
      document.getElementById('varietyDropdown').classList.add('show');
      document.getElementById('varietyTrigger').classList.add('open');
    }

    function closeVarietyDropdown() {
      var dd = document.getElementById('varietyDropdown');
      var trigger = document.getElementById('varietyTrigger');
      if (dd) dd.classList.remove('show');
      if (trigger) trigger.classList.remove('open');
    }

    function toggleVarietyDropdown(e) {
      if (e) { e.stopPropagation(); }
      var dd = document.getElementById('varietyDropdown');
      if (dd.classList.contains('show')) {
        closeVarietyDropdown();
      } else {
        openVarietyDropdown();
      }
    }

    function selectVariety(key, e) {
      if (e) { e.stopPropagation(); }
      currentVariety = key;
      document.getElementById('varietyLabel').textContent = varietyData[key].name;
      buildVarietyDropdown();
      renderAll();
      closeVarietyDropdown();
    }

    document.addEventListener('click', function(e) {
      var vTrigger = document.getElementById('varietyTrigger');
      var vDd = document.getElementById('varietyDropdown');
      if (vTrigger && vDd && !vTrigger.contains(e.target) && !vDd.contains(e.target)) {
        closeVarietyDropdown();
      }
      var mTrigger = document.getElementById('marketTrigger');
      var mDd = document.getElementById('marketDropdown');
      if (mTrigger && mDd && !mTrigger.contains(e.target) && !mDd.contains(e.target)) {
        closeMarketDropdown();
      }
    });

    // 渲染当日价格
    function renderTodayPrice() {
      var d = varietyData[currentVariety].today;
      document.getElementById('priceAvg').innerHTML = d.avg.toFixed(2) + '<span class="price-unit">元/公斤</span>';
      var changeEl = document.getElementById('priceChange');
      var sign = d.change > 0 ? '+' : (d.change < 0 ? '' : '±');
      // 0 及以上用绿色，0 以下用红色
      var changeColor = d.change >= 0 ? 'var(--success)' : 'var(--danger)';
      changeEl.style.color = changeColor;
      changeEl.innerHTML = sign + d.change.toFixed(2) + '<span class="price-unit">元/公斤</span>';
    }

    // 渲染近8天图表
    function buildLinePath(values, min, max) {
      var W = 280, H = 140, padTop = 10, padBottom = 20;
      var range = max - min || 1;
      var stepX = W / (values.length - 1);
      var points = values.map(function(v, i) {
        var x = i * stepX;
        var y = padTop + (1 - (v - min) / range) * (H - padTop - padBottom);
        return [x, y];
      });
      var d = 'M' + points[0][0].toFixed(1) + ',' + points[0][1].toFixed(1);
      for (var i = 1; i < points.length; i++) {
        var prev = points[i - 1];
        var curr = points[i];
        var cx = (prev[0] + curr[0]) / 2;
        d += ' Q' + cx.toFixed(1) + ',' + prev[1].toFixed(1) + ' ' + cx.toFixed(1) + ',' + ((prev[1] + curr[1]) / 2).toFixed(1);
        d += ' T' + curr[0].toFixed(1) + ',' + curr[1].toFixed(1);
      }
      return d;
    }

    function renderChart() {
      var highs = chartData.map(function(d) { return d.high; });
      var avgs  = chartData.map(function(d) { return d.avg; });
      var lows  = chartData.map(function(d) { return d.low; });
      var allVals = highs.concat(avgs).concat(lows);
      var minV = Math.min.apply(null, allVals);
      var maxV = Math.max.apply(null, allVals);
      var rawStep = (maxV - minV) / 5 || 1;
      var mag = Math.pow(10, Math.floor(Math.log(rawStep) / Math.LN10));
      var norm = rawStep / mag;
      var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
      minV = Math.floor((minV - step) / step) * step;
      maxV = Math.ceil((maxV + step) / step) * step;
      if (minV < 0) minV = 0;
      var dec = step >= 1 ? 0 : (step >= 0.1 ? 1 : 2);

      // Y 轴
      var yHtml = '';
      var ticks = 5;
      for (var i = 0; i <= ticks; i++) {
        var v = maxV - (i * (maxV - minV) / ticks);
        yHtml += '<span class="chart-y-label">' + v.toFixed(dec) + '</span>';
      }
      document.getElementById('chartYAxis').innerHTML = yHtml;

      // X 轴
      var xHtml = '';
      chartData.forEach(function(d) {
        xHtml += '<span class="chart-x-label">' + d.date + '</span>';
      });
      document.getElementById('chartXAxis').innerHTML = xHtml;

      // 三条折线
      document.getElementById('lineLow').setAttribute('d',  buildLinePath(lows,  minV, maxV));
      document.getElementById('lineAvg').setAttribute('d',  buildLinePath(avgs,  minV, maxV));
      document.getElementById('lineHigh').setAttribute('d', buildLinePath(highs, minV, maxV));

      // 圆点组（均价线圆点，更醒目）
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var dotsGroup = document.getElementById('chartDots');
      dotsGroup.innerHTML = '';
      var W = 280, H = 136, padTop = 10, padBottom = 22;
      var range = maxV - minV || 1;
      chartData.forEach(function(d, i) {
        var x = i === 0 ? 0 : (i / (chartData.length - 1)) * W;
        ['high', 'avg', 'low'].forEach(function(key) {
          var val = d[key];
          var y = padTop + (1 - (val - minV) / range) * (H - padTop - padBottom);
          var circle = document.createElementNS(SVG_NS, 'circle');
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', y);
          circle.setAttribute('r', 3);
          circle.setAttribute('class', 'chart-dot ' + key);
          dotsGroup.appendChild(circle);
        });
      });

      // 交互点
      var container = document.getElementById('chartPoints');
      container.innerHTML = '';
      chartData.forEach(function(item, index) {
        var x = (index / (chartData.length - 1)) * 100;
        var point = document.createElement('div');
        point.className = 'chart-point';
        point.style.left = x + '%';
        point.setAttribute('data-index', index);
        point.addEventListener('mouseenter', function(e) { showTooltip(index, e); });
        point.addEventListener('mouseleave', hideTooltip);
        container.appendChild(point);
      });
    }

    // 渲染价格列表
    function renderPriceList() {
      var list = document.getElementById('priceList');
      var markets = varietyData[currentVariety].markets;
      var filtered = currentMarket === 'all'
        ? markets
        : markets.filter(function(m) { return m.origin === currentMarket; });
      if (filtered.length === 0) {
        list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:var(--font-sm);">该批发市场暂无数据</div>';
        return;
      }
      var html = '';
      filtered.forEach(function(m) {
        html += '<div class="list-item">' +
                  '<div class="col-1"><div class="fruit-name">' + m.fruit + '</div></div>' +
                  '<div class="col-2"><span class="market-cell">' + m.market + '</span></div>' +
                  '<div class="col-3"><span class="price-cell">' + m.price.toFixed(2) + '</span></div>' +
                '</div>';
      });
      list.innerHTML = html;
    }

    function renderAll() {
      chartData = varietyData[currentVariety].trend;
      renderTodayPrice();
      renderChart();
      renderPriceList();
    }

    function showTooltip(index, event) {
      var data = chartData[index];
      var tooltip = document.getElementById('chartTooltip');
      document.getElementById('tooltipDate').textContent = data.date;
      document.getElementById('tooltipHigh').textContent = data.high.toFixed(2) + ' 元/公斤';
      document.getElementById('tooltipAvg').textContent  = data.avg.toFixed(2)  + ' 元/公斤';
      document.getElementById('tooltipLow').textContent = data.low.toFixed(2) + ' 元/公斤';
      tooltip.classList.add('show');
      var rect = event.currentTarget.getBoundingClientRect();
      var containerRect = document.querySelector('.chart-content').getBoundingClientRect();
      tooltip.style.left = (rect.left - containerRect.left + rect.width / 2 - 72) + 'px';
      tooltip.style.top = (rect.top - containerRect.top - 70) + 'px';
    }

    function hideTooltip() {
      document.getElementById('chartTooltip').classList.remove('show');
    }

    buildVarietyDropdown();
    buildMarketDropdown();
    renderAll();

    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
